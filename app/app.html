      g += `<rect class="hit" x="${L + gw * i}" y="${T}" width="${gw}" height="${ih}" rx="6" data-tip="${esc(tips[i])}"${acts ? ` ${acts[i]} style="cursor:pointer"` : ""}/>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
  }
  function roundBottom(x, y, w, h, r) { r = Math.min(r, h, w / 2); return `M${x},${y}H${x + w}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x + r}Q${x},${y + h} ${x},${y + h - r}Z`; }

  function viewYear() {
    if (!ui.year) ui.year = +ui.month.slice(0, 4);
    const Y = yearSummary(state, ui.year), t = Y.tot, act = Math.max(1, Y.activeMonths);
    const kpi = (label, value, color, sub) => `<div class="kpi" style="--k:${color}"><div class="label">${label}</div><div class="value num">${value}</div><div class="sub">${sub}</div></div>`;
    const short = Y.months.map(m => monthShort(m.ym));
    const curIdx = Y.months.findIndex(m => m.ym === ui.month);
    let h = `<div class="page-head"><div><h1>Jaaroverzicht ${ui.year}</h1><p>${Y.activeMonths} maand${Y.activeMonths === 1 ? "" : "en"} met transacties</p></div><div class="actions">${periodSeg()}
      <div class="month" role="group" aria-label="Jaar kiezen"><button type="button" data-act="prev-year" aria-label="Vorig jaar">‹</button><span style="min-width:70px">${ui.year}</span><button type="button" data-act="next-year" aria-label="Volgend jaar">›</button></div></div></div>${notices()}`;
    h += `<section class="kpis">
      ${kpi("Inkomsten", `<span class="pos">${eur0(t.income)}</span>`, "var(--pos)", `gem. ${eur0(t.income / act)} per maand`)}
      ${(() => { const yb = state.categories.filter(c => c.type === "Vaste kosten" || c.type === "Variabele kosten").reduce((a, c) => a + yearlyBudget(c), 0);
        return kpi("Uitgaven", `<span class="neg">${eur0(t.expenses)}</span>`, "var(--neg)", yb ? `${Math.round(t.expenses / yb * 100)}% van jaarbudget ${eur0(yb)}` : `gem. ${eur0(t.expenses / act)} per maand`); })()}
      ${kpi("Gespaard", `<span class="gold">${eur0(t.saved)}</span>`, "var(--gold)", t.income ? `${Math.round(t.saved / t.income * 100)}% van je inkomen` : "&nbsp;")}
      ${kpi("Netto dit jaar", `<span class="${t.net >= 0 ? "pos" : "neg"}">${t.net >= 0 ? "+" : "−"}${eur0(Math.abs(t.net))}</span>`, t.net >= 0 ? "var(--pos)" : "var(--neg)", t.uncat ? `<span class="chip warn">${t.uncat} te categoriseren</span>` : "&nbsp;")}
    </section>`;
    const tips = Y.months.map(m => `<b>${esc(monthName(m.ym))}</b><br>Inkomsten: ${eur(m.s.income)}<br>Uitgaven: ${eur(m.s.expenses + Math.max(0, -m.s.uncat))}<br>Gespaard: ${eur(m.s.saved)}<br>Netto: ${signed(m.s.net)}`);
    h += `<section class="card chart"><div class="card-head"><h2>Inkomsten en uitgaven per maand</h2><span class="hint">Klik op een maand om ze te openen</span></div>
      ${bars({ labels: short, current: curIdx, tips, acts: Y.months.map(m => `data-act="open-month" data-month="${m.ym}"`), series: [
        { values: Y.months.map(m => m.s.income || null), color: "var(--pos)" },
        { values: Y.months.map(m => (m.s.expenses + Math.max(0, -m.s.uncat)) || null), color: "var(--neg)" },
        { values: Y.months.map(m => m.s.saved || null), color: "var(--accent)" }] })}
      <div class="legend"><span><i style="background:var(--pos)"></i>Inkomsten</span><span><i style="background:var(--neg)"></i>Uitgaven (incl. te categoriseren)</span><span><i style="background:var(--accent)"></i>Gespaard</span></div></section>`;
    const anyRoll = state.categories.some(c => (c.type === "Vaste kosten" || c.type === "Variabele kosten") && rolls(c) && monthlyBudget(c) > 0);
    if (anyRoll) {
      const btips = Y.months.map(m => m.buffer === null ? `<b>${esc(monthName(m.ym))}</b><br>Geen gegevens` : `<b>${esc(monthName(m.ym))}</b><br>Budgetbuffer op het einde: ${signed(m.buffer)}<br><span style="opacity:.8">Dit gaat mee naar de volgende maand.</span>`);
      h += `<section class="card chart"><div class="card-head"><h2>Budgetbuffer</h2><span class="hint">Opgebouwd overschot (+) of tekort (−) van de categorieën die je meeneemt, telkens op het einde van de maand</span></div>
        ${bars({ labels: short, current: curIdx, tips: btips, height: 190, series: [{ values: Y.months.map(m => m.buffer), color: v => v >= 0 ? "var(--pos)" : "var(--neg)" }] })}</section>`;
    } else {
      h += `<div class="notice info"><span>Stel bij Budget een maandbudget in en kies welke categorieën je meeneemt, dan zie je hier hoe je budgetbuffer over het jaar opbouwt.</span><a class="btn small" href="#budget">Naar Budget</a></div>`;
    }
    h += heatTable(Y, curIdx, act);
    return h;
  }

  function heatTable(Y, curIdx, act) {
    // alle eigen categorieën, in dezelfde volgorde als het tabblad Budget (inkomen niet; overboekingen enkel als er iets is)
    const rows = state.categories.filter(c => c.type !== "Inkomen").map(c => ({ c, vals: Y.months.map(m => Math.max(0, -(m.s.byCat[c.name] || 0))) }));
    rows.push({ c: { name: UNCAT, type: "Onbekend", budget: 0 }, vals: Y.months.map(m => Math.max(0, -(m.s.byCat[UNCAT] || 0))) });
    const shown = rows.filter(r => (r.c.type !== "Overboeking" && r.c.type !== "Onbekend") || r.vals.some(v => v > 0));
    let h = `<section class="card"><div class="card-head"><h2>Per categorie en maand</h2><span class="hint">Hoe donkerder, hoe meer van het budget gebruikt. Rood = boven budget. Bij een jaarbudget telt het jaartotaal.</span></div><div class="table-wrap"><table class="heat"><thead><tr><th>Categorie</th>${Y.months.map((m, i) => `<th class="r${i === curIdx ? " cur" : ""}">${monthShort(m.ym)}</th>`).join("")}<th class="r">Totaal</th><th class="r">Gem./mnd</th><th class="r">Budget/jaar</th><th class="r">Gebruikt</th></tr></thead><tbody>`;
    if (!shown.length) h += `<tr class="empty-row"><td colspan="17">Nog geen uitgaven in ${ui.year}.</td></tr>`;
    for (const r of shown) {
      const b = monthlyBudget(r.c), yb = yearlyBudget(r.c), rowMax = Math.max(1, ...r.vals), total = r.vals.reduce((a, v) => a + v, 0);
      const yearOnly = +r.c.budgetYear > 0 && !(+r.c.budget > 0); let cum = 0;
      h += `<tr><td class="name${r.c.type === "Onbekend" ? " muted" : ""}">${esc(r.c.name)}${+r.c.budgetYear > 0 ? ' <span class="muted" style="font-size:11px" title="Heeft een jaarbudget">/jr</span>' : ""}</td>` + r.vals.map((v, i) => {
        cum += v;
        if (!v) return `<td class="cell muted${i === curIdx ? " cur" : ""}">·</td>`;
        const ratio = yearOnly ? v / yb : b ? v / b : v / rowMax, over = yearOnly ? cum > yb : b && v > b;
        const bg = over ? `color-mix(in srgb, var(--neg) ${Math.min(45, 18 + (ratio - 1) * 40)}%, transparent)` : `color-mix(in srgb, var(--bar) ${Math.round(8 + Math.min(1, ratio) * 42)}%, transparent)`;
        const tip = `<b>${esc(r.c.name)}</b> · ${esc(monthName(Y.months[i].ym))}<br>${r.c.type === "Sparen" ? "Gespaard" : "Uitgegeven"}: ${eur(v)}${yearOnly ? `<br>${Math.round(ratio * 100)}% van jaarbudget ${eur(yb)}<br>Tot nu dit jaar: ${eur(cum)}` : b ? `<br>Budget: ${eur(b)} (${Math.round(ratio * 100)}%)` : ""}`;
        return `<td class="cell num${i === curIdx ? " cur" : ""}" style="background:${bg}" data-tip="${esc(tip)}">${Math.round(v).toLocaleString("nl-BE")}</td>`;
      }).join("") + `<td class="r num" style="font-weight:600">${eur0(total)}</td><td class="r num muted">${eur0(total / act)}</td><td class="r num muted">${yb ? eur0(yb) : "—"}</td><td class="r num ${yb ? (total > yb ? "neg" : "pos") : "muted"}">${yb ? Math.round(total / yb * 100) + "%" : "—"}</td></tr>`;
    }
    return h + `</tbody></table></div></section>`;
  }

  function catChart(s) {
    const env = envelopes(state, ui.month);
    const rows = state.categories.filter(c => c.type === "Vaste kosten" || c.type === "Variabele kosten")
      .map(c => { const e = env[c.name]; return { name: c.name, type: c.type, actual: Math.max(0, -(s.byCat[c.name] || 0)), budget: e ? Math.max(0, e.available) : 0, base: monthlyBudget(c), yearB: +c.budgetYear || 0, carry: e ? e.carryIn : 0, roll: e && e.roll }; })
      .filter(r => r.actual > 0 || r.budget > 0)
      ;
    if (s.uncatCount && s.uncat < 0) rows.push({ name: UNCAT, actual: -s.uncat, budget: 0, uncat: true });
    const max = Math.max(1, ...rows.map(r => Math.max(r.actual, r.budget)));
    const hasBudget = rows.some(r => r.budget);
    let h = `<div class="card-head"><h2>Uitgaven per categorie</h2><span class="hint">${hasBudget ? "Balk = uitgegeven, streep = beschikbaar budget" : "Stel budgetten in bij Budget om te vergelijken"}</span></div>`;
    if (!rows.length) return h + `<p class="muted">Geen uitgaven in deze maand.</p>`;
    h += `<div class="cats">` + rows.map(r => {
      const over = r.budget && r.actual > r.budget;
      const tip = `<b>${esc(r.name)}</b><br>Uitgegeven: ${eur(r.actual)}` + (r.base ? `<br>Budget: ${eur(r.base)} per maand${r.yearB ? ` (incl. ${eur(r.yearB)}/jaar ÷ 12)` : ""}` + (r.roll && r.carry ? `<br>Overgedragen: ${signed(r.carry)}<br>Beschikbaar: ${eur(r.budget)}` : "") + `<br>${over ? "Boven budget: " + eur(r.actual - r.budget) : "Nog over: " + eur(r.budget - r.actual)}` : "");
      return `<div class="cat-row" data-tip="${esc(tip)}" ${r.uncat ? 'data-act="show-uncat" style="cursor:pointer"' : `data-act="show-cat" data-cat="${esc(r.name)}" style="cursor:pointer"`}>
        <span class="name${r.uncat ? " muted" : ""}">${esc(r.name)}</span>
        <span class="track"><span class="fill${over ? " over" : ""}" style="width:${(r.actual / max * 100).toFixed(2)}%;${r.uncat ? "background:var(--warn);opacity:.55" : ""}"></span>${r.budget ? `<span class="budget-tick" style="left:calc(${(r.budget / max * 100).toFixed(2)}% - 1px)"></span>` : ""}</span>
        <span class="amt num">${eur(r.actual)}${over ? ` <span class="neg" title="Boven budget">▲</span>` : ""}</span></div>`;
    }).join("") + `</div>`;
    h += `<div class="legend"><span><i style="background:var(--bar)"></i>Uitgegeven</span>${hasBudget ? `<span><i class="tick"></i>Budget (incl. overgedragen)</span><span><i style="background:var(--neg)"></i>Boven budget</span>` : ""}${s.uncatCount && s.uncat < 0 ? `<span><i style="background:var(--warn);opacity:.55"></i>Te categoriseren</span>` : ""}</div>`;
    return h;
  }

  function trendChart() {
    const months = []; for (let i = 5; i >= 0; i--) months.push(shiftMonth(ui.month, -i));
    const data = months.map(m => { const s = monthSummary(state, m); return { m, inc: s.income, exp: s.expenses + Math.max(0, -s.uncat), net: s.net }; });
    const W = 420, H = 190, L = 44, B = 22, T = 8, iw = W - L - 6, ih = H - B - T;
    const max = Math.max(1, ...data.map(d => Math.max(d.inc, d.exp)));
    const step = niceStep(max / 3), top = Math.ceil(max / step) * step;
    const y = v => T + ih - v / top * ih, gw = iw / months.length, bw = Math.min(16, gw / 3.2);
    let g = "";
    for (let v = 0; v <= top + 1e-9; v += step) g += `<line class="grid" x1="${L}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}" ${v === 0 ? 'style="stroke:var(--muted);opacity:.5"' : ""}/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? (v / 1000).toLocaleString("nl-BE") + "k" : v}</text>`;
    data.forEach((d, i) => {
      const cx = L + gw * i + gw / 2;
      const bar = (x, v, col) => v > 0 ? `<path d="${roundTop(x, y(v), bw, T + ih - y(v), 3)}" fill="${col}"${d.m === ui.month ? "" : ' opacity=".55"'}/>` : "";
      g += bar(cx - bw - 1, d.inc, "var(--pos)") + bar(cx + 1, d.exp, "var(--neg)");
      g += `<text x="${cx}" y="${H - 6}" text-anchor="middle" style="${d.m === ui.month ? "fill:var(--ink);font-weight:600" : ""}">${monthShort(d.m)}</text>`;
      const tip = `<b>${esc(monthName(d.m))}</b><br>Inkomsten: ${eur(d.inc)}<br>Uitgaven: ${eur(d.exp)}<br>Netto: ${signed(d.net)}`;
      g += `<rect class="hit" x="${L + gw * i}" y="${T}" width="${gw}" height="${ih}" rx="6" data-tip="${esc(tip)}" data-act="goto-month" data-month="${d.m}" style="cursor:pointer"/>`;
    });
    return `<div class="card-head"><h2>Laatste 6 maanden</h2><span class="hint">Klik op een maand</span></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Inkomsten en uitgaven over de laatste zes maanden">${g}</svg>
      <div class="legend"><span><i style="background:var(--pos)"></i>Inkomsten</span><span><i style="background:var(--neg)"></i>Uitgaven (incl. te categoriseren)</span></div>`;
  }
  function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x || 1))); const n = x / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
  function roundTop(x, y, w, h, r) { r = Math.min(r, h, w / 2); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }

  function goalsCard() {
    let h = `<div class="card-head"><h2>Spaardoelen</h2><a class="hint" href="#spaardoelen">Beheren</a></div>`;
    if (!state.goals.length) return h + `<p class="muted">Nog geen spaardoelen.</p>`;
    return h + `<div class="goals">` + state.goals.map(g => {
      const p = goalProgress(state, g);
      return `<div class="goal"><div class="top"><b>${esc(g.name)}</b><span class="num">${eur0(p.total)}${p.target ? ` <span class="muted">/ ${eur0(p.target)}</span>` : ""}</span></div>
        <div class="track"><div class="fill" style="width:${((p.pct || 0) * 100).toFixed(1)}%"></div></div>
        <div class="meta">${p.target ? (p.left === 0 ? "Doel bereikt" : p.perMonth ? `Nog ${eur0(p.left)} · ${eur0(p.perMonth)} per maand tot ${fmtDate(g.deadline)}` : `Nog ${eur0(p.left)}`) : "Stel een doelbedrag in"}</div></div>`;
    }).join("") + `</div>`;
  }

  function txRow(t) {
    const open = ui.open.has(t.id);
    return `<tr class="${open ? "open" : ""}" data-id="${esc(t.id)}">
      <td class="num muted" style="width:96px">${fmtDate(t.date)}</td>
      <td class="desc"><div class="d" data-act="toggle-raw" title="Klik voor de volledige bankomschrijving">${esc(t.desc)}</div>${(t.tags && t.tags.length) || (t.splits && t.splits.length) ? `<div class="tagrow">${(t.splits || []).length ? `<span class="tag split" data-act="split-tx" title="Gesplitst">⑂ ${t.splits.map(x => esc(x.cat) + " " + eur0(Math.abs(x.amount))).join(" · ")}</span>` : ""}${(t.tags || []).map(g => `<span class="tag" data-act="tag-filter" data-tag="${esc(g)}">#${esc(g)}</span>`).join("")}</div>` : ""}${t.raw ? `<div class="raw">${esc(t.raw)}</div>` : ""}</td>
      <td>${t.splits && t.splits.length ? `<button class="btn small" data-act="split-tx" type="button" title="Gesplitst over ${t.splits.length} categorieën">⑂ Gesplitst</button>` : `<select class="cat${t.cat === UNCAT ? " uncat" : ""}" data-act="set-cat" aria-label="Categorie">${catOptions(t.cat)}</select>`}</td>
      <td class="r num amount ${t.amount >= 0 ? "pos" : "neg"}">${signed(t.amount)}</td>
      <td class="r" style="width:176px;white-space:nowrap"><button class="btn small ghost" data-act="tag-tx" type="button" title="Labels">#</button><button class="btn small ghost" data-act="split-tx" type="button" title="Splitsen over categorieën">⑂</button><button class="btn small ghost" data-act="make-rule" type="button" title="Maak een regel op basis van deze transactie">Regel</button><button class="btn small ghost" data-act="del-tx" type="button" aria-label="Verwijderen" title="Verwijderen">✕</button></td></tr>`;
  }

  function allTags() { const s2 = new Set(); for (const t of state.transactions) for (const g of (t.tags || [])) s2.add(g); return [...s2].sort((a, b) => a.localeCompare(b)); }
  function tagsCard() {
    const tags = allTags(); if (!tags.length) return "";
    const rows = tags.map(g => { const tx = state.transactions.filter(t => (t.tags || []).includes(g)); const out = tx.filter(t => t.amount < 0).reduce((a, t) => a - t.amount, 0), inn = tx.filter(t => t.amount > 0).reduce((a, t) => a + t.amount, 0); const dates = tx.map(t => t.date).sort();
      return `<div class="row-i" style="grid-template-columns:1fr auto auto auto"><span class="tag" data-act="tag-filter" data-tag="${esc(g)}" style="justify-self:start;font-size:12.5px">#${esc(g)}</span><span class="muted" style="font-size:12.5px">${tx.length}× · ${fmtDate(dates[0])} – ${fmtDate(dates[dates.length - 1])}</span>${inn ? `<span class="num pos">+${eur(inn)}</span>` : "<span></span>"}<span class="num neg">−${eur(out)}</span></div>`; }).join("");
    return `<section class="card"><div class="card-head"><h2>Labels</h2>${ui.txTag ? `<button class="btn small" data-act="tag-clear" type="button">Filter #${esc(ui.txTag)} wissen</button>` : `<span class="hint">Klik op een label om te filteren (over alle maanden)</span>`}</div><div class="soon-list">${rows}</div></section>`;
  }
  function tagDialog(t) {
    const tags = allTags();
    dialog(`<h3>Labels</h3><p>${esc(t.desc)} · ${signed(t.amount)}</p><label for="tg-in">Labels, gescheiden door een komma</label><input class="input" id="tg-in" list="tg-list" value="${esc((t.tags || []).join(", "))}" placeholder="bv. vakantie spanje 2026, auto"><datalist id="tg-list">${tags.map(g => `<option value="${esc(g)}">`).join("")}</datalist>
      ${tags.length ? `<div class="tagrow" style="margin-top:10px">${tags.map(g => `<span class="tag" data-add="${esc(g)}">#${esc(g)}</span>`).join("")}</div>` : ""}
      <div class="row"><button class="btn" data-close type="button">Annuleren</button><button class="btn primary" id="tg-ok" type="button">Opslaan</button></div>`, d => {
      const inp = d.querySelector("#tg-in"); inp.focus();
      d.querySelectorAll("[data-add]").forEach(el => el.addEventListener("click", () => { const cur = inp.value.split(",").map(x => x.trim()).filter(Boolean); if (!cur.includes(el.dataset.add)) cur.push(el.dataset.add); inp.value = cur.join(", "); }));
      d.querySelector("#tg-ok").addEventListener("click", () => { t.tags = [...new Set(inp.value.split(",").map(x => x.trim().toLowerCase()).filter(Boolean))]; save(); d.close(); render(); });
    });
  }
  function splitDialog(t) {
    const sign = t.amount < 0 ? -1 : 1, total = Math.abs(t.amount);
    let parts = (t.splits && t.splits.length ? t.splits.map(x => ({ cat: x.cat, amt: Math.abs(x.amount) })) : [{ cat: t.cat === UNCAT ? "" : t.cat, amt: total }, { cat: "", amt: 0 }]);
    const opts = sel => `<option value="">— kies —</option>` + state.categories.map(c => `<option${c.name === sel ? " selected" : ""}>${esc(c.name)}</option>`).join("");
    const draw = d => {
      const box = d.querySelector("#sp-rows");
      box.innerHTML = parts.map((p, i) => `<div class="split-row" data-i="${i}"><select class="input" data-f="cat">${opts(p.cat)}</select><input class="input num" data-f="amt" inputmode="decimal" value="${String(p.amt).replace(".", ",")}"><button class="btn small ghost" data-f="del" type="button" aria-label="Verwijderen">✕</button></div>`).join("");
      const sum = parts.reduce((a, p) => a + (+p.amt || 0), 0), rest = Math.round((total - sum) * 100) / 100;
      d.querySelector("#sp-rest").innerHTML = Math.abs(rest) < 0.005 ? `<span class="pos">Verdeeld ✓</span>` : `Nog te verdelen: <b class="num ${rest < 0 ? "neg" : ""}">${eur(rest)}</b>`;
    };
    dialog(`<h3>Transactie splitsen</h3><p>${esc(t.desc)} · <b class="num">${signed(t.amount)}</b></p><div id="sp-rows"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><button class="btn small" id="sp-add" type="button">+ Deel</button><span id="sp-rest"></span></div>
      <p id="sp-err" class="neg" style="margin:8px 0 0;font-size:12.5px"></p>
      <div class="row">${t.splits && t.splits.length ? `<button class="btn danger" id="sp-undo" type="button">Splitsing opheffen</button>` : ""}<button class="btn" data-close type="button">Annuleren</button><button class="btn primary" id="sp-ok" type="button">Opslaan</button></div>`, d => {
      draw(d);
      d.querySelector("#sp-rows").addEventListener("input", e => { const r = e.target.closest(".split-row"); if (!r) return; const p = parts[+r.dataset.i]; if (e.target.dataset.f === "amt") p.amt = num(e.target.value) || 0; const sum = parts.reduce((a, q) => a + (+q.amt || 0), 0), rest = Math.round((total - sum) * 100) / 100; d.querySelector("#sp-rest").innerHTML = Math.abs(rest) < 0.005 ? `<span class="pos">Verdeeld ✓</span>` : `Nog te verdelen: <b class="num ${rest < 0 ? "neg" : ""}">${eur(rest)}</b>`; });
      d.querySelector("#sp-rows").addEventListener("change", e => { const r = e.target.closest(".split-row"); if (r && e.target.dataset.f === "cat") parts[+r.dataset.i].cat = e.target.value; });
      d.querySelector("#sp-rows").addEventListener("click", e => { const b = e.target.closest('[data-f="del"]'); if (!b) return; parts.splice(+b.closest(".split-row").dataset.i, 1); if (!parts.length) parts.push({ cat: "", amt: total }); draw(d); });
      d.querySelector("#sp-add").addEventListener("click", () => { const sum = parts.reduce((a, p) => a + (+p.amt || 0), 0); parts.push({ cat: "", amt: Math.max(0, Math.round((total - sum) * 100) / 100) }); draw(d); });
      const undo = d.querySelector("#sp-undo"); if (undo) undo.addEventListener("click", () => { const big = t.splits.slice().sort((a, b) => Math.abs(b.amount) - Math.abs(a.amount))[0]; t.cat = big ? big.cat : t.cat; delete t.splits; delete t.splitRule; delete t.splitBase; save(); d.close(); render(); });
      d.querySelector("#sp-ok").addEventListener("click", () => {
        const ps = parts.filter(p => +p.amt > 0), sum = Math.round(ps.reduce((a, p) => a + +p.amt, 0) * 100) / 100, err = d.querySelector("#sp-err");

  function savChart(sm) {
    const pts = sm.bal.history; if (!sm.bal.set || pts.length < 1) return "";
    const W = 1100, H = 220, L = 60, R = 16, T = 12, B = 26, iw = W - L - R, ih = H - T - B;
    const t0 = new Date(pts[0].date).getTime(), t1 = Math.max(t0 + 864e5, Date.now());
    const vals = pts.map(p => p.value), max = Math.max(1, ...vals), min = Math.min(0, ...vals);
    const step = niceStep((max - min) / 4), top = Math.ceil(max / step) * step, bot = Math.floor(min / step) * step;
    const x = d => L + (new Date(d).getTime() - t0) / (t1 - t0) * iw, y = v => T + (top - v) / (top - bot) * ih;
    let g = "";
    for (let v = bot; v <= top + 1e-9; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${Math.abs(v) >= 1000 ? (v / 1000).toLocaleString("nl-BE") + "k" : v}</text>`;
    let d = `M${x(pts[0].date).toFixed(1)},${y(pts[0].value).toFixed(1)}`;
    for (let k = 1; k < pts.length; k++) d += `H${x(pts[k].date).toFixed(1)}V${y(pts[k].value).toFixed(1)}`;
    d += `H${(L + iw).toFixed(1)}`;
    g += `<path d="${d}V${y(Math.max(0, bot))}H${x(pts[0].date)}Z" fill="rgba(var(--gold-rgb), .08)"/><path d="${d}" fill="none" stroke="var(--gold)" stroke-width="2" style="filter:drop-shadow(0 0 5px rgba(var(--gold-rgb), calc(.7 * var(--glow))))"/>`;
    const span = (t1 - t0) / 864e5, years = [...new Set(pts.map(p => p.date.slice(0, 4)))];
    const lab = span > 540 ? years.map(yy => yy + "-01-01").filter(dd => new Date(dd).getTime() >= t0) : [];
    lab.forEach(dd => g += `<text x="${x(dd)}" y="${H - 6}" text-anchor="middle">${dd.slice(0, 4)}</text>`);
    if (!lab.length) g += `<text x="${L}" y="${H - 6}">${fmtDate(pts[0].date)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">vandaag</text>`;
    pts.slice(-400).forEach(p => g += `<circle cx="${x(p.date)}" cy="${y(p.value)}" r="8" fill="transparent" data-tip="${esc(`<b>${fmtDate(p.date)}</b><br>Saldo: ${eur(p.value)}`)}"/>`);
    return `<section class="card chart"><div class="card-head"><h2>Verloop saldo spaarrekening</h2><span class="hint">Teruggerekend vanaf je afgestemde saldo</span></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verloop saldo spaarrekening">${g}</svg></section>`;
  }
  function savTxCard(sm) {

      return `<tr data-id="${esc(id)}" data-src="${m.src}"><td class="num muted" style="width:96px">${fmtDate(m.date)}</td>
      <td class="desc"><div class="d" ${m.src === "bank" ? 'data-act="toggle-raw"' : ""}>${m.src === "bank" ? '<span title="Uit je zichtrekening">🏦</span> ' : '<span title="Manueel ingegeven">✍︎</span> '}${esc(desc)}</div>${m.src === "bank" && m.t.raw ? `<div class="raw">${esc(m.t.raw)}</div>` : ""}</td>
      <td class="r num amount ${m.effect >= 0 ? "pos" : "neg"}">${signed(m.effect)}</td>
      <td><select class="cat${m.goal || m.checked ? "" : " uncat"}" data-act="sav-goal" aria-label="Spaardoel">${goalOpts(m.goal, m.checked)}</select>${m.goal && m.auto && !m.checked ? `<div style="margin-top:3px"><span class="chip">automatisch</span></div>` : ""}</td>
      <td style="white-space:nowrap">${m.src === "manueel" ? `<button class="btn small ghost" data-act="sav-entry-del" type="button" aria-label="Verwijderen">✕</button>` : m.checked ? `<span class="status-ok">✓ gecontroleerd${m.goal ? "" : " · geen doel"}</span> <button class="btn small ghost" data-act="sav-uncheck" type="button" title="Opnieuw controleren">↺</button>` : `<button class="btn small" data-act="sav-check" type="button">✓ OK</button>`}</td></tr>`; }).join("") || `<tr class="empty-row"><td colspan="5">${f === "all" ? "Nog geen bewegingen gevonden. Vul hieronder het rekeningnummer van je spaarrekening in, of gebruik de referenties in je mededelingen." : "Niets meer te doen. Alles is gecontroleerd."}</td></tr>`;
    if (list.length > 300) h += `<tr class="empty-row"><td colspan="5">… en nog ${list.length - 300} oudere bewegingen</td></tr>`;
    return h + `</tbody></table></div></section>`;
  }

  /* ---------- aflossimulator ---------- */
  const simUi = { extra: 100 };
  function debtsForSim() {
    const out = [];
    (state.loans || []).forEach((l, i) => { const st = loanStatus(state, l); if (st.ok && st.current > 0 && st.monthly > 0) out.push({ name: l.name, bal: st.current, rate: +l.rate || 0, min: st.monthly, col: SERIES[i % SERIES.length] }); });
    (state.credits || []).forEach((c, i) => { const st = creditStatus(state, c); if (!st.ok || !(st.used > 0)) return;
      const since = new Date(Date.now() - 92 * 864e5).toISOString().slice(0, 10);
      const paid = st.movements.filter(m => m.effect < 0 && m.date >= since).reduce((a, m) => a - m.effect, 0) / 3;
      out.push({ name: c.name, bal: st.used, rate: +c.rate || 0, min: Math.max(25, Math.round((paid || st.used * 0.03) * 100) / 100), col: SERIES[(state.loans.length + i) % SERIES.length] }); });
    return out;
  }
  function simulate(debts, extra, order) {
    const ds_ = debts.map(d => ({ ...d, r: d.rate ? Math.pow(1 + d.rate / 100, 1 / 12) - 1 : 0, paidOff: null }));
    const totalMin = ds_.reduce((a, d) => a + d.min, 0), budget = totalMin + extra;
    let month = 0, interest = 0; const curve = [ds_.reduce((a, d) => a + d.bal, 0)];
    while (ds_.some(d => d.bal > 0.005) && month < 600) {
      month++;
      for (const d of ds_) if (d.bal > 0) { const i = d.bal * d.r; d.bal += i; interest += i; }
      let pot = order ? budget : totalMin;                 // zonder strategie: alleen de minima, geen doorschuiven
      for (const d of ds_) if (d.bal > 0) { const p = Math.min(d.min, d.bal); d.bal -= p; pot -= p; if (!order) continue; }
      if (order) {
        const live = ds_.filter(d => d.bal > 0.005).sort(order);
        for (const d of live) { if (pot <= 0) break; const p = Math.min(pot, d.bal); d.bal -= p; pot -= p; }
      }
      for (const d of ds_) if (d.bal <= 0.005 && d.paidOff === null) { d.bal = 0; d.paidOff = month; }
      curve.push(ds_.reduce((a, d) => a + d.bal, 0));
    }
    return { months: month, interest: Math.round(interest * 100) / 100, curve, debts: ds_, never: month >= 600 };
  }
  function simCard() {
    const debts = debtsForSim();
    if (!debts.length) return `<section class="card"><div class="card-head"><h2>Sneller aflossen</h2></div><p class="muted">Vul bij je leningen en kredieten het openstaand saldo in om te simuleren hoeveel sneller je schuldenvrij kunt zijn.</p></section>`;
    const extra = +simUi.extra || 0;
    const base = simulate(debts, 0, null);
    const aval = simulate(debts, extra, (a, b) => b.rate - a.rate || a.bal - b.bal);
    const snow = simulate(debts, extra, (a, b) => a.bal - b.bal || b.rate - a.rate);
    const best = aval.interest <= snow.interest ? "lawine" : "sneeuwbal";
    const when = m => monthName(shiftMonth(todayS().slice(0, 7), m));
    const W = 1100, H = 220, L = 60, R = 16, T = 12, B = 26, iw = W - L - R, ih = H - T - B;
    const n = Math.max(base.curve.length, aval.curve.length, snow.curve.length), max = Math.max(...base.curve, 1);
    const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
    const x = i => L + i / (n - 1 || 1) * iw, y = v => T + (top - v) / top * ih;
    let g = ""; for (let v = 0; v <= top + 1e-9; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? (v / 1000).toLocaleString("nl-BE") + "k" : v}</text>`;

    for (let yr = 1; yr * 12 < n; yr++) g += `<text x="${x(yr * 12)}" y="${H - 6}" text-anchor="middle">+${yr} jaar</text>`;

      <div class="toolbar"><label for="sim-extra">Extra per maand</label><input class="input num" id="sim-extra" data-act="sim-extra" inputmode="decimal" style="width:110px" value="${extra}"> <span class="muted" style="font-size:12.5px">€ bovenop je gewone aflossingen. Afgeloste schulden geven hun maandbedrag door aan de volgende.</span></div>
      <div class="table-wrap"><table><thead><tr><th>Scenario</th><th>Schuldenvrij</th><th class="r">Duur</th><th class="r">Rente totaal</th><th class="r">Winst</th></tr></thead><tbody>
      ${row("Zoals nu (geen extra)", base, "var(--muted)")}${row("Lawine: hoogste rente eerst", aval, "var(--accent)")}${row("Sneeuwbal: kleinste schuld eerst", snow, "var(--gold)")}</tbody></table></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Totale schuld per scenario" style="margin-top:10px">${g}</svg>
      <p style="margin:10px 0 0;font-size:13.5px">Advies: <b>${best === "lawine" ? "lawine" : "sneeuwbal"}</b>${aval.interest === snow.interest ? " (beide even goed)" : ""}. Volgorde: ${chosen.debts.slice().sort((a, b) => (a.paidOff ?? 999) - (b.paidOff ?? 999)).map(d => `${esc(d.name)} <span class="muted">(${d.paidOff ? esc(when(d.paidOff)) : "—"})</span>`).join(" → ")}.</p>
      <p class="muted" style="font-size:12px;margin:6px 0 0">Kredieten zonder vaste aflossing rekenen met je gemiddelde aflossing van de laatste 3 maanden (min. €25). Een simulatie, geen financieel advies: kijk ook na of je lening een wederbeleggingsvergoeding vraagt bij vervroegd aflossen.</p></section>`;
  }

      case "set-group": { const k = el.closest("tr").dataset.key; if (el.value === UNCAT) break;
        const n = setGroup(k, el.value); save(); render(); toast(`${n} transactie${n === 1 ? "" : "s"} op ${el.value} gezet`); break; }
      case "cat-name": { const c = state.categories[rowIndex(el)], old = c.name, nw = el.value.trim();
        if (!nw || (nw !== old && catNames().includes(nw))) { toast("Die naam is leeg of bestaat al."); el.value = old; break; }
        c.name = nw; state.transactions.forEach(t => { if (t.cat === old) t.cat = nw; if (t.goal === old) t.goal = nw; }); { const sc = savConf(state); sc.entries.forEach(e => { if (e.goal === old) e.goal = nw; }); sc.pending.forEach(p => { if (p.goal === old) p.goal = nw; }); sc.transfers.forEach(x => { if (x.from === old) x.from = nw; if (x.to === old) x.to = nw; }); } state.rules.forEach(r => { if (r.cat === old) r.cat = nw; }); state.goals.forEach(g => { if (g.name === old) g.name = nw; }); save(); break; }
      case "bal-date": case "bal-amount": {
        const acc = el.closest("tr").dataset.acc; const row = el.closest("tr");
        let b = state.balances.find(x => x.account === acc);
        if (!b) { b = { account: acc, date: row.querySelector('[data-act="bal-date"]').value, amount: null }; state.balances.push(b); }
        if (a === "bal-date") b.date = el.value; else b.amount = num(el.value);
        save(); render(); break; }
      case "cat-type": state.categories[rowIndex(el)].type = el.value; save(); render(); break;
      case "cat-roll": state.categories[rowIndex(el)].rollover = el.checked; save(); render(); break;
      case "cat-budget": state.categories[rowIndex(el)].budget = num(el.value); save(); render(); break;
      case "cat-budget-year": state.categories[rowIndex(el)].budgetYear = num(el.value); save(); render(); break;
      case "rule-kw": state.rules[rowIndex(el)].keyword = el.value.trim(); save(); render(); break;
      case "rule-cat": state.rules[rowIndex(el)].cat = el.value; save(); break;
      case "goal-name": state.goals[rowIndex(el)].name = el.value; save(); render(); break;
      case "goal-target": state.goals[rowIndex(el)].target = num(el.value); save(); render(); break;
      case "goal-start": state.goals[rowIndex(el)].start = num(el.value) || 0; save(); render(); break;
      case "goal-date": state.goals[rowIndex(el)].deadline = el.value; save(); render(); break;
    }
  });
  document.addEventListener("input", e => {
    if (e.target.id === "tx-search") { ui.txSearch = e.target.value; clearTimeout(render._t); render._t = setTimeout(render, 150); }
  });

  function ruleDialog(t) {
    const guess = (t.desc || "").replace(/\s*\(.*\)$/, "").replace(/^(Van|Naar)\s+/, "").split(" · ")[0].replace(/\s+\d{4}\b.*$/, "").trim();
    dialog(`<h3>Regel maken</h3><p>Transacties waarvan de bankomschrijving dit trefwoord bevat, krijgen voortaan deze categorie.</p>
      <label for="r-kw">Trefwoord</label><input class="input" id="r-kw" value="${esc(guess)}">
      <label for="r-cat">Categorie</label><select class="input" id="r-cat">${catOptions(t.cat === UNCAT ? "" : t.cat)}</select>
      <p id="r-count" class="muted" style="margin:10px 0 0;font-size:12.5px"></p>
      <div class="row"><button class="btn" data-close type="button">Annuleren</button><button class="btn primary" id="r-ok" type="button">Regel opslaan en toepassen</button></div>`, d => {
      const kw = d.querySelector("#r-kw"), cnt = d.querySelector("#r-count");
      const upd = () => { const k = kw.value.trim().toLowerCase(); const n = k ? state.transactions.filter(x => x.cat === UNCAT && (x.search || x.raw || "").toLowerCase().includes(k)).length : 0; cnt.textContent = k ? `${n} te categoriseren transactie${n === 1 ? "" : "s"} ${n === 1 ? "past" : "passen"} hierop.` : ""; };
      kw.addEventListener("input", upd); upd(); kw.focus(); kw.select();
      d.querySelector("#r-ok").addEventListener("click", () => {
        const k = kw.value.trim(), c = d.querySelector("#r-cat").value;
        if (!k || c === UNCAT) { cnt.textContent = "Vul een trefwoord in en kies een categorie."; return; }
        state.rules.unshift({ keyword: k, cat: c });
        if (t.cat === UNCAT) t.cat = c;
        const n = applyRules(state); save(); d.close(); render();
        toast(`Regel “${k}” opgeslagen · ${n} andere transactie${n === 1 ? "" : "s"} gecategoriseerd`);
      });
    });
  }
  function addTxDialog() {
    const today = new Date().toISOString().slice(0, 10);
    dialog(`<h3>Transactie toevoegen</h3><p>Bijvoorbeeld een cashbetaling. Uitgaven geef je in als negatief bedrag.</p>
      <label for="a-date">Datum</label><input class="input" type="date" id="a-date" value="${today}">
      <label for="a-desc">Omschrijving</label><input class="input" id="a-desc">
      <label for="a-amt">Bedrag (bv. -12,50)</label><input class="input" id="a-amt" inputmode="decimal">
      <label for="a-cat">Categorie</label><select class="input" id="a-cat">${catOptions(UNCAT)}</select>
      <p id="a-err" class="neg" style="margin:10px 0 0;font-size:12.5px"></p>
      <div class="row"><button class="btn" data-close type="button">Annuleren</button><button class="btn primary" id="a-ok" type="button">Toevoegen</button></div>`, d => {
      d.querySelector("#a-desc").focus();
      d.querySelector("#a-ok").addEventListener("click", () => {
        const date = d.querySelector("#a-date").value, desc = d.querySelector("#a-desc").value.trim(), amt = num(d.querySelector("#a-amt").value);
        if (!date || !desc || amt === null) { d.querySelector("#a-err").textContent = "Vul datum, omschrijving en bedrag in."; return; }
        state.transactions.push({ id: "m" + Date.now().toString(36), date, desc, cat: d.querySelector("#a-cat").value, amount: Math.round(amt * 100) / 100, account: "", omzet: "", counterparty: "", raw: "", search: desc });
        sortTx(state); save(); d.close(); ui.month = date.slice(0, 7); render(); toast("Transactie toegevoegd");
      });
    });
  }

  /* bestanden */
  $("#btn-import").addEventListener("click", () => $("#file-csv").click());
  $("#file-csv").addEventListener("change", e => { if (e.target.files.length) importCsvFiles([...e.target.files]); e.target.value = ""; });
  $("#file-lite").addEventListener("change", e => { if (e.target.files[0]) liteFromFile(e.target.files[0]); e.target.value = ""; });
  $("#file-json").addEventListener("change", e => { if (e.target.files[0]) importJson(e.target.files[0]); e.target.value = ""; });
  $("#btn-backup").addEventListener("click", () => { const m = $("#backup-menu"); m.classList.toggle("open"); $("#btn-backup").setAttribute("aria-expanded", m.classList.contains("open")); });
  let dragDepth = 0;
  window.addEventListener("dragenter", e => { if ([...(e.dataTransfer.types || [])].includes("Files")) { dragDepth++; document.body.classList.add("dragging"); } });
  window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
  window.addEventListener("dragover", e => e.preventDefault());
  window.addEventListener("drop", e => {
    e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
    const files = [...e.dataTransfer.files];
    const json = files.find(f => /\.(json|gz)$/i.test(f.name)); if (json) { importJson(json); return; }
    const csv = files.filter(f => /\.csv$/i.test(f.name) || f.type === "text/csv");
    if (csv.length) importCsvFiles(csv); else toast("Sleep een .csv-bestand van je bank of een .json-back-up.");
  });

  /* categorieën slepen */
  let dragFrom = null;
  document.addEventListener("dragstart", e => { const h = e.target.closest && e.target.closest(".drag-handle"); if (!h) return; const tr = h.closest("tr"); dragFrom = +tr.dataset.i; tr.classList.add("dragging"); try { e.dataTransfer.setData("text/plain", "cat"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setDragImage(tr, 20, 20); } catch (x) {} });
  document.addEventListener("dragover", e => { if (dragFrom === null) return; const tr = e.target.closest && e.target.closest("tr.cat-drag-row"); document.querySelectorAll(".drop-above,.drop-below").forEach(x => x.classList.remove("drop-above", "drop-below")); if (!tr) return; e.preventDefault(); const r = tr.getBoundingClientRect(); tr.classList.add(e.clientY < r.top + r.height / 2 ? "drop-above" : "drop-below"); }, true);
  document.addEventListener("drop", e => { if (dragFrom === null) return; const tr = e.target.closest && e.target.closest("tr.cat-drag-row"); e.preventDefault(); e.stopPropagation();
    if (tr) { const r = tr.getBoundingClientRect(); let to = +tr.dataset.i + (e.clientY < r.top + r.height / 2 ? 0 : 1); const [c] = state.categories.splice(dragFrom, 1); if (to > dragFrom) to--; state.categories.splice(to, 0, c); save(); }
    dragFrom = null; render(); }, true);
  document.addEventListener("dragend", () => { if (dragFrom !== null) { dragFrom = null; render(); } });

  /* tooltip */
  const tip = $("#tip");
  function hideTip() { tip.style.display = "none"; }
  document.addEventListener("mousemove", e => {
    const el = e.target.closest && e.target.closest("[data-tip]");
    if (!el) { hideTip(); return; }
    tip.innerHTML = el.getAttribute("data-tip"); tip.style.display = "block";
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX + 14, y = e.clientY + 14;
    if (x + w > innerWidth - 8) x = e.clientX - w - 14;
    if (y + h > innerHeight - 8) y = e.clientY - h - 14;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { hideTip(); $("#backup-menu").classList.remove("open"); } });

  $("#main").innerHTML = `<p class="muted" style="padding:40px 0;text-align:center">Gegevens laden…</p>`;
  loadState().then(st => { state = st; ui.month = state.transactions.length ? state.transactions[0].date.slice(0, 7) : todayYm();
      syncThemeColor();
      const start = () => {
        updateInstallUi(); if (state.transactions.length) askPersist();
        if (liteMode()) { liteLoadCache(); liteFromLocal(); return; }
        setTimeout(() => folderAuto("open"), 1500);
        render(); };
      if (state.pin && state.pin.hash && !isUnlocked()) { $("#main").innerHTML = ""; showLock(start); } else start();
      try { const n = dueItems().length; if (n) setTimeout(() => toast(`⏰ ${n} betaling${n === 1 ? "" : "en"} binnenkort of te laat. Kijk in de Planner.`), 800); } catch (e) {} })
    .catch(() => { render(); });
})();
</script>
</body>
</html>
