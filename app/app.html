<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budgetplanner</title>
<meta name="description" content="Persoonlijke budgetplanner. Je gegevens blijven op je eigen toestel.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="theme-fonts" rel="stylesheet">
<script>
  // Thema van dit toestel meteen zetten (anders flitst eerst het standaardthema)
  (function () { let t = {}; try { t = JSON.parse(localStorage.getItem("budgetplanner.v1.theme") || "{}"); } catch (e) {}
    const ok = ["cyberpunk", "synthwave", "matrix", "oceaan"];
    document.documentElement.dataset.theme = ok.includes(t.t) ? t.t : "cyberpunk";
    document.documentElement.dataset.mode = t.m === "light" ? "light" : "dark";
    // lettertypes van het gekozen thema (de andere worden pas geladen als je het themavenster opent)
    window.THEME_FONTS = {
      cyberpunk: "https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap",
      synthwave: "https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap",
      matrix: "https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap",
      oceaan: "https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" };
    document.getElementById("theme-fonts").href = window.THEME_FONTS[document.documentElement.dataset.theme]; })();
  // Het manifest ("typeplaatje" voor installeren) alleen laden als de app via een webadres draait;
  // als los bestand (file://) geeft de browser er anders een foutmelding op.
  if (/^https?:$/.test(location.protocol)) { const l = document.createElement("link"); l.rel = "manifest"; l.href = "manifest.webmanifest"; document.head.appendChild(l); }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
/* Cyberpunk: nachtzwarte ondergrond met neonraster en scanlijnen, cyaan/magenta als accent, groen/rood blijven plus/min. Eén donker thema. */
:root {
  --bg: #000000;
  --surface: #0b0b0b;
  --ink: #e6f1ff;
  --muted: #9a9a9a;
  --line: #262626;
  --accent: #00e5ff;
  /* basiswaarden (R, G, B) voor gloed en doorzichtige varianten: rgba(var(--accent-rgb), .45) */
  --accent-rgb: 0, 229, 255; --magenta-rgb: 255, 43, 214; --pos-rgb: 0, 255, 163; --neg-rgb: 255, 42, 109;
  --gold-rgb: 255, 201, 52; --warn-rgb: 245, 232, 59; --muted-rgb: 154, 154, 154; --ink-rgb: 230, 241, 255;
  --amber-rgb: 255, 170, 0; --shade-rgb: 0, 0, 0;
  --panel: #0a0a0a; --panel-rgb: 0, 0, 0;   /* menu, dialogen, bovenbalk, meldingen */
  --scan: .35;                       /* sterkte van de scanlijnen */
  --on-accent: #000;                 /* tekst op een felle knop/badge */
  --gold-dark: #b8860b;              /* begin van het verloop in spaarbalken */
  --field: rgba(4, 4, 4, .9);        /* achtergrond van invulvelden */
  --head-top: rgba(14, 14, 14, .96); --head-bottom: rgba(6, 6, 6, .96);   /* bovenbalk */
  --grid-line: rgba(255, 255, 255, .025);                                  /* neonraster op de achtergrond */
  --backdrop: rgba(15, 20, 27, .45);  /* donkere waas achter een dialoogvenster */
  --menu-shadow: 0 8px 24px rgba(20, 32, 51, .12);
  --accent-soft: rgba(var(--accent-rgb), .10);
  --magenta: #ff2bd6;
  --pos: #00ffa3;
  --pos-soft: rgba(var(--pos-rgb), .12);
  --neg: #ff2a6d;
  --neg-soft: rgba(var(--neg-rgb), .14);
  --gold: #ffc934;
  --warn: #f5e83b;
  --warn-soft: rgba(var(--warn-rgb), .12);
  --bar: #00e5ff;
  --bar-track: #161616;
  --shadow: 0 0 0 1px rgba(var(--accent-rgb), .04), 0 0 28px rgba(var(--accent-rgb), .05);
  --s1: #00e5ff; --s2: #ff2bd6; --s3: #f5e83b; --s4: #9d7bff;
  --font-display: "Orbitron", "Segoe UI", system-ui, sans-serif;
  --font-body: "Rajdhani", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Share Tech Mono", ui-monospace, "Consolas", monospace;
  /* vorm en karakter (per thema anders, zie de thema-blokken) */
  --r-card: 0; --r-btn: 0; --r-field: 0; --r-pill: 0; --r-bar: 0; --r-sm: 0;
  --case-title: uppercase; --case-ui: uppercase; --title-spacing: .06em;
  --glow: 1; --corner: .8;
  --font-hero: var(--font-display); --hero-size: 24px; --body-size: 15.5px; --body-weight: 500;
  --notch: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
  --notch-sm: polygon(0 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 7px 100%, 0 calc(100% - 7px));
  color-scheme: dark;
}

.theme-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0 4px; }
.theme-tile { all: unset; box-sizing: border-box; cursor: pointer; background: var(--bg); color: var(--ink); border: 1px solid var(--line); padding: 10px; clip-path: var(--notch-sm); display: grid; gap: 8px; }
.theme-tile .tt-card { background: var(--surface); border: 1px solid var(--line); padding: 8px 10px; }
.theme-tile .tt-name { font-family: var(--font-display); font-size: 12px; letter-spacing: .1em; text-transform: var(--case-ui); color: var(--accent); }
.theme-tile .tt-amt { font-family: var(--font-mono); font-size: 15px; color: var(--pos); }
.theme-tile .tt-dots { display: flex; gap: 5px; } .theme-tile .tt-dots i { width: 14px; height: 6px; display: block; }
.theme-tile[aria-pressed="true"] { outline: 2px solid var(--magenta); outline-offset: -2px; box-shadow: 0 0 14px rgba(var(--magenta-rgb), .45); }
.theme-tile:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
/* ---- vorm en karakter per thema (geldt voor donker én licht) ---- */
[data-theme="synthwave"] {
  --font-display: "Audiowide", "Segoe UI", system-ui, sans-serif; --font-body: "Exo 2", "Segoe UI", system-ui, sans-serif; --font-mono: "Space Mono", ui-monospace, monospace;
  --font-hero: var(--font-display); --notch: none; --notch-sm: none;
  --r-card: 12px; --r-btn: 8px; --r-field: 8px; --r-pill: 999px; --r-bar: 999px; --r-sm: 6px;
  --case-title: uppercase; --case-ui: uppercase; --title-spacing: .08em; --corner: 0; --hero-size: 26px; --body-size: 15px; --body-weight: 400;
}
[data-theme="matrix"] {
  --font-display: "IBM Plex Mono", ui-monospace, monospace; --font-body: "IBM Plex Mono", ui-monospace, monospace; --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --font-hero: "VT323", "IBM Plex Mono", monospace; --notch: none; --notch-sm: none;
  --r-card: 0; --r-btn: 0; --r-field: 0; --r-pill: 0; --r-bar: 0; --r-sm: 0;
  --case-title: lowercase; --case-ui: lowercase; --title-spacing: 0; --corner: .8; --hero-size: 40px; --body-size: 13.5px; --body-weight: 400;
}
[data-theme="oceaan"] {
  --font-display: "Quicksand", "Segoe UI", system-ui, sans-serif; --font-body: "Nunito", "Segoe UI", system-ui, sans-serif; --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --font-hero: var(--font-display); --notch: none; --notch-sm: none;
  --r-card: 18px; --r-btn: 12px; --r-field: 10px; --r-pill: 999px; --r-bar: 999px; --r-sm: 8px;
  --case-title: none; --case-ui: none; --title-spacing: 0; --corner: 0; --hero-size: 30px; --body-size: 15px; --body-weight: 400;
}
/* Synthwave: zonsondergang in de titel, zon aan de horizon, roze randjes */
[data-theme="synthwave"] body { background:
    radial-gradient(900px 340px at 50% 104%, rgba(var(--accent-rgb), .22), transparent 70%),
    radial-gradient(1400px 520px at 50% 110%, rgba(var(--magenta-rgb), .20), transparent 72%),
    linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0 / 100% 34px,
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0 / 34px 100%, var(--bg); background-attachment: fixed; }
[data-theme="synthwave"] .page-head h1 { background: linear-gradient(180deg, var(--gold) 15%, var(--accent) 55%, var(--magenta) 95%); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 0 10px rgba(var(--magenta-rgb), calc(.45 * var(--glow)))); }
[data-theme="synthwave"] .page-head h1::after { height: 4px; border-radius: 999px; background: linear-gradient(90deg, var(--gold), var(--accent), var(--magenta)); }
[data-theme="synthwave"] .card, [data-theme="synthwave"] .kpi { border-color: rgba(var(--magenta-rgb), .28); box-shadow: 0 10px 32px rgba(var(--magenta-rgb), calc(.10 * var(--glow))); }
[data-theme="synthwave"] .card h2 { color: var(--magenta); }
[data-theme="synthwave"] .card, [data-theme="synthwave"] .kpi { background: rgba(var(--panel-rgb), .84); }
/* Matrix: terminal. Titel als opdrachtregel met cursor, alles monospace, compacter */
[data-theme="matrix"] .page-head h1 { line-height: 1; }
[data-theme="matrix"] .page-head h1::before { content: "> "; color: var(--muted); }
[data-theme="matrix"] .page-head h1::after { content: "_"; display: inline-block; width: auto; height: auto; margin: 0 0 0 6px; background: none; box-shadow: none; color: var(--accent); }
[data-theme="matrix"] .card h2::before { content: "// "; color: var(--muted); }
[data-theme="matrix"] .card, [data-theme="matrix"] .kpi { border-color: rgba(var(--accent-rgb), .22); }
[data-theme="matrix"] main { gap: 14px; } [data-theme="matrix"] .card { padding: 16px; } [data-theme="matrix"] .kpi { padding: 12px 14px; }
[data-theme="matrix"] .kpi .value { font-family: var(--font-mono); }
[data-theme="matrix"] .kpi .chip { font-size: 10px; letter-spacing: 0; white-space: normal; }
/* Oceaan: zacht en rond, luchtig, rustige schaduwen in plaats van neon */
[data-theme="oceaan"] .card, [data-theme="oceaan"] .kpi { background: rgba(var(--panel-rgb), .80); box-shadow: 0 8px 30px rgba(var(--shade-rgb), .22); }
[data-theme="oceaan"][data-mode="light"] .card, [data-theme="oceaan"][data-mode="light"] .kpi { box-shadow: 0 6px 24px rgba(var(--ink-rgb), .07); }
[data-theme="oceaan"] .page-head h1 { font-weight: 700; }
[data-theme="oceaan"] .page-head h1::after { height: 4px; border-radius: 999px; width: 48px; }
[data-theme="oceaan"] .card h2, [data-theme="oceaan"] .kpi .label { font-size: 13.5px; letter-spacing: .01em; }
[data-theme="oceaan"] th { letter-spacing: .02em; font-size: 12px; }
[data-theme="oceaan"] main { gap: 24px; } [data-theme="oceaan"] .card { padding: 24px; }
[data-theme="oceaan"] .kpi::before { border-radius: 999px; }
/* afgeleide tokens opnieuw uitrekenen op elk element met een thema (ook de voorbeeldtegels in het themavenster) */

/* ================= CYBERPUNK ================= */
body {
  font-size: var(--body-size); font-weight: var(--body-weight); letter-spacing: .01em;
  background:
    linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0 / 100% 34px,
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0 / 34px 100%,
    var(--bg);
  background-attachment: fixed;
}
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 60;
  background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(var(--shade-rgb), .22) 2px 3px); opacity: var(--scan); }
::selection { background: var(--magenta); color: var(--on-accent); }
.num, .amount, .amt, td.cell, .totals, .gauge-legend b, .facts b, .month span { font-family: var(--font-mono); letter-spacing: 0; }
h1, h2, h3 { letter-spacing: var(--title-spacing); text-transform: var(--case-title); }
.page-head h1 { font-family: var(--font-hero); font-size: var(--hero-size); font-weight: 700; text-shadow: 0 0 14px rgba(var(--accent-rgb), calc(.45 * var(--glow))); }
.page-head h1::after { content: ""; display: block; width: 64px; height: 3px; margin-top: 8px; background: linear-gradient(90deg, var(--magenta), var(--accent)); box-shadow: 0 0 10px rgba(var(--magenta-rgb), calc(.6 * var(--glow))); }
.page-head p { font-size: 14.5px; }

header { background: rgba(var(--panel-rgb), .9); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(var(--accent-rgb), .35); box-shadow: 0 0 22px rgba(var(--accent-rgb), calc(.12 * var(--glow))); }
.brand { font-family: var(--font-hero); text-transform: var(--case-ui); letter-spacing: .1em; font-size: 15px; text-shadow: 0 0 10px rgba(var(--accent-rgb), calc(.5 * var(--glow))); }
.brand-mark { background: var(--magenta); color: var(--on-accent); border-radius: var(--r-sm); clip-path: var(--notch-sm); box-shadow: 0 0 12px var(--magenta); }
nav a { text-transform: var(--case-ui); letter-spacing: .06em; font-weight: 600; font-size: 13px; padding-left: 8px; padding-right: 8px; }
.brand-text { display: none; }
@media (max-width: 1100px) { nav a { padding-left: 5px; padding-right: 5px; font-size: 12px; letter-spacing: .03em; } .bar { gap: 10px; } }
nav a:hover { color: var(--accent); }
nav a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); text-shadow: 0 0 10px rgba(var(--accent-rgb), calc(.7 * var(--glow))); }

.card, .kpi, .drop {
  background: linear-gradient(180deg, var(--head-top), var(--head-bottom));
  border: 1px solid var(--line); border-radius: var(--r-card); clip-path: var(--notch); position: relative;
}
.card::after, .kpi::after { content: ""; position: absolute; left: 0; top: 0; width: 18px; height: 18px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); opacity: var(--corner); pointer-events: none; }
.card h2, .kpi .label { font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: var(--case-ui); color: var(--accent); }
.kpi .label { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi::before { width: 3px; box-shadow: 0 0 12px var(--k, transparent); }
.kpi .value, .loan-big { font-family: var(--font-display); font-weight: 700; letter-spacing: .02em; text-shadow: 0 0 12px rgba(var(--ink-rgb), calc(.18 * var(--glow))); }
.kpi .value .pos, .loan-big.pos, .value .pos { text-shadow: 0 0 14px rgba(var(--pos-rgb), calc(.55 * var(--glow))); }
td.amount.pos, .amount.pos, b.pos, .num.pos { text-shadow: 0 0 8px rgba(var(--pos-rgb), calc(.55 * var(--glow))); }
td.amount.neg, .amount.neg, b.neg, .num.neg { text-shadow: 0 0 8px rgba(var(--neg-rgb), calc(.55 * var(--glow))); }
.kpi .value .neg { text-shadow: 0 0 14px rgba(var(--neg-rgb), calc(.55 * var(--glow))); }
.gold { color: var(--gold); }
.kpi .value .gold { text-shadow: 0 0 10px rgba(var(--gold-rgb), calc(.75 * var(--glow))), 0 0 26px rgba(var(--amber-rgb), calc(.35 * var(--glow))); }
.section-title h2 { font-family: var(--font-display); color: var(--magenta); text-shadow: 0 0 12px rgba(var(--magenta-rgb), calc(.5 * var(--glow))); font-size: 16px; }

.btn { border-radius: var(--r-btn); clip-path: var(--notch-sm); text-transform: var(--case-ui); letter-spacing: .07em; font-weight: 600; font-size: 13px; border-color: rgba(var(--accent-rgb), .45); background: rgba(var(--accent-rgb), .06); }
.btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(var(--accent-rgb), .12); box-shadow: inset 0 0 12px rgba(var(--accent-rgb), calc(.25 * var(--glow))); }
.btn.primary { background: var(--magenta); border-color: var(--magenta); color: var(--on-accent); box-shadow: 0 0 16px rgba(var(--magenta-rgb), calc(.45 * var(--glow))); }
.btn.primary:hover { filter: brightness(1.12); color: var(--on-accent); background: var(--magenta); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.small { font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: default; }

.input, select.cat, input.cell, .month, .seg { border-radius: var(--r-field); }
.input, .month, .seg, .seg button { background: var(--field); border-color: var(--line); }
.input:focus, select.cat:focus, input.cell:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 12px rgba(var(--accent-rgb), calc(.3 * var(--glow))); outline: none; }
select option, select optgroup { background: var(--surface); color: var(--ink); }
.seg button[aria-pressed="true"] { background: rgba(var(--accent-rgb), .14); color: var(--accent); text-shadow: 0 0 8px rgba(var(--accent-rgb), calc(.6 * var(--glow))); }
.seg button, .month span { text-transform: var(--case-ui); letter-spacing: .06em; }
input[type="date"] { color-scheme: inherit; }
input[type="checkbox"] { accent-color: var(--magenta); }

th { font-family: var(--font-display); font-size: 10.5px; letter-spacing: .12em; text-transform: var(--case-ui); color: var(--muted); border-bottom-color: rgba(var(--accent-rgb), .3); }
tbody tr:hover td { background: rgba(var(--accent-rgb), .05); }
.chip { border-radius: var(--r-pill); border: 1px solid currentColor; background: transparent; text-transform: var(--case-ui); letter-spacing: .05em; font-size: 11px; }
.chip.warn { background: var(--warn-soft); } .chip.pos { background: var(--pos-soft); } .chip.neg { background: var(--neg-soft); }
.type-pill { border-radius: var(--r-pill); border: 1px solid currentColor; text-transform: var(--case-ui); letter-spacing: .05em; }

.track, .gauge, .debt-bar { border-radius: var(--r-bar); }
.fill { border-radius: var(--r-bar); box-shadow: 0 0 10px rgba(var(--accent-rgb), calc(.55 * var(--glow))); }
.fill.over { box-shadow: 0 0 10px rgba(var(--neg-rgb), calc(.7 * var(--glow))); }
.goal .fill { box-shadow: 0 0 10px rgba(var(--pos-rgb), calc(.55 * var(--glow))); }
.gauge span, .debt-bar .owed { border-radius: var(--r-bar); box-shadow: 0 0 10px rgba(var(--neg-rgb), calc(.6 * var(--glow))); }
.debt-bar .free { box-shadow: 0 0 10px rgba(var(--pos-rgb), calc(.45 * var(--glow))); opacity: .9; }
.budget-tick { background: var(--magenta); box-shadow: 0 0 6px var(--magenta); }
.legend i.tick { background: var(--magenta); }
.chart text, .trend text { font-family: var(--font-mono); }
.chart path[fill^="var"], .trend path[fill^="var"] { filter: drop-shadow(0 0 4px rgba(var(--accent-rgb), calc(.25 * var(--glow)))); }
.chart path[stroke^="var"] { filter: drop-shadow(0 0 5px currentColor); }

.notice { border-radius: var(--r-card); border-left: 3px solid currentColor; }
.tooltip { background: rgba(var(--shade-rgb), .96); color: var(--ink); border: 1px solid var(--accent); border-radius: var(--r-card); box-shadow: 0 0 18px rgba(var(--accent-rgb), calc(.35 * var(--glow))); font-family: var(--font-body); font-size: 13.5px; }
.toast { background: rgba(var(--panel-rgb), .96); color: var(--accent); border: 1px solid var(--accent); border-radius: var(--r-card); box-shadow: 0 0 20px rgba(var(--accent-rgb), calc(.4 * var(--glow))); text-transform: var(--case-ui); letter-spacing: .05em; font-weight: 600; }
.menu-list { background: var(--panel); border-color: var(--accent); border-radius: var(--r-card); box-shadow: 0 0 20px rgba(var(--accent-rgb), calc(.25 * var(--glow))); }
.menu-list button { border-radius: var(--r-sm); }
.menu-list button:hover { background: rgba(var(--accent-rgb), .1); color: var(--accent); }
dialog { background: var(--panel); border: 1px solid var(--accent); border-radius: var(--r-card); clip-path: var(--notch); box-shadow: 0 0 40px rgba(var(--accent-rgb), calc(.25 * var(--glow))); }
dialog h3 { font-family: var(--font-display); color: var(--accent); }
dialog::backdrop { background: rgba(var(--shade-rgb), .8); }
dialog textarea { border-radius: var(--r-field); background: var(--bg); }
.drop { border: 1px dashed var(--accent); }
.drop.over { background: rgba(var(--accent-rgb), .08); }
body.dragging::after { border-radius: var(--r-card); background: rgba(var(--panel-rgb), .9); color: var(--accent); font-family: var(--font-display); text-transform: var(--case-ui); letter-spacing: .1em; text-shadow: 0 0 14px var(--accent); }

.heat td.cell.cur { box-shadow: inset 0 -2px 0 var(--magenta); }
.foot { font-family: var(--font-mono); text-transform: var(--case-ui); letter-spacing: .08em; font-size: 11px; }
a.hint, .legend a { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { body::before { display: none; } }
/* ================= BREDE SCHERMEN (stap 7a) =================
   Vanaf 1600 px: inhoud breder + vast zijpaneel rechts (niet op het Overzicht, daar staat het al). */
#side { display: none; }
@media (min-width: 1600px) {
  .bar { max-width: 1760px; }
  .shell { max-width: 1760px; margin: 0 auto; padding: 0 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; align-items: start; }
  .shell > main { max-width: none; margin: 0; padding-left: 0; padding-right: 0; min-width: 0; }
  body.has-side .shell { grid-template-columns: minmax(0, 1fr) 360px; }
  body.has-side #side { display: grid; gap: 20px; align-content: start; position: sticky; top: 61px; padding: 24px 0; max-height: calc(100vh - 61px); overflow-y: auto; scrollbar-width: thin; }
  #side .card { padding: 16px 18px; }
  #side .cat-row { grid-template-columns: 112px 1fr 82px; }
}
/* ================= SMALLE SCHERMEN (stap 7b) =================
   Tot 900 px: menuknop ☰ met alle tabbladen i.p.v. een veegbalk die buiten beeld loopt.
   Tot 700 px: kaartjes 2 per rij, meldingen inklapbaar. */
.nav-toggle { display: none; }
.fold { display: block; } .fold > summary { cursor: pointer; list-style: none; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::after { content: "▸"; margin-left: auto; transition: transform .2s ease; } .fold[open] > summary::after { transform: rotate(90deg); }
.fold[open] > summary { margin-bottom: 8px; } .fold > div + div { margin-top: 6px; }
.fold-hint { font-weight: 400; opacity: .7; font-size: .9em; } .fold[open] .fold-hint { display: none; }
@media (max-width: 900px) {
  .nav-toggle { display: inline-flex; margin-right: auto; }
  header nav { display: none; }
  header.nav-open nav { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; position: absolute; left: 0; right: 0; top: 100%; padding: 10px 16px 14px; background: var(--panel); border-bottom: 1px solid rgba(var(--accent-rgb), .35); box-shadow: 0 14px 28px rgba(var(--shade-rgb), .35); overflow: visible; animation: fx-drop .16s ease-out; }
  header.nav-open nav a { padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--r-btn); clip-path: var(--notch-sm); }
  header.nav-open nav a[aria-current="page"] { border-color: var(--accent); background: rgba(var(--accent-rgb), .08); }
}
@media (max-width: 700px) {
  .kpis { grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpis > .kpi:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .kpi { padding: 12px 14px; } .kpi .value { font-size: 20px; }
  .kpi .chip { white-space: normal; font-size: 10.5px; letter-spacing: .02em; line-height: 1.35; max-width: 100%; }
}
body.lite .nav-toggle { display: none !important; }
/* ================= GSM-WEERGAVE (stap 7c) =================
   Geen aparte bovenbalk: logo + titel + knoppen in één kopregel die bovenaan blijft staan. */
body.lite header { display: none; }
body.lite .lite-head { position: sticky; top: 0; z-index: 5; margin: -14px -14px 0; padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
  background: rgba(var(--panel-rgb), .92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid rgba(var(--accent-rgb), .25); }
.lite-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
.lite-title .brand-mark { width: 34px; height: 34px; font-size: 18px; display: grid; place-items: center; flex: none; }
/* ================= ANIMATIES (stap 6c) =================
   Kort en spaarzaam. Alles valt weg bij "minder beweging" (zie onderaan).
   #main.enter wordt kort gezet als je van tabblad wisselt of de app opent. */
@keyframes fx-in { from { opacity: 0; transform: translateY(8px); } }
@keyframes fx-reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes fx-grow { from { transform: scaleX(0); } }
@keyframes fx-pop { from { opacity: 0; transform: translateY(6px) scale(.98); } }
@keyframes fx-drop { from { opacity: 0; transform: translateY(-4px); } }
#main.enter > * { animation: fx-in .32s ease-out both; }
#main.enter > *:nth-child(2) { animation-delay: .04s; } #main.enter > *:nth-child(3) { animation-delay: .08s; }
#main.enter > *:nth-child(4) { animation-delay: .12s; } #main.enter > *:nth-child(5) { animation-delay: .16s; }
#main.enter > *:nth-child(n+6) { animation-delay: .2s; }
#main.enter .chart svg, #main.enter .trend svg, #main.enter section svg { animation: fx-reveal .8s ease-out .15s both; }
#main.enter .fill, #main.enter .gw-bar span { transform-origin: left center; animation: fx-grow .8s cubic-bezier(.2, .8, .2, 1) .15s both; }
dialog[open] { animation: fx-pop .18s ease-out; }
.menu.open .menu-list { animation: fx-drop .16s ease-out; }
.card, .kpi, .btn, .theme-tile { transition: box-shadow .2s ease, border-color .2s ease, background-color .2s ease, color .2s ease; }
.kpi:hover { border-color: rgba(var(--accent-rgb), .45); }

/* Cyberpunk: korte glitch op de titel */
@keyframes fx-glitch {
  0% { clip-path: inset(40% 0 35% 0); transform: translateX(-6px); text-shadow: -3px 0 var(--magenta), 3px 0 var(--accent); }
  20% { clip-path: inset(10% 0 60% 0); transform: translateX(5px); }
  40% { clip-path: inset(70% 0 5% 0); transform: translateX(-3px); text-shadow: 3px 0 var(--magenta), -3px 0 var(--accent); }
  60% { clip-path: inset(0 0 0 0); transform: translateX(2px); }
  100% { clip-path: inset(0 0 0 0); transform: none; } }
[data-theme="cyberpunk"] #main.enter .page-head h1 { animation: fx-glitch .45s steps(2, end) .1s both; }

/* Matrix: knipperende cursor (de titel typt zichzelf via het script) */
@keyframes fx-blink { 50% { opacity: 0; } }
[data-theme="matrix"] .page-head h1::after { animation: fx-blink 1.05s steps(1, end) infinite; }

/* Achtergrondlaag voor Synthwave en Oceaan (bewogen met transform = door de grafische kaart, zuinig).
   #fx::before / #fx::after / #fx > i = losse lagen; welke wat doet, hangt af van het thema. */
#fx { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; display: none; }
#fx > i { position: absolute; display: block; }
[data-theme="synthwave"] #fx, [data-theme="oceaan"] #fx { display: block; }

/* Synthwave: gestreepte zon aan de horizon + neonvloer die naar je toe rolt */
@keyframes fx-floor { from { transform: perspective(420px) rotateX(70deg) translateY(0); } to { transform: perspective(420px) rotateX(70deg) translateY(48px); } }
@keyframes fx-sun { from { transform: translateX(-50%) scale(1); filter: brightness(1); } to { transform: translateX(-50%) scale(1.05); filter: brightness(1.25); } }
[data-theme="synthwave"] #fx::before { content: ""; position: absolute; left: 50%; bottom: 13%; width: min(46vmin, 520px); aspect-ratio: 1; border-radius: 50%;
  background: linear-gradient(180deg, var(--gold) 5%, var(--accent) 45%, var(--magenta) 90%);
  -webkit-mask-image: linear-gradient(to bottom, var(--bg) 48%, transparent 48%), repeating-linear-gradient(to bottom, transparent 0 7px, var(--bg) 7px 15px);
  mask-image: linear-gradient(to bottom, var(--bg) 48%, transparent 48%), repeating-linear-gradient(to bottom, transparent 0 7px, var(--bg) 7px 15px);
  box-shadow: 0 0 80px rgba(var(--magenta-rgb), calc(.55 * var(--glow))); opacity: .75;
  animation: fx-sun 4s ease-in-out infinite alternate; }
[data-theme="synthwave"] #fx > i:nth-of-type(1) { left: -80%; right: -80%; bottom: 0; height: 120%;
  background: linear-gradient(rgba(var(--magenta-rgb), .75) 2px, transparent 2px) 0 0 / 100% 48px,
              linear-gradient(90deg, rgba(var(--accent-rgb), .55) 2px, transparent 2px) 0 0 / 48px 100%,
              linear-gradient(to top, rgba(var(--magenta-rgb), .18), transparent);
  -webkit-mask-image: linear-gradient(to top, var(--bg) 35%, transparent 95%); mask-image: linear-gradient(to top, var(--bg) 35%, transparent 95%);
  transform-origin: 50% 100%; animation: fx-floor 2.2s linear infinite; }
[data-theme="synthwave"][data-mode="light"] #fx::before { opacity: .55; }

/* Oceaan: golven die onderaan voorbij rollen + lichtvlekken die deinen */
@keyframes fx-tide { to { transform: translate(12vmax, 8vmax) scale(1.18); } }
@keyframes fx-wave { to { transform: translateX(-50%); } }
[data-theme="oceaan"] #fx::before, [data-theme="oceaan"] #fx::after { content: ""; position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; }
[data-theme="oceaan"] #fx::before { left: -22vmax; top: -34vmax; background: radial-gradient(circle, rgba(var(--accent-rgb), .32), transparent 62%); animation: fx-tide 9s ease-in-out infinite alternate; }
[data-theme="oceaan"] #fx::after { right: -26vmax; bottom: -30vmax; background: radial-gradient(circle, rgba(var(--magenta-rgb), .26), transparent 62%); animation: fx-tide 12s ease-in-out infinite alternate-reverse; }
[data-theme="oceaan"] #fx > i { left: 0; bottom: 0; width: 200%; height: 150px;
  -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 150' preserveAspectRatio='none'><path d='M0 60 C100 20 200 20 300 60 S500 100 600 60 S750 20 800 60 V150 H0Z'/></svg>");
  mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 150' preserveAspectRatio='none'><path d='M0 60 C100 20 200 20 300 60 S500 100 600 60 S750 20 800 60 V150 H0Z'/></svg>");
  -webkit-mask-size: 50% 100%; mask-size: 50% 100%; -webkit-mask-repeat: repeat-x; mask-repeat: repeat-x; }
[data-theme="oceaan"] #fx > i:nth-of-type(1) { background: linear-gradient(to top, rgba(var(--accent-rgb), .30), rgba(var(--accent-rgb), .12)); animation: fx-wave 14s linear infinite; }
[data-theme="oceaan"] #fx > i:nth-of-type(2) { height: 110px; background: linear-gradient(to top, rgba(var(--magenta-rgb), .26), rgba(var(--magenta-rgb), .08)); animation: fx-wave 9s linear infinite reverse; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } #fx { display: none !important; } }
</style>
</head>

<div id="fx" aria-hidden="true"><i></i><i></i></div>
<header>

      <button class="btn" id="btn-install" data-act="install" type="button" style="display:none" title="Als programma installeren">⤓ <span class="label-long">Installeren</span></button>

          <button type="button" data-act="import-json" role="menuitem">Back-up terugzetten<small>Laad een eerder geëxporteerd .json-bestand</small></button>

          <button type="button" data-act="install" role="menuitem" id="mi-install">App installeren<small>Als programma op je pc of gsm, werkt ook offline</small></button>

<div class="shell"><main id="main"></main><aside id="side" aria-label="Snel overzicht"></aside></div>

<input type="file" id="file-csv" accept=".csv,text/csv" multiple hidden>
<input type="file" id="file-json" accept=".json,.gz,application/json,application/gzip" hidden>
<input type="file" id="file-lite" hidden>
<div class="tooltip" id="tip" role="tooltip"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/*__CORE__*/
</script>
<script>
(function () {
  "use strict";
  const KEY = "budgetplanner.v1";
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = new Intl.NumberFormat("nl-BE", { style: "currency", currency: "EUR" });
  const fmt0 = new Intl.NumberFormat("nl-BE", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
  const eur = n => fmt.format(n || 0);
  const eur0 = n => fmt0.format(n || 0);
  const eurS = n => Math.abs(n || 0) < 100 && Math.round((n || 0) * 100) % 100 !== 0 ? fmt.format(n || 0) : fmt0.format(n || 0);
  const signed = n => (n > 0 ? "+" : n < 0 ? "−" : "") + fmt.format(Math.abs(n || 0));
  const monthName = ym => { const [y, m] = ym.split("-"); return new Date(+y, +m - 1, 1).toLocaleDateString("nl-BE", { month: "long", year: "numeric" }); };
  const monthShort = ym => { const [y, m] = ym.split("-"); return new Date(+y, +m - 1, 1).toLocaleDateString("nl-BE", { month: "short" }).replace(".", ""); };
  const shiftMonth = (ym, d) => { const [y, m] = ym.split("-").map(Number); const t = new Date(y, m - 1 + d, 1); return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0"); };
  const fmtDate = d => { const [y, m, dd] = d.split("-"); return `${dd}/${m}/${y}`; };
  const todayYm = () => { const t = new Date(); return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0"); };

  /* ---------- opslag: IndexedDB (groot), met localStorage als reserve ---------- */
  let storageOk = true, storageFull = false, backend = "idb", dbp = null;
  function hydrate(obj) {
    const st = Object.assign(newState(), obj || {});
    if (!st.credits) st.credits = []; if (!st.loans) st.loans = []; if (!st.balances) st.balances = [];
    if (!st.accounts) st.accounts = {};
    savConf(st); ensureGoalRefs(st);
    if (!st.splitRules) st.splitRules = [];
    if (!st.plans) st.plans = []; if (!st.ignoredRecurring) st.ignoredRecurring = []; if (!st.ignoredPrice) st.ignoredPrice = [];
    for (const t of st.transactions) if (t.account && !st.accounts[t.account]) st.accounts[t.account] = { type: "zicht", name: "" };
    for (const c of st.credits) {
      if (!c.keywords && c.entries) { const keys = [...new Set(c.entries.filter(e => e.txId).map(e => st.transactions.find(t => t.id === e.txId)).filter(Boolean).map(txRefKey))]; if (keys.length) c.keywords = keys.join(", "); }
      if (c.entries) c.entries = c.entries.filter(e => !e.txId); if (c.anchorUsed === undefined) { c.anchorUsed = null; c.anchorDate = ""; } if (c.keywords === undefined) c.keywords = ""; delete c.startBalance; delete c.startDate; }
    return st;
  }
  function openDb() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      try {
        const rq = indexedDB.open("budgetplanner", 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore("kv");
        rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); rq.onblocked = () => rej(new Error("blocked"));
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  async function idbGet(k) { const db = await openDb(); return new Promise((res, rej) => { const rq = db.transaction("kv").objectStore("kv").get(k); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); }
  async function idbPut(k, v) { const db = await openDb(); return new Promise((res, rej) => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }); }
  async function loadState() {
    let fromLs = null;
    try { const raw = localStorage.getItem(KEY); if (raw) fromLs = JSON.parse(raw); } catch (e) {}
    try {
      const v = await idbGet("state");
      if (v) {
        const st = hydrate(typeof v === "string" ? JSON.parse(v) : v);
        // gegevens die een oudere versie van de planner nog in de kleine opslag zette: samenvoegen
        if (fromLs && Array.isArray(fromLs.transactions)) {
          const seen = new Set(st.transactions.map(t => txKey(t) || t.id)); let n = 0;
          for (const t of fromLs.transactions) { const k = txKey(t) || t.id; if (!seen.has(k)) { st.transactions.push(t); seen.add(k); n++; } }
          if (n) { sortTx(st); await idbPut("state", JSON.stringify(st)); setTimeout(() => toast(`${n} transacties uit een oudere opslag teruggezet`), 600); }
          try { localStorage.removeItem(KEY); } catch (e) {}
        }
        return st;
      }
      if (fromLs) { await idbPut("state", JSON.stringify(fromLs)); try { localStorage.removeItem(KEY); } catch (e) {} }   // eenmalig overzetten
      return hydrate(fromLs);
    } catch (e) {
      backend = "ls";
      if (fromLs) return hydrate(fromLs);
      try { localStorage.setItem(KEY + ".test", "1"); localStorage.removeItem(KEY + ".test"); } catch (e2) { storageOk = false; }
      return newState();
    }
  }
  let writing = false, dirty = false;
  let unsynced = false;   // iets veranderd sinds de laatste OneDrive-back-up
  function save() {
    unsynced = true;
    if (backend === "ls") {
      try { localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; storageFull = false; }
      catch (e) { storageOk = false; storageFull = !!(e && (e.name === "QuotaExceededError" || e.code === 22 || e.code === 1014)); }
      return;
    }
    dirty = true; if (writing) return;
    (async () => {
      writing = true;
      while (dirty) {
        dirty = false;
        try { await idbPut("state", JSON.stringify(state)); if (!storageOk) { storageOk = true; storageFull = false; render(); } }
        catch (e) { const was = storageOk; storageOk = false; storageFull = !!(e && e.name === "QuotaExceededError"); if (was) render(); }
      }
      writing = false;
    })();
  }
  let state = newState();
  const ui = { month: null, txAll: false, txSearch: "", txCat: "", open: new Set(), period: "maand", year: null, ruleSug: null, folderAsk: false };
  ui.month = todayYm();

  /* ---------- helpers ---------- */
  const catNames = () => state.categories.map(c => c.name);
  function catOptions(sel) {
    const groups = {};
    for (const c of state.categories) (groups[c.type] = groups[c.type] || []).push(c.name);
    let h = `<option value="${UNCAT}"${sel === UNCAT ? " selected" : ""}>${UNCAT}</option>`;
    for (const t of TYPES) if (groups[t]) h += `<optgroup label="${t}">` + groups[t].map(n => `<option${n === sel ? " selected" : ""}>${esc(n)}</option>`).join("") + "</optgroup>";
    if (sel && sel !== UNCAT && !catNames().includes(sel)) h += `<option selected>${esc(sel)}</option>`;
    return h;
  }
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.style.display = "block";
    clearTimeout(toast._t); toast._t = setTimeout(() => (t.style.display = "none"), 4200);
  }
  function dialog(html, onReady) {
    const d = $("#dlg"); d.innerHTML = html; d.showModal(); if (onReady) onReady(d);
    d.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => d.close()));
  }
  function confirmDlg(title, text, okLabel, onOk, danger) {
    dialog(`<h3>${esc(title)}</h3><p>${esc(text)}</p><div class="row"><button class="btn" data-close type="button">Annuleren</button><button class="btn ${danger ? "danger" : "primary"}" id="dlg-ok" type="button">${esc(okLabel)}</button></div>`,
      d => d.querySelector("#dlg-ok").addEventListener("click", () => { d.close(); onOk(); }));
  }

  /* ---------- import / export ---------- */
  function askAccountTypes(list) {
    return new Promise(resolve => {
      dialog(`<h3>Nieuwe rekening${list.length > 1 ? "en" : ""}</h3><p>Welk soort rekening is dit? Transacties van een spaarrekening komen in het tabblad Spaar en tellen niet mee in je budget.</p>
        ${list.map((a, i) => `<label for="acc-${i}" class="num">${esc(a.replace(/(.{4})/g, "$1 ").trim())}</label><select class="input" id="acc-${i}"><option value="zicht">Zichtrekening</option><option value="spaar">Spaarrekening</option></select>`).join("")}
        <div class="row"><button class="btn primary" id="acc-ok" type="button">Verder importeren</button></div>`, d => {
        d.addEventListener("cancel", e => e.preventDefault(), { once: true });
        d.querySelector("#acc-ok").addEventListener("click", () => { const out = {}; list.forEach((a, i) => out[a] = d.querySelector("#acc-" + i).value); d.close(); resolve(out); });
      });
    });
  }
  async function importCsvFiles(files) {
    let added = 0, dup = 0, uncat = 0, auto = 0, errors = [], minD = null, maxD = null, savAdded = 0;
    const parsed = [];
    for (const f of files) {
      const res = parseBankCsv(decodeBytes(await f.arrayBuffer()));
      if (res.error) errors.push(f.name + ": " + res.error); else parsed.push(res);
    }
    if (!state.accounts) state.accounts = {};
    const unknown = [...new Set(parsed.flatMap(p => p.rows.map(r => r.account)).filter(a => a && !state.accounts[a]))];
    if (unknown.length) {
      const known = Object.keys(state.accounts).length;
      const types = known || state.transactions.length ? await askAccountTypes(unknown) : (unknown.length === 1 ? { [unknown[0]]: "zicht" } : await askAccountTypes(unknown));
      for (const a of unknown) state.accounts[a] = { type: types[a] || "zicht", name: types[a] === "spaar" ? "Spaarrekening" : "" };
    }
    for (const res of parsed) {
      for (const r of res.rows) { if (!minD || r.date < minD) minD = r.date; if (!maxD || r.date > maxD) maxD = r.date; }
      const before = state.transactions.length;
      const r = mergeRows(state, res.rows); added += r.added; dup += r.dup; uncat += r.uncat; auto += r.auto;
      savAdded += 0;
    }
    const sug = 0; const resolved = resolvePending(state); applyAllSplitRules(state);
    if (added) { askPersist(); setTimeout(() => folderAuto("import"), 800); }
    const newSav = savMoves(state).filter(m => m.src === "bank" && !m.checked && m.date >= (minD || "0")).length;
    save();
    if (maxD) { ui.month = maxD.slice(0, 7); ui.year = +maxD.slice(0, 4); }
    render();
    if (errors.length) { dialog(`<h3>Import niet gelukt</h3><p>${errors.map(esc).join("<br>")}</p><div class="row"><button class="btn primary" data-close type="button">OK</button></div>`); return; }
    const period = minD ? `${fmtDate(minD)} tot ${fmtDate(maxD)}` : "";
    dialog(`<h3>Import klaar</h3>
      <p>${period ? `Bestand met transacties van <b>${period}</b>.<br>` : ""}<b>${added}</b> nieuwe transactie${added === 1 ? "" : "s"} toegevoegd · ${dup} stond${dup === 1 ? "" : "en"} er al in${auto ? ` · ${auto} herkend van eerder` : ""} · ${uncat} te categoriseren.${newSav ? `<br><b>${newSav}</b> beweging${newSav === 1 ? "" : "en"} van of naar je spaarrekening te controleren in Spaar.` : ""}${resolved ? `<br>${resolved} geplande spaarverrichting${resolved === 1 ? "" : "en"} teruggevonden en afgevinkt.` : ""}</p>
      <div class="row"><button class="btn" data-close type="button">Sluiten</button>${uncat ? `<button class="btn" id="imp-rules" type="button">🔍 Regels voorstellen</button>` : ""}${newSav ? `<button class="btn" id="imp-sav" type="button">Naar Spaar</button>` : ""}${minD ? `<button class="btn" id="imp-tx" type="button">Bekijk transacties</button><button class="btn primary" id="imp-year" type="button">Bekijk ${maxD.slice(0, 4)}</button>` : ""}</div>`, d => {
      const ir = d.querySelector("#imp-rules"); if (ir) ir.addEventListener("click", () => { d.close(); analyzeRules(); });
      const sv = d.querySelector("#imp-sav"); if (sv) sv.addEventListener("click", () => { d.close(); location.hash = "spaar"; });
      const y = d.querySelector("#imp-year"), t = d.querySelector("#imp-tx");
      if (y) y.addEventListener("click", () => { d.close(); ui.period = "jaar"; ui.year = +maxD.slice(0, 4); if (location.hash !== "#overzicht") location.hash = "overzicht"; render(); window.scrollTo(0, 0); });
      if (t) t.addEventListener("click", () => { d.close(); ui.txAll = false; ui.txCat = ""; ui.txSearch = ""; ui.month = maxD.slice(0, 7); location.hash = "transacties"; render(); window.scrollTo(0, 0); });
    });
  }
  // Bestand aanbieden als gewone browserdownload (Blob + <a download>).
  async function offerFile(filename, data, mime) {
    try {
      const url = URL.createObjectURL(new Blob([data], { type: mime + ";charset=utf-8" }));
      const a = document.createElement("a"); a.href = url; a.download = filename; a.style.display = "none";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      return true;
    } catch (e) { /* downloaden lukt niet: val terug op kopiëren */ }
    dialog(`<h3>${esc(filename)}</h3><p>Downloaden lukt hier niet. Kopieer de inhoud en bewaar ze als <b>${esc(filename)}</b>.</p>
      <textarea id="dl-text" readonly></textarea>
      <div class="row"><button class="btn" data-close type="button">Sluiten</button><button class="btn primary" id="dl-copy" type="button">Kopiëren</button></div>`,
      d => {
        d.querySelector("#dl-text").value = data;
        d.querySelector("#dl-copy").addEventListener("click", async () => {
          try { await navigator.clipboard.writeText(data); toast("Gekopieerd"); }
          catch (e) { const ta = d.querySelector("#dl-text"); ta.select(); toast("Selecteer en kopieer met Ctrl+C"); }
        });
      });
    return false;
  }
  /* ---------- thema's ----------
     De keuze hoort bij dit toestel (localStorage), niet bij de back-up: zo kan je gsm licht en je pc donker zijn. */
  const THEMES = [["cyberpunk", "Cyberpunk"], ["synthwave", "Synthwave"], ["matrix", "Matrix"], ["oceaan", "Oceaan"]];
  function getTheme() { const r = document.documentElement; return { t: r.dataset.theme || "cyberpunk", m: r.dataset.mode || "dark" }; }
  function applyTheme(th) {
    const r = document.documentElement; r.dataset.theme = th.t; r.dataset.mode = th.m; $("#theme-fonts").href = window.THEME_FONTS[th.t];
    try { localStorage.setItem(KEY + ".theme", JSON.stringify(th)); } catch (e) {}
    syncThemeColor();
  }
  // statusbalk/titelbalk in de kleur van de achtergrond van het thema
  function syncThemeColor() { const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#000000"; }
  function loadAllThemeFonts() {   // voor de voorbeeldtegels
    for (const [id] of THEMES) if (!document.getElementById("tf-" + id)) { const l = document.createElement("link"); l.id = "tf-" + id; l.rel = "stylesheet"; l.href = window.THEME_FONTS[id]; document.head.appendChild(l); }
  }
  function themeDialog() {
    loadAllThemeFonts();
    const draw = () => { const cur = getTheme();
      return `<h3>Thema</h3><p class="muted" style="margin:4px 0 10px">Geldt voor dit toestel. Je gegevens veranderen niet.</p>

  async function loadDirHandle() { if (!dirHandle) { try { dirHandle = (await idbGet("dirHandle")) || null; } catch (e) {} } return dirHandle; }

    const d = lite.data, ago = at => { const m = Math.round((Date.now() - new Date(at)) / 60000); return m < 60 ? `${m} min geleden` : m < 1440 ? `${Math.round(m / 60)} u geleden` : new Date(at).toLocaleDateString("nl-BE", { day: "numeric", month: "short" }) + " " + new Date(at).toLocaleTimeString("nl-BE", { hour: "2-digit", minute: "2-digit" }); };
    let h = `<div class="lite-head"><div class="lite-title"><span class="brand-mark" aria-hidden="true">€</span><div><h1>Overzicht</h1><p class="muted">${d ? `Bijgewerkt ${esc(ago(d.at))}` : "Nog geen gegevens"}</p></div></div><div class="lite-btns"><button class="btn lite-eye" data-act="lite-eye" type="button" aria-pressed="${liteHidden() ? "false" : "true"}" aria-label="${liteHidden() ? "Bedragen tonen" : "Bedragen verbergen"}">${liteHidden() ? EYE_OFF : EYE_ON}</button><button class="btn${lite.busy ? "" : " primary"}" data-act="lite-refresh" type="button" ${lite.busy ? "disabled" : ""}>${lite.busy ? "…" : "⟳"}</button></div></div>`;
    if (lite.news) h += `<div class="lite-news" data-act="lite-news-ok">⚡ <b>Nieuwe update</b> van je planner · ${esc(new Date(lite.news.at).toLocaleString("nl-BE", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }))}${lite.news.newTx ? ` · ${lite.news.newTx} nieuwe transactie${lite.news.newTx === 1 ? "" : "s"}` : ""}<span>✕</span></div>`;
    if (lite.status) h += `<div class="notice ${/lukte|niet|Open/.test(lite.status) ? "warn" : "info"}"><span>${esc(lite.status)}</span></div>`;
    if (!d) return h + `<section class="card"><p>Op je gsm toont de planner de samenvatting die je pc in je OneDrive zet bij elke back-up.</p><p class="muted">Schakel op je pc de OneDrive-back-up in (Back-up → OneDrive-back-up). Tik dan hier op <b>⟳</b> en kies in OneDrive het bestand <b>budgetplanner-mobiel.txt</b>.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="lite-refresh" type="button">Samenvatting kiezen</button><button class="btn" data-act="import-json" type="button">Back-up terugzetten</button></div></section>` + liteFoot();
    const k = d.k, kp = (l, v, c, cls) => `<div class="kpi" style="--k:${c}"><div class="label">${l}</div><div class="value num"><span class="${cls}">${v}</span></div></div>`;
    h += `<div class="lite-kpis">${kp("Inkomsten", eur0(k.inc), "var(--pos)", "pos")}${kp("Uitgaven", eur0(k.exp), "var(--neg)", "neg")}${kp("Gespaard", eurS(k.saved), "var(--gold)", "gold")}${kp("Netto", (k.net >= 0 ? "+" : "−") + eur0(Math.abs(k.net)), k.net >= 0 ? "var(--pos)" : "var(--neg)", k.net >= 0 ? "pos" : "neg")}</div>`;
    h += `<section class="card lite-bal"><div class="label">Saldo op rekening</div><div class="gw-amt num ${k.bal !== null && k.bal < 0 ? "neg" : ""}">${k.bal === null ? "—" : eur(k.bal)}</div>${k.uncat ? `<span class="chip warn">${k.uncat} te categoriseren</span>` : ""}</section>`;
    if (d.price && d.price.length) h += `<details class="notice warn fold"><summary>⚠ ${d.price.length} prijsstijging${d.price.length === 1 ? "" : "en"} <span class="fold-hint">tik om te zien</span></summary><div style="display:grid;gap:4px">${d.price.map(p => `<span>${esc(p.t)}: <span class="num">${eur(p.o)}</span> → <b class="neg num">${eur(p.n)}</b></span>`).join("")}</div></details>`;
    if (d.soon.length) h += `<section class="card"><div class="card-head"><h2>Binnenkort</h2></div><div class="soon-list">${d.soon.map(x => { const late = x.d < todayS(); return `<div class="row-i" style="grid-template-columns:62px 1fr auto"><span class="num dt ${late ? "neg" : x.d <= addD(todayS(), 3) ? "gold" : "muted"}" style="font-size:12.5px">${late ? "te laat" : x.d === todayS() ? "vandaag" : fmtDate(x.d).slice(0, 5)}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.t)}${x.auto ? ' <span class="muted" style="font-size:11px">verwacht</span>' : ""}</span><span class="num ${x.k > 0 ? "pos" : "neg"}">${x.a ? (x.k > 0 ? "+" : "−") + eur0(x.a) : ""}</span></div>`; }).join("")}</div></section>`;
    if (d.fc) { const pts = d.fc.pts, W = 340, H = 80, mx = Math.max(...pts, d.fc.warn), mn = Math.min(...pts, d.fc.warn, 0), x = i => i / (pts.length - 1) * W, y = v => 4 + (mx - v) / ((mx - mn) || 1) * (H - 8);
      let p = `M0,${y(pts[0])}`; pts.forEach((v, i) => { if (i) p += `H${x(i).toFixed(1)}V${y(v).toFixed(1)}`; });
      h += `<section class="card"><div class="card-head"><h2>Saldoverwachting</h2><span class="hint">45 dagen</span></div><div class="pl-sum" style="margin:0 0 6px"><span>Laagste <b class="num ${d.fc.low < d.fc.warn ? "neg" : ""}">${eur0(d.fc.low)}</b> op ${fmtDate(d.fc.lowD).slice(0, 5)}</span></div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;overflow:visible"><line x1="0" x2="${W}" y1="${y(d.fc.warn)}" y2="${y(d.fc.warn)}" stroke="var(--neg)" stroke-dasharray="4 4" opacity=".7"/><path d="${p}" fill="none" stroke="var(--accent)" stroke-width="2" style="filter:drop-shadow(0 0 4px rgba(var(--accent-rgb), calc(.8 * var(--glow))))"/></svg></section>`; }
    if (d.goals.length) h += `<section class="card"><div class="card-head"><h2>Spaardoelen</h2>${d.sav.bal !== null ? `<span class="hint">Spaar <b class="gold num">${eur0(d.sav.bal)}</b></span>` : ""}</div>${d.goals.map(g => `<div class="lite-goal"><div class="gw-top"><span class="gw-name"><i style="background:${SERIES[g.c % SERIES.length]}"></i>${esc(g.n)}</span><b class="gold num">${eurS(g.tot)}${g.tg ? `<span class="muted" style="font-weight:400"> / ${eur0(g.tg)}</span>` : ""}</b></div><div class="gw-bar"><span style="width:${((g.pct || 0) * 100).toFixed(1)}%"></span></div></div>`).join("")}</section>`;
    if (d.cats.length) { const mx = Math.max(1, ...d.cats.map(c => Math.max(c.s, c.b))); h += `<section class="card"><div class="card-head"><h2>Uitgaven per categorie</h2></div><div class="cats">${d.cats.map(c => `<div class="cat-row" style="grid-template-columns:110px 1fr 74px"><span class="name">${esc(c.n)}</span><span class="track"><span class="fill${c.b && c.s > c.b ? " over" : ""}" style="width:${(c.s / mx * 100).toFixed(1)}%"></span>${c.b ? `<span class="budget-tick" style="left:calc(${(c.b / mx * 100).toFixed(1)}% - 1px)"></span>` : ""}</span><span class="amt num">${eur0(c.s)}</span></div>`).join("")}</div></section>`; }
    h += `<section class="card"><div class="card-head"><h2>Vermogen</h2></div><div class="gw-amt num" style="margin:0;color:${d.nw.tot >= 0 ? "var(--pos)" : "var(--neg)"};text-shadow:0 0 12px currentColor">${d.nw.tot < 0 ? "−" : ""}${eur0(Math.abs(d.nw.tot))}</div><div class="pl-sum" style="margin-top:6px"><span>Rekening <b class="num">${eur0(d.nw.z)}</b></span><span>Spaar <b class="gold num">${eur0(d.nw.s)}</b></span><span>Schulden <b class="neg num">−${eur0(d.nw.l + d.nw.c)}</b></span></div>
      ${d.debts.length ? `<div class="soon-list" style="margin-top:8px">${d.debts.map(x => `<div class="row-i" style="grid-template-columns:1fr auto"><span>${esc(x.n)} <span class="muted" style="font-size:11.5px">${x.t}${x.end ? " · tot " + esc(x.end) : ""}${x.free !== undefined && x.free !== null ? ` · <span class="num">${eur0(x.free)}</span> vrij` : ""}</span></span><span class="num neg">${x.v === null ? "—" : "−" + eur0(x.v)}</span></div>`).join("")}</div>` : ""}</section>`;
    h += `<section class="card"><div class="card-head"><h2>Laatste transacties</h2></div><div class="soon-list">${d.tx.map(x => `<div class="row-i" style="grid-template-columns:48px 1fr auto"><span class="num dt muted" style="font-size:12px">${fmtDate(x.d).slice(0, 5)}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.s)}<br><span class="muted" style="font-size:11.5px">${esc(x.c)}</span></span><span class="num ${x.a >= 0 ? "pos" : "neg"}">${signed(x.a)}</span></div>`).join("")}</div></section>`;

  }
  function liteFoot() { return `<p class="foot">Alleen bekijken · wijzigen doe je op je pc${lite.data && lite.data.src === "bestand" ? "<br>Bijwerken: ⟳ en kies budgetplanner-mobiel.txt in OneDrive" : ""}<br><button class="btn small ghost" data-act="lite-full" type="button">Volledige planner openen</button><br><button class="btn small ghost" data-act="theme-open" type="button">🎨 Thema</button>${isStandalone() ? "" : `<br><button class="btn small ghost" data-act="install" type="button">⤓ App installeren</button>`}</p>`; }

  /* ---------- pincode ---------- */
  async function sha(t) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
  function isUnlocked() { try { return sessionStorage.getItem(KEY + ".unlocked") === "1"; } catch (e) { return false; } }
  function setUnlocked() { try { sessionStorage.setItem(KEY + ".unlocked", "1"); } catch (e) {} }
  function showLock(after) {
    const ov = document.createElement("div"); ov.id = "lock";
    ov.innerHTML = `<div class="lock-box"><div class="brand-mark" style="width:42px;height:42px;font-size:22px;margin:0 auto 14px">€</div><h2>Budgetplanner</h2><p class="muted">Geef je pincode in</p><input class="input num" id="lock-pin" type="password" inputmode="numeric" autocomplete="off" aria-label="Pincode"><p id="lock-err" class="neg" style="min-height:18px;margin:8px 0 0;font-size:13px"></p><button class="btn primary" id="lock-ok" type="button" style="margin-top:6px">Ontgrendelen</button></div>`;
    document.body.appendChild(ov);
    const inp = ov.querySelector("#lock-pin"); setTimeout(() => inp.focus(), 50);
    const go = async () => { if (await sha(state.pin.salt + inp.value) === state.pin.hash) { setUnlocked(); ov.remove(); after(); } else { ov.querySelector("#lock-err").textContent = "Verkeerde pincode"; inp.value = ""; inp.focus(); } };
    ov.querySelector("#lock-ok").addEventListener("click", go); inp.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  }
  function pinDialog() {
    const has = !!(state.pin && state.pin.hash);
    dialog(`<h3>Pincode</h3><p>Met een pincode vraagt de planner telkens je code als je hem opent. Dat schermt je cijfers af voor wie even aan je pc zit. Je gegevens zelf blijven wel onversleuteld in je browser staan.</p>
      ${has ? `<label for="pin-old">Huidige pincode</label><input class="input" id="pin-old" type="password" inputmode="numeric">` : ""}
      <label for="pin-new">${has ? "Nieuwe pincode (leeg = uitschakelen)" : "Nieuwe pincode (min. 4 cijfers)"}</label><input class="input" id="pin-new" type="password" inputmode="numeric">
      <p id="pin-err" class="neg" style="margin:8px 0 0;font-size:12.5px"></p>
      <div class="row"><button class="btn" data-close type="button">Annuleren</button><button class="btn primary" id="pin-ok" type="button">Opslaan</button></div>`, d => {
      d.querySelector("#pin-ok").addEventListener("click", async () => {
        const nw = d.querySelector("#pin-new").value.trim(), err = d.querySelector("#pin-err");
        if (has && await sha(state.pin.salt + d.querySelector("#pin-old").value) !== state.pin.hash) { err.textContent = "Huidige pincode klopt niet."; return; }
        if (!nw && has) { state.pin = null; save(); d.close(); toast("Pincode uitgeschakeld"); return; }
        if (!/^\d{4,8}$/.test(nw)) { err.textContent = "Gebruik 4 tot 8 cijfers."; return; }
        const salt = Math.random().toString(36).slice(2); state.pin = { salt, hash: await sha(salt + nw) }; setUnlocked(); save(); d.close(); toast("Pincode ingesteld");
      });
    });
  }

  /* ---------- views ---------- */
  function monthSwitch() {
    return `<div class="month" role="group" aria-label="Maand kiezen"><button type="button" data-act="prev-month" aria-label="Vorige maand">‹</button><span>${esc(monthName(ui.month))}</span><button type="button" data-act="next-month" aria-label="Volgende maand">›</button></div>`;
  }
  function notices() {
    let h = "";
    if (!storageOk) h += `<div class="notice warn"><span>${storageFull ? "De opslag van je browser is vol: je laatste wijzigingen zijn niet bewaard. Exporteer meteen een back-up en maak wat ruimte vrij op je schijf." : "Deze browser laat geen opslag toe op deze pagina. Je wijzigingen verdwijnen bij het sluiten: exporteer een back-up."}</span><button class="btn small" data-act="export-json" type="button">Back-up exporteren</button></div>`;
    else if (state.folder && state.folder.enabled && ui.folderAsk) h += `<div class="notice info"><span>☁ De browser vraagt opnieuw toestemming voor je OneDrive-map. Klik om de automatische back-up te hervatten.</span><button class="btn small primary" data-act="folder-resume" type="button">Hervatten</button></div>`;
    else if (state.folder && state.folder.enabled && state.folder.error) h += `<div class="notice warn"><span>☁ ${esc(state.folder.error)}</span><button class="btn small" data-act="folder-open" type="button">OneDrive-back-up</button></div>`;
    else if (state.transactions.length && !(state.folder && state.folder.enabled)) {
      const days = state.lastBackup ? Math.floor((Date.now() - new Date(state.lastBackup)) / 864e5) : null;
      if (days === null || days >= 14) h += `<div class="notice info"><span>${days === null ? "Je hebt nog geen back-up gemaakt." : `Je laatste back-up is ${days} dagen oud.`} Je gegevens staan enkel in deze browser.</span><span style="display:flex;gap:8px">${canFolder() ? `<button class="btn small" data-act="folder-open" type="button">☁ Automatisch naar OneDrive</button>` : ""}<button class="btn small" data-act="export-json" type="button">Back-up exporteren</button></span></div>`;
    }
    return h;
  }
  function emptyState() {
    return `<section class="drop" id="drop">
      <h2>Begin met je bankafschrift</h2>
      <p>Download je transacties als CSV in Home'Bank of de ING-app en sleep het bestand hierheen. Bekende winkels en je loon worden meteen gecategoriseerd. Bestanden die overlappen, geven geen dubbels.</p>
      <button class="btn primary" data-act="pick-csv" type="button">CSV-bestand kiezen</button>
      <p class="muted" style="margin:14px auto 0;font-size:12.5px">Gebruikte je de Budgetplanner al op claude.ai, of heb je een back-up? Exporteer daar via <b>Back-up → Back-up exporteren</b> en zet het bestand hier terug: <button class="btn small ghost" data-act="import-json" type="button">Back-up terugzetten</button></p>
    </section>`;
  }

  function periodSeg() {
    return `<div class="seg" role="group" aria-label="Periode"><button type="button" data-act="period-month" aria-pressed="${ui.period === "maand"}">Maand</button><button type="button" data-act="period-year" aria-pressed="${ui.period === "jaar"}">Jaar</button></div>`;
  }
  function viewOverview() {
    if (state.transactions.length && ui.period === "jaar") return viewYear();
    if (!state.transactions.length) return `<div class="page-head"><div><h1>Overzicht</h1><p>Inkomsten, uitgaven en spaardoelen per maand</p></div></div>${notices()}${emptyState()}`;
    const s = monthSummary(state, ui.month);
    const budget = t => state.categories.filter(c => c.type === t).reduce((a, c) => a + monthlyBudget(c), 0);
    const bExp = budget("Vaste kosten") + budget("Variabele kosten");
    const rate = s.income > 0 ? Math.round(s.saved / s.income * 100) : null;
    const kpi = (label, value, color, sub) => `<div class="kpi" style="--k:${color}"><div class="label">${label}</div><div class="value num">${value}</div><div class="sub">${sub}</div></div>`;
    let h = `<div class="page-head"><div><h1>Overzicht</h1><p>${s.count} transacties in ${esc(monthName(ui.month))}</p></div><div class="actions">${periodSeg()}${monthSwitch()}</div></div>${notices()}${priceNotice()}`;
    h += `<section class="kpis">
      ${kpi("Inkomsten", `<span class="pos">${eur0(s.income)}</span>`, "var(--pos)", budget("Inkomen") ? "gepland " + eur0(budget("Inkomen")) : "&nbsp;")}
      ${kpi("Uitgaven", `<span class="neg">${eur0(s.expenses)}</span>`, "var(--neg)", bExp ? `${Math.round(s.expenses / bExp * 100)}% van budget ${eur0(bExp)}` : `vast ${eur0(s.fixed)} · variabel ${eur0(s.variable)}`)}
      ${(() => {
        if (!hasSavings(state)) return kpi("Gespaard", `<span class="gold">${eurS(s.saved)}</span>`, "var(--gold)", rate === null ? "deze maand" : `deze maand · ${rate}% van je inkomen`);
        const sm = savingsSummary(state), m = sm.moves.filter(x => x.date.startsWith(ui.month)).reduce((a, x) => a + x.effect, 0);
        return kpi("Gespaard", `<span class="${m < 0 ? "neg" : "gold"}">${m < 0 ? "−" : ""}${eurS(Math.abs(m))}</span>`, "var(--gold)", `deze maand · totaal <span class="gold num">${eur(sm.bal.set ? sm.bal.total : sm.allocated)}</span>`);
      })()}
      ${kpi("Netto deze maand", `<span class="${s.net >= 0 ? "pos" : "neg"}">${s.net >= 0 ? "+" : "−"}${eur0(Math.abs(s.net))}</span>`, s.net >= 0 ? "var(--pos)" : "var(--neg)", s.uncatCount ? `<span class="chip warn">${s.uncatCount} te categoriseren · <button type="button" data-act="show-uncat">bekijken</button></span>` : `<span class="chip pos">alles gecategoriseerd</span>`)}
      ${(() => { const b = balanceAt(state, ui.month);
        return b.set ? kpi("Saldo op rekening", `<span class="${b.total >= 0 ? "gold" : "neg"}">${b.total < 0 ? "−" : ""}${fmt.format(Math.abs(b.total))}</span>`, b.total >= 0 ? "var(--gold)" : "var(--neg)", `op ${fmtDate(endOfMonth(ui.month))}${b.per.some(p => p.before) ? " · teruggerekend" : ""}`)
          : kpi("Saldo op rekening", `<span class="muted">—</span>`, "var(--line)", `<button class="btn small" data-act="goto-balance" type="button">Startsaldo ingeven</button>`); })()}
    </section>`;
    const uncatHtml = s.uncatCount ? uncatCard(ui.month) : "";
    h += goalsWide();
    h += `<div class="grid-2">${forecastCard()}${netWorthCard()}</div>`;
    h += `<div class="grid-2"><div class="stack"><section class="card">${catChart(s)}</section>${debtCard()}${uncatHtml}</div><div class="stack">${(state.plans.length || detectRecurring(state).length) ? soonCard(14, true) : ""}<section class="card trend">${trendChart()}</section>${carryCard()}</div></div>`;
    return h;
  }

  function uncatCard(ym) {
    const groups = uncatGroups(state, ym);
    let h = `<section class="card" id="uncat"><div class="card-head"><h2>Nog te categoriseren</h2><span class="hint">Gegroepeerd per winkel of persoon. Eén keuze geldt voor de hele groep en wordt onthouden.</span></div>`;
    h += `<div class="table-wrap"><table><tbody>` + groups.map(g => {
      return `<tr data-key="${esc(g.key)}"><td class="desc"><div class="d" style="cursor:default">${esc(g.label)}</div><div class="muted" style="font-size:12px">${g.count} transactie${g.count === 1 ? "" : "s"}</div></td>
        <td style="width:180px"><select style="max-width:170px" class="cat uncat" data-act="set-group" aria-label="Categorie voor ${esc(g.label)}">${catOptions(UNCAT)}</select></td>
        <td class="r num amount ${g.total >= 0 ? "pos" : "neg"}" style="width:100px">${signed(g.total)}</td>
        <td class="r" style="width:44px;white-space:nowrap"><button class="btn small ghost" data-act="show-group" type="button" title="Transacties bekijken" aria-label="Transacties bekijken">→</button></td></tr>`;
    }).join("") + `</tbody></table></div></section>`;
    return h;
  }
  function setGroup(key, cat, ym) {
    let n = 0;
    for (const t of state.transactions) if (t.cat === UNCAT && merchantKey(t) === key && (!ym || t.date.startsWith(ym) || true)) { setTxCat(t, cat); n++; }
    return n;
  }
  /* ---------- prijsstijgingen ---------- */
  function priceNotice() {
    const list = priceChanges(state); if (!list.length) return "";
    const rows = list.slice(0, 5).map(p => `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span>${esc(p.title)}: <span class="num">${eur(p.old)}</span> → <b class="num neg">${eur(p.now)}</b> (+${p.pct}%) sinds ${fmtDate(p.date)}</span><button class="btn small ghost" data-act="price-ok" data-key="${esc(p.key)}" type="button">Gezien</button></div>`).join("");
    // op een smal scherm ingeklapt tot één regel (tik om te openen)
    if (narrow()) return `<details class="notice warn fold"><summary>⚠ ${list.length} prijsstijging${list.length === 1 ? "" : "en"} <span class="fold-hint">tik om te zien</span></summary>${rows}</details>`;
    return `<div class="notice warn" style="flex-direction:column;align-items:stretch;gap:6px"><b style="font-family:var(--font-display);letter-spacing:.08em;text-transform:var(--case-ui);font-size:12px">⚠ Duurder geworden</b>${list.slice(0, 5).map(p => `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span>${esc(p.title)}: <span class="num">${eur(p.old)}</span> → <b class="num neg">${eur(p.now)}</b> (+${p.pct}%) sinds ${fmtDate(p.date)}</span><button class="btn small ghost" data-act="price-ok" data-key="${esc(p.key)}" type="button">Gezien</button></div>`).join("")}</div>`;
  }

  /* ---------- saldoverwachting ---------- */
  function forecast(days) {
    const t = todayS(), b = balanceAt(state, t.slice(0, 7));
    if (!b.set) return null;
    const items = agenda(state, addD(t, -10), addD(t, days), true).filter(it => !it.paid && !(it.plan.auto && it.date < t) && !(it.date < t && !it.plan.auto && it.date < addD(t, -10)));
    const pts = [{ date: t, value: b.total, items: [] }]; let v = b.total;
    const byDate = new Map(); for (const it of items) { const d = it.date < t ? t : it.date; if (!byDate.has(d)) byDate.set(d, []); byDate.get(d).push(it); }
    for (let d = t; d <= addD(t, days); d = addD(d, 1)) {

  /* ---------- vermogen ---------- */

  function netWorthCard() {

  function goalsWide() {

  function debtCard() {

    const rows = [];
    loans.forEach((l, i) => { const st = loanStatus(state, l, today); rows.push({ kind: "Lening", name: l.name, col: SERIES[i % SERIES.length], owed: st.ok ? st.current : null, total: l.original || null, sub: st.payoffYm ? "tot " + ymLabel(st.payoffYm) : st.ok ? "" : "saldo ontbreekt", monthly: st.ok && st.current === 0 ? 0 : st.monthly, tipExtra: l.original && st.ok ? `<br>Afbetaald: ${eur(l.original - st.current)} van ${eur(l.original)}` : "" }); });

  }

  /* algemene staafgrafiek (één as, ook negatieve waarden) */
  function bars({ labels, series, current, tips, acts, height = 240, fmtAxis }) {

    let g = "";
    for (let v = min; v <= max + 1e-9; v += step) g += `<line class="grid" x1="${L}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}" ${Math.abs(v) < 1e-9 ? 'style="stroke:var(--muted);opacity:.6"' : ""}/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fa(v)}</text>`;

      });
