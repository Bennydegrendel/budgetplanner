  function splitRulesCard() {
    const rules = state.splitRules || [];
    let h = `<section class="card"><div class="card-head"><h2>Splitsregels</h2><span class="hint">Splitst een vast bedrag af naar een andere categorie, bv. €15 van elke supermarktbetaling naar Huisdieren</span></div>`;

  function splitRuleDialog(i) {

  function savChart(sm) {
    const pts = sm.bal.history; if (!sm.bal.set || pts.length < 1) return "";
    const W = 1100, H = 220, L = 60, R = 16, T = 12, B = 26, iw = W - L - R, ih = H - T - B;
    const t0 = new Date(pts[0].date).getTime(), t1 = Math.max(t0 + 864e5, Date.now());
    const vals = pts.map(p => p.value), max = Math.max(1, ...vals), min = Math.min(0, ...vals);
    const step = niceStep((max - min) / 4), top = Math.ceil(max / step) * step, bot = Math.floor(min / step) * step;

    (state.credits || []).forEach((c, i) => { const st = creditStatus(state, c); if (!st.ok || !(st.used > 0)) return;
      const since = new Date(Date.now() - 92 * 864e5).toISOString().slice(0, 10);
      const paid = st.movements.filter(m => m.effect < 0 && m.date >= since).reduce((a, m) => a - m.effect, 0) / 3;
      out.push({ name: c.name, bal: st.used, rate: +c.rate || 0, min: Math.max(25, Math.round((paid || st.used * 0.03) * 100) / 100), col: SERIES[(state.loans.length + i) % SERIES.length] }); });
    return out;
  }
  function simulate(debts, extra, order) {
    const ds_ = debts.map(d => ({ ...d, r: d.rate ? Math.pow(1 + d.rate / 100, 1 / 12) - 1 : 0, paidOff: null }));
    const totalMin = ds_.reduce((a, d) => a + d.min, 0), budget = totalMin + extra;
    let month = 0, interest = 0; const curve = [ds_.reduce((a, d) => a + d.bal, 0)];
    while (ds_.some(d => d.bal > 0.005) && month < 600) {
      month++;
      for (const d of ds_) if (d.bal > 0) { const i = d.bal * d.r; d.bal += i; interest += i; }
      let pot = order ? budget : totalMin;                 // zonder strategie: alleen de minima, geen doorschuiven
      for (const d of ds_) if (d.bal > 0) { const p = Math.min(d.min, d.bal); d.bal -= p; pot -= p; if (!order) continue; }
      if (order) {
        const live = ds_.filter(d => d.bal > 0.005).sort(order);
        for (const d of live) { if (pot <= 0) break; const p = Math.min(pot, d.bal); d.bal -= p; pot -= p; }
      }
      for (const d of ds_) if (d.bal <= 0.005 && d.paidOff === null) { d.bal = 0; d.paidOff = month; }
      curve.push(ds_.reduce((a, d) => a + d.bal, 0));
    }
    return { months: month, interest: Math.round(interest * 100) / 100, curve, debts: ds_, never: month >= 600 };
  }
  function simCard() {
    const debts = debtsForSim();
    if (!debts.length) return `<section class="card"><div class="card-head"><h2>Sneller aflossen</h2></div><p class="muted">Vul bij je leningen en kredieten het openstaand saldo in om te simuleren hoeveel sneller je schuldenvrij kunt zijn.</p></section>`;
    const extra = +simUi.extra || 0;
    const base = simulate(debts, 0, null);
    const aval = simulate(debts, extra, (a, b) => b.rate - a.rate || a.bal - b.bal);
    const snow = simulate(debts, extra, (a, b) => a.bal - b.bal || b.rate - a.rate);
    const best = aval.interest <= snow.interest ? "lawine" : "sneeuwbal";
    const when = m => monthName(shiftMonth(todayS().slice(0, 7), m));
    const W = 1100, H = 220, L = 60, R = 16, T = 12, B = 26, iw = W - L - R, ih = H - T - B;
    const n = Math.max(base.curve.length, aval.curve.length, snow.curve.length), max = Math.max(...base.curve, 1);
    const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
    const x = i => L + i / (n - 1 || 1) * iw, y = v => T + (top - v) / top * ih;
    let g = ""; for (let v = 0; v <= top + 1e-9; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? (v / 1000).toLocaleString("nl-BE") + "k" : v}</text>`;
    const path = c => c.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1)).join("");
    g += `<path d="${path(base.curve)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/><path d="${path(snow.curve)}" fill="none" stroke="var(--gold)" stroke-width="2" style="filter:drop-shadow(0 0 4px rgba(var(--gold-rgb), calc(.7 * var(--glow))))"/><path d="${path(aval.curve)}" fill="none" stroke="var(--accent)" stroke-width="2" style="filter:drop-shadow(0 0 4px rgba(var(--accent-rgb), calc(.8 * var(--glow))))"/>`;
    for (let yr = 1; yr * 12 < n; yr++) g += `<text x="${x(yr * 12)}" y="${H - 6}" text-anchor="middle">+${yr} jaar</text>`;
    for (let i = 0; i < n; i += Math.max(1, Math.round(n / 60))) g += `<rect x="${x(i) - iw / n}" y="${T}" width="${2 * iw / n}" height="${ih}" fill="transparent" data-tip="${esc(`<b style="text-transform:capitalize">${esc(when(i))}</b><br>Zoals nu: ${eur0(base.curve[i] ?? 0)}<br>Lawine: ${eur0(aval.curve[i] ?? 0)}<br>Sneeuwbal: ${eur0(snow.curve[i] ?? 0)}`)}"/>`;
    const row = (lab, r, col) => `<tr><td><span style="display:inline-block;width:10px;height:3px;background:${col};vertical-align:middle;margin-right:8px"></span>${lab}</td><td class="num" style="text-transform:capitalize">${r.never ? "—" : esc(when(r.months))}</td><td class="r num">${r.never ? "—" : r.months + " mnd"}</td><td class="r num neg">${eur(r.interest)}</td><td class="r num ${r === base ? "muted" : "pos"}">${r === base ? "—" : (base.months - r.months > 0 ? (base.months - r.months) + " mnd sneller · " : "") + eur(Math.max(0, base.interest - r.interest)) + " minder rente"}</td></tr>`;
    const chosen = best === "lawine" ? aval : snow;
    return `<section class="card chart"><div class="card-head"><h2>Sneller aflossen</h2><span class="hint">Simulatie op basis van je huidige saldo's, rentes en maandaflossingen</span></div>
      <div class="toolbar"><label for="sim-extra">Extra per maand</label><input class="input num" id="sim-extra" data-act="sim-extra" inputmode="decimal" style="width:110px" value="${extra}"> <span class="muted" style="font-size:12.5px">€ bovenop je gewone aflossingen. Afgeloste schulden geven hun maandbedrag door aan de volgende.</span></div>
      <div class="table-wrap"><table><thead><tr><th>Scenario</th><th>Schuldenvrij</th><th class="r">Duur</th><th class="r">Rente totaal</th><th class="r">Winst</th></tr></thead><tbody>
      ${row("Zoals nu (geen extra)", base, "var(--muted)")}${row("Lawine: hoogste rente eerst", aval, "var(--accent)")}${row("Sneeuwbal: kleinste schuld eerst", snow, "var(--gold)")}</tbody></table></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Totale schuld per scenario" style="margin-top:10px">${g}</svg>
      <p style="margin:10px 0 0;font-size:13.5px">Advies: <b>${best === "lawine" ? "lawine" : "sneeuwbal"}</b>${aval.interest === snow.interest ? " (beide even goed)" : ""}. Volgorde: ${chosen.debts.slice().sort((a, b) => (a.paidOff ?? 999) - (b.paidOff ?? 999)).map(d => `${esc(d.name)} <span class="muted">(${d.paidOff ? esc(when(d.paidOff)) : "—"})</span>`).join(" → ")}.</p>
      <p class="muted" style="font-size:12px;margin:6px 0 0">Kredieten zonder vaste aflossing rekenen met je gemiddelde aflossing van de laatste 3 maanden (min. €25). Een simulatie, geen financieel advies: kijk ook na of je lening een wederbeleggingsvergoeding vraagt bij vervroegd aflossen.</p></section>`;
  }

  function viewHelp() {
    const tabName = t => (HELP_TABS.find(x => x[0] === t) || [])[1] || "";
    const plain = h => h.replace(/<[^>]+>/g, "").toLowerCase();
    let h = `<div class="page-head"><div><h1>Help</h1><p>Uitleg en stappenplannen</p></div></div>
      <section class="card help-search"><input class="input" id="help-q" type="search" placeholder="Zoek in de help, bv. startsaldo, OneDrive, splitsen…" aria-label="Zoeken in de help" autocomplete="off"><p class="muted" id="help-none" hidden style="margin:10px 0 0">Niets gevonden. Probeer een ander woord.</p></section>`;
    h += `<section class="card"><div class="card-head"><h2>Stappenplannen</h2><span class="hint">Klik om open te klappen</span></div><div class="help-list">` + HELP_TOPICS.map(t =>
      `<details class="help-item" id="help-${t.id}" data-q="${esc(plain(t.title + " " + t.steps.join(" ")))}"><summary><span class="help-ic">${t.icon}</span>${esc(t.title)}</summary>
        <ol class="help-steps">${t.steps.map((x, i) => `<li><span>${x}${t.show && t.show[i] ? ` <button class="linkbtn help-show" data-act="help-show" data-topic="${t.id}" data-i="${i}" type="button">Toon me →</button>` : ""}</span></li>`).join("")}</ol>${t.tab ? `<a class="hint" href="#${t.tab}">→ Naar ${esc(tabName(t.tab))}</a>` : ""}</details>`).join("") + `</div></section>`;
    h += `<section class="card"><div class="card-head"><h2>De tabbladen</h2></div><div class="help-tabs">` + HELP_TABS.map(([k, n, x]) =>
      `<div class="help-item help-tab" data-q="${esc(plain(n + " " + x))}"><a href="#${k}"><b>${esc(n)}</b></a><p>${x}</p></div>`).join("") + `</div></section>`;
    h += `<section class="card help-item" data-q="sneltoetsen toetsen ctrl z escape"><div class="card-head"><h2>Sneltoetsen (pc)</h2></div><div class="help-keys">
      <span><kbd>Ctrl</kbd>+<kbd>Z</kbd> laatste wisactie ongedaan maken</span><span><kbd>Esc</kbd> venster of menu sluiten</span></div></section>`;
    return h;
  }
  function helpFilter(q) {
    q = q.trim().toLowerCase(); let any = false;
    document.querySelectorAll("#main .help-item").forEach(el => { const hit = !q || q.split(/\s+/).every(w => el.dataset.q.includes(w)); el.hidden = !hit; if (hit) any = true; if (el.tagName === "DETAILS") el.open = !!q && hit; });
    const none = $("#help-none"); if (none) none.hidden = any;
  }

        h += `<i style="left:${(c / cols * 100).toFixed(2)}%;animation-duration:${(2.2 + Math.random() * 2.6).toFixed(2)}s;animation-delay:-${(Math.random() * 3).toFixed(2)}s;opacity:${(.25 + Math.random() * .5).toFixed(2)}">${t}</i>`; }
      fx.innerHTML = h; typeTitle(sp.querySelector(".sp-title"));
    }
    let done = false; const end = () => { if (done) return; done = true; sp.classList.add("out"); removeEventListener("keydown", end); setTimeout(() => { sp.remove(); }, 750); setTimeout(res, 250); };
    setTimeout(end, calm() ? 1200 : 3600); sp.addEventListener("click", end); addEventListener("keydown", end);
  });

  $("#main").innerHTML = `<p class="muted" style="padding:40px 0;text-align:center">Gegevens laden…</p>`;
  loadState().then(st => { state = st; syncThemeColor();
      const start = () => {
        try { if (localStorage.getItem(KEY + ".tut") === null) setTut(!state.transactions.length); } catch (e) {}   // nieuwe, lege planner: tutorial aan
        ui.month = state.transactions.length ? state.transactions[0].date.slice(0, 7) : todayYm();
        updateInstallUi(); if (state.transactions.length) askPersist();
        try { const n = dueItems().length; if (n) splashDone.then(() => setTimeout(() => toast(`⏰ ${n} betaling${n === 1 ? "" : "en"} binnenkort of te laat. Kijk in de Planner.`), 800)); } catch (e) {}
        if (liteMode()) { liteLoadCache(); liteFromLocal(); return; }
        setTimeout(() => folderAuto("open"), 1500);
        render(); };
      // versleuteld: altijd de pincode vragen (de sleutel zit enkel in het geheugen); oude pincode zonder versleuteling: zoals vroeger
      if (lockedEnv) { $("#main").innerHTML = ""; showLock(start, lockedEnv); }
      else if (state.pin && state.pin.hash && !isUnlocked()) { $("#main").innerHTML = ""; showLock(start); } else start(); })
    .catch(() => { render(); });
})();
</script>
