<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="theme-fonts" rel="stylesheet">
<script>
  // Thema van dit toestel meteen zetten (anders flitst eerst het standaardthema)
  (function () { let t = {}; try { t = JSON.parse(localStorage.getItem("budgetplanner.v1.theme") || "{}"); } catch (e) {}
    const ok = ["cyberpunk", "synthwave", "matrix", "oceaan", "prestige"];
    document.documentElement.dataset.theme = ok.includes(t.t) ? t.t : "cyberpunk";
    document.documentElement.dataset.mode = t.m === "light" ? "light" : "dark";
    // lettertypes van het gekozen thema (de andere worden pas geladen als je het themavenster opent)
    window.THEME_FONTS = {
      cyberpunk: "https://fonts.googleapis.com/css2?family=Zen+Dots&family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap",
      synthwave: "https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap",
      matrix: "https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap",
      oceaan: "https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap",
      prestige: "https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" };
    document.getElementById("theme-fonts").href = window.THEME_FONTS[document.documentElement.dataset.theme]; })();
  // Het manifest ("typeplaatje" voor installeren) alleen laden als de app via een webadres draait;
  // als los bestand (file://) geeft de browser er anders een foutmelding op.
  if (/^https?:$/.test(location.protocol)) { const l = document.createElement("link"); l.rel = "manifest"; l.href = "manifest.webmanifest"; document.head.appendChild(l); }
</script>

  --case-title: uppercase; --case-ui: uppercase; --title-spacing: .06em;
  --glow: 1; --corner: .8;

}

.theme-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0 4px; }

.theme-tile .tt-card { background: var(--surface); border: 1px solid var(--line); padding: 8px 10px; }
.theme-tile .tt-name { font-family: var(--font-display); font-size: 12px; letter-spacing: .1em; text-transform: var(--case-ui); color: var(--accent); }
.theme-tile .tt-amt { font-family: var(--font-mono); font-size: 15px; color: var(--pos); }
.theme-tile .tt-dots { display: flex; gap: 5px; } .theme-tile .tt-dots i { width: 14px; height: 6px; display: block; }
.theme-tile[aria-pressed="true"] { outline: 2px solid var(--magenta); outline-offset: -2px; box-shadow: 0 0 14px rgba(var(--magenta-rgb), .45); }
.theme-tile:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

[data-theme="oceaan"] {
  --font-figure: var(--font-display);
  --font-display: "Quicksand", "Segoe UI", system-ui, sans-serif; --font-body: "Nunito", "Segoe UI", system-ui, sans-serif; --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --font-hero: var(--font-display); --notch: none; --notch-sm: none;
  --r-card: 18px; --r-btn: 12px; --r-field: 10px; --r-pill: 999px; --r-bar: 999px; --r-sm: 8px;
  --case-title: none; --case-ui: none; --title-spacing: 0; --corner: 0; --hero-size: 30px; --body-size: 15px; --body-weight: 400;
}
[data-theme="prestige"] {
  --font-display: "Montserrat", "Segoe UI", system-ui, sans-serif; --font-body: "Inter", "Segoe UI", system-ui, sans-serif; --font-mono: "DM Mono", ui-monospace, monospace;
  --font-hero: "Playfair Display", Georgia, serif; --font-figure: "Playfair Display", Georgia, serif; --notch: none; --notch-sm: none;
  --r-card: 6px; --r-btn: 4px; --r-field: 4px; --r-pill: 999px; --r-bar: 999px; --r-sm: 3px;
  --case-title: uppercase; --case-ui: uppercase; --title-spacing: .14em; --corner: 0; --hero-size: 34px; --body-size: 14.5px; --body-weight: 400;
  /* relief: een fijne lichtrand bovenaan (alsof het licht van boven komt) + een zachte slagschaduw eronder */
  --relief: inset 0 1px 0 rgba(var(--hi-rgb), .06), 0 1px 1px rgba(var(--shade-rgb), .55), 0 20px 40px -24px rgba(var(--shade-rgb), .95);
  --relief-sm: inset 0 1px 0 rgba(var(--hi-rgb), .07), 0 1px 2px rgba(var(--shade-rgb), .55);
  --sunken: inset 0 1px 3px rgba(var(--shade-rgb), .55);
}
[data-theme="prestige"][data-mode="light"] {
  --relief: inset 0 1px 0 rgba(var(--hi-rgb), 1), 0 1px 2px rgba(var(--shade-rgb), .07), 0 20px 40px -26px rgba(var(--shade-rgb), .30);
  --relief-sm: inset 0 1px 0 rgba(var(--hi-rgb), 1), 0 1px 2px rgba(var(--shade-rgb), .10);
  --sunken: inset 0 1px 3px rgba(var(--shade-rgb), .10);
}
/* Synthwave: zonsondergang in de titel, zon aan de horizon, roze randjes */
[data-theme="synthwave"] body { background:
    radial-gradient(900px 340px at 50% 104%, rgba(var(--accent-rgb), .22), transparent 70%),
    radial-gradient(1400px 520px at 50% 110%, rgba(var(--magenta-rgb), .20), transparent 72%),
    linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0 / 100% 34px,
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0 / 34px 100%, var(--bg); background-attachment: fixed; }
[data-theme="synthwave"] .page-head h1 { background: linear-gradient(180deg, var(--gold) 15%, var(--accent) 55%, var(--magenta) 95%); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 0 10px rgba(var(--magenta-rgb), calc(.45 * var(--glow)))); }
[data-theme="synthwave"] .page-head h1::after { height: 4px; border-radius: 999px; background: linear-gradient(90deg, var(--gold), var(--accent), var(--magenta)); }
[data-theme="synthwave"] .card, [data-theme="synthwave"] .kpi { border-color: rgba(var(--magenta-rgb), .28); box-shadow: 0 10px 32px rgba(var(--magenta-rgb), calc(.10 * var(--glow))); }
[data-theme="synthwave"] .card h2 { color: var(--magenta); }
[data-theme="synthwave"] .card, [data-theme="synthwave"] .kpi { background: rgba(var(--panel-rgb), .84); }
/* Matrix: terminal. Titel als opdrachtregel met cursor, alles monospace, compacter */
[data-theme="matrix"] .page-head h1 { line-height: 1; }
[data-theme="matrix"] .page-head h1::before { content: "> "; color: var(--muted); }
[data-theme="matrix"] .page-head h1::after { content: "_"; display: inline-block; width: auto; height: auto; margin: 0 0 0 6px; background: none; box-shadow: none; color: var(--accent); }
[data-theme="matrix"] .card h2::before { content: "// "; color: var(--muted); }
[data-theme="matrix"] .card, [data-theme="matrix"] .kpi { border-color: rgba(var(--accent-rgb), .22); }
[data-theme="matrix"] main { gap: 14px; } [data-theme="matrix"] .card { padding: 16px; } [data-theme="matrix"] .kpi { padding: 12px 14px; }
[data-theme="matrix"] .kpi .value { font-family: var(--font-mono); }
[data-theme="matrix"] .kpi .chip { font-size: 10px; letter-spacing: 0; white-space: normal; }
/* Oceaan: zacht en rond, luchtig, rustige schaduwen in plaats van neon */
[data-theme="oceaan"] .card, [data-theme="oceaan"] .kpi { background: rgba(var(--panel-rgb), .80); box-shadow: 0 8px 30px rgba(var(--shade-rgb), .22); }
[data-theme="oceaan"][data-mode="light"] .card, [data-theme="oceaan"][data-mode="light"] .kpi { box-shadow: 0 6px 24px rgba(var(--ink-rgb), .07); }
[data-theme="oceaan"] .page-head h1 { font-weight: 700; }
[data-theme="oceaan"] .page-head h1::after { height: 4px; border-radius: 999px; width: 48px; }
[data-theme="oceaan"] .card h2, [data-theme="oceaan"] .kpi .label { font-size: 13.5px; letter-spacing: .01em; }
[data-theme="oceaan"] th { letter-spacing: .02em; font-size: 12px; }
[data-theme="oceaan"] main { gap: 24px; } [data-theme="oceaan"] .card { padding: 24px; }
[data-theme="oceaan"] .kpi::before { border-radius: 999px; }
/* Prestige: strak, rustig, relief i.p.v. gloed. Titels in Playfair, labels in Montserrat met ruime letterafstand */
[data-theme="prestige"] body { background: radial-gradient(1200px 520px at 50% -12%, rgba(var(--accent-rgb), .08), transparent 70%), var(--bg); background-attachment: fixed; letter-spacing: 0; }
[data-theme="prestige"] .page-head h1 { text-transform: none; letter-spacing: .005em; font-weight: 600; text-shadow: none; }
[data-theme="prestige"] .page-head h1::after { width: 56px; height: 1px; margin-top: 12px; background: linear-gradient(90deg, var(--accent), transparent); box-shadow: none; }
[data-theme="prestige"] header { background: rgba(var(--panel-rgb), .94); border-bottom: 1px solid var(--line); box-shadow: 0 10px 30px -22px rgba(var(--shade-rgb), .9); }
[data-theme="prestige"] .brand-mark, [data-theme="prestige"] .sp-logo { background: linear-gradient(150deg, var(--gold), var(--accent) 45%, var(--gold-dark)); color: var(--on-accent); box-shadow: inset 0 1px 0 rgba(var(--hi-rgb), .45), 0 2px 6px rgba(var(--shade-rgb), .5); }
[data-theme="prestige"][data-mode="light"] .brand-mark, [data-theme="prestige"][data-mode="light"] .sp-logo { background: linear-gradient(150deg, var(--ink), var(--magenta)); color: var(--gold); }
[data-theme="prestige"] nav a { font-weight: 500; letter-spacing: .14em; font-size: 11.5px; }
[data-theme="prestige"] nav a[aria-current="page"] { text-shadow: none; }
[data-theme="prestige"] .card, [data-theme="prestige"] .kpi, [data-theme="prestige"] .drop { border-color: var(--line); box-shadow: var(--relief); }
[data-theme="prestige"] .card h2, [data-theme="prestige"] .kpi .label { font-weight: 600; font-size: 11px; letter-spacing: .18em; }
[data-theme="prestige"] .card h2 { color: var(--ink); }
[data-theme="prestige"] .card h2::before { content: ""; display: inline-block; width: 14px; height: 1px; margin-right: 10px; vertical-align: middle; background: var(--accent); }
[data-theme="prestige"] .kpi::before { width: 2px; box-shadow: none; }
[data-theme="prestige"] .kpi .value, [data-theme="prestige"] .loan-big, [data-theme="prestige"] .gw-amt { font-weight: 600; letter-spacing: 0; text-shadow: none !important; }
[data-theme="prestige"] { font-variant-numeric: lining-nums; }   /* Playfair: cijfers even hoog (geen "oude" cijfers) */
[data-theme="prestige"] .kpi .value { font-size: 29px; }
[data-theme="prestige"] .chip { letter-spacing: .06em; font-size: 10px; font-weight: 600; }
[data-theme="prestige"] .btn { background: linear-gradient(180deg, rgba(var(--hi-rgb), .045), rgba(var(--hi-rgb), 0)), var(--surface); border-color: var(--line); color: var(--ink); box-shadow: var(--relief-sm); letter-spacing: .12em; font-weight: 500; font-size: 11.5px; transition: box-shadow .15s ease, border-color .15s ease, transform .08s ease; }
[data-theme="prestige"] .btn:hover { border-color: rgba(var(--accent-rgb), .7); color: var(--accent); box-shadow: var(--relief-sm), 0 6px 14px -8px rgba(var(--shade-rgb), .7); }
[data-theme="prestige"] .btn:active { transform: translateY(1px); box-shadow: var(--sunken); }
[data-theme="prestige"] .btn.primary { background: linear-gradient(180deg, var(--gold), var(--accent) 55%, var(--gold-dark)); border-color: var(--gold-dark); color: var(--on-accent); box-shadow: inset 0 1px 0 rgba(var(--hi-rgb), .35), 0 2px 6px rgba(var(--shade-rgb), .45), 0 10px 20px -12px rgba(var(--accent-rgb), .7); }
[data-theme="prestige"][data-mode="light"] .btn.primary { background: linear-gradient(180deg, rgba(var(--hi-rgb), .14), rgba(var(--hi-rgb), 0) 60%), var(--magenta); border-color: var(--magenta); color: var(--on-accent); box-shadow: inset 0 1px 0 rgba(var(--hi-rgb), .18), 0 2px 6px rgba(var(--shade-rgb), .25); }
[data-theme="prestige"] .btn.primary:hover { filter: brightness(1.06); color: var(--on-accent); }
[data-theme="prestige"] .btn.ghost { background: transparent; border-color: transparent; box-shadow: none; }
[data-theme="prestige"] :is(.input, select.cat, input.cell, .month, .seg) { box-shadow: var(--sunken); }
[data-theme="prestige"] .input:focus, [data-theme="prestige"] select.cat:focus, [data-theme="prestige"] input.cell:focus { box-shadow: var(--sunken), 0 0 0 1px var(--accent); }
[data-theme="prestige"] .seg button[aria-pressed="true"] { background: linear-gradient(180deg, rgba(var(--accent-rgb), .20), rgba(var(--accent-rgb), .08)); text-shadow: none; box-shadow: inset 0 1px 0 rgba(var(--hi-rgb), .06); }
[data-theme="prestige"] th { font-weight: 600; letter-spacing: .16em; font-size: 10px; border-bottom-color: var(--line); }
[data-theme="prestige"] :is(.track, .gauge, .debt-bar) { box-shadow: var(--sunken); }
[data-theme="prestige"] :is(.fill, .gauge span, .debt-bar .owed, .debt-bar .free) { box-shadow: inset 0 1px 0 rgba(var(--hi-rgb), .25) !important; }
[data-theme="prestige"] .chart path[stroke] { filter: none !important; }
[data-theme="prestige"] .chart path[fill^="var"], [data-theme="prestige"] .chart rect[fill^="var"] { filter: drop-shadow(0 1px 1px rgba(var(--shade-rgb), .5)); }
[data-theme="prestige"] :is(.tooltip, #tut-tip) { background: rgba(var(--panel-rgb), .98); border-color: rgba(var(--accent-rgb), .55); box-shadow: inset 0 1px 0 rgba(var(--hi-rgb), .06), 0 18px 40px -14px rgba(var(--shade-rgb), .8); }
[data-theme="prestige"] #tut-tip .tt { font-family: var(--font-hero); text-transform: none; letter-spacing: .01em; font-size: 15px; }
[data-theme="prestige"] dialog { border-color: rgba(var(--accent-rgb), .35); border-radius: var(--r-card); box-shadow: inset 0 1px 0 rgba(var(--hi-rgb), .06), 0 40px 90px -30px rgba(var(--shade-rgb), .9); }
[data-theme="prestige"] dialog h3 { font-family: var(--font-hero); text-transform: none; letter-spacing: .01em; font-size: 22px; font-weight: 600; }
[data-theme="prestige"] .notice { box-shadow: var(--relief-sm); }
[data-theme="prestige"] .toast { box-shadow: 0 18px 40px -12px rgba(var(--shade-rgb), .8); }
[data-theme="prestige"] #spot { border-width: 1px; box-shadow: 0 0 0 4px rgba(var(--accent-rgb), .15), 0 10px 30px -10px rgba(var(--shade-rgb), .8); }
[data-theme="prestige"] ::selection { background: var(--accent); color: var(--on-accent); }
/* afgeleide tokens opnieuw uitrekenen op elk element met een thema (ook de voorbeeldtegels in het themavenster) */
[data-theme] { --accent-soft: rgba(var(--accent-rgb), .10); --pos-soft: rgba(var(--pos-rgb), .12); --neg-soft: rgba(var(--neg-rgb), .14); --warn-soft: rgba(var(--warn-rgb), .12);
  --shadow: 0 0 0 1px rgba(var(--accent-rgb), .04), 0 0 28px rgba(var(--accent-rgb), .05); }
/* lichte varianten: geen wazige gloed rond tekst (leest slecht op een lichte ondergrond) */
[data-mode="light"] body, [data-mode="light"] body * { text-shadow: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
button, input, select { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.pos { color: var(--pos); } .neg { color: var(--neg); }
.muted { color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* kopbalk */
header { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.bar { max-width: 1180px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 18px; min-height: 60px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; color: var(--surface); font-size: 13px; font-weight: 700; }
nav { display: flex; gap: 2px; flex: 1; overflow-x: auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav a { padding: 19px 9px 17px; color: var(--muted); text-decoration: none; font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
nav a:hover { color: var(--ink); }
nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.actions { display: flex; gap: 8px; align-items: center; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; line-height: 1.3; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--bar-track); }
.btn.small { padding: 4px 9px; font-size: 13px; }
.btn.danger { color: var(--neg); }
.menu { position: relative; }
.menu-list { position: absolute; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--menu-shadow); min-width: 250px; padding: 6px; display: none; }
.menu.open .menu-list { display: block; }
.menu-list button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 6px; cursor: pointer; }
.menu-list button:hover { background: var(--bar-track); }
.menu-list small { display: block; color: var(--muted); font-size: 12px; }

main { max-width: 1180px; margin: 0 auto; padding: 24px; display: grid; gap: 20px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head h1 { font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
.page-head p { margin: 2px 0 0; color: var(--muted); }

.month { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.month button { border: 0; background: none; padding: 7px 11px; cursor: pointer; color: var(--muted); }
.month button:hover { color: var(--ink); }
.month span { min-width: 128px; text-align: center; font-weight: 600; text-transform: capitalize; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 20px; min-width: 0; }
.card h2 { font-size: 15px; font-weight: 600; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.card-head .hint { color: var(--muted); font-size: 12.5px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--k, var(--line)); }
.kpi .label { color: var(--muted); font-size: 12.5px; font-weight: 500; }
.kpi .value { font-family: var(--font-figure); font-size: 26px; font-weight: 600; letter-spacing: -.02em; margin-top: 4px; }
.kpi .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

.grid-2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: 20px; align-items: start; }
.stack { display: grid; gap: 20px; }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; border-radius: 999px; padding: 2px 9px; background: var(--bar-track); color: var(--muted); white-space: nowrap; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.pos { background: var(--pos-soft); color: var(--pos); }
.chip.neg { background: var(--neg-soft); color: var(--neg); }
.chip button { border: 0; background: none; padding: 0; color: inherit; cursor: pointer; text-decoration: underline; font-weight: 600; }

/* categoriebalken */
.cats { display: grid; gap: 4px; }
.cat-row { display: grid; grid-template-columns: 150px 1fr 96px; gap: 12px; align-items: center; padding: 5px 4px; border-radius: 6px; cursor: default; }
.cat-row:hover { background: var(--bg); }
.cat-row .name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { position: relative; height: 12px; background: var(--bar-track); border-radius: 4px; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--bar); }
.fill.over { background: var(--neg); }
.budget-tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }
.cat-row .amt { text-align: right; font-size: 13px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.tick { width: 2px; height: 12px; background: var(--ink); border-radius: 1px; vertical-align: -2px; }

.chart .hit:hover { fill: var(--bar-track); opacity: .6; }

.tooltip { position: fixed; pointer-events: none; background: var(--ink); color: var(--surface); padding: 8px 10px; border-radius: 8px; font-size: 12.5px; line-height: 1.45; z-index: 20; display: none; box-shadow: 0 6px 18px rgba(var(--shade-rgb), .18); max-width: 260px; }
.tooltip b { font-weight: 600; }

/* doelen */
.goals { display: grid; gap: 16px; }
.goal .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.goal .top b { font-weight: 600; }
.goal .track { height: 8px; margin: 7px 0 4px; }
.goal .fill { background: var(--pos); }
.goal .meta { font-size: 12px; color: var(--muted); }

/* tabellen */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
th.r, td.r { text-align: right; }
tbody tr:hover td { background: var(--bg); }
td.desc { max-width: 420px; }
td.desc .d { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td.desc .raw { font-size: 12px; color: var(--muted); white-space: normal; margin-top: 4px; display: none; }
tr.open td.desc .raw { display: block; }
td.desc .d { cursor: pointer; }
.amount { font-weight: 600; }
select.cat, input.cell { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 4px 6px; max-width: 190px; }
select.cat:hover, input.cell:hover, select.cat:focus, input.cell:focus { border-color: var(--line); background: var(--surface); }
select.cat.uncat { color: var(--warn); background: var(--warn-soft); font-weight: 500; }
input.cell { width: 120px; }
input.cell.wide { width: 220px; }
input.cell.r { text-align: right; }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.input { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.input.search { width: 260px; max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 7px 11px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.totals { margin-left: auto; font-size: 13px; color: var(--muted); }

/* lege staat / dropzone */
.drop { border: 1.5px dashed var(--line); border-radius: 12px; padding: 36px 24px; text-align: center; background: var(--surface); transition: border-color .15s, background .15s; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop h2 { font-size: 20px; margin-bottom: 6px; }
.drop p { color: var(--muted); margin: 0 auto 16px; max-width: 520px; }
body.dragging::after { content: "Laat los om je CSV te importeren"; position: fixed; inset: 12px; border: 2px dashed var(--accent); border-radius: 16px; background: color-mix(in srgb, var(--accent-soft) 88%, transparent); display: grid; place-items: center; font: 600 18px var(--font-display); color: var(--accent); z-index: 50; }

.notice { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 10px; font-size: 13px; flex-wrap: wrap; }
.notice.warn { background: var(--warn-soft); color: var(--warn); }

.flow-line::after { content: ""; position: absolute; right: 0; bottom: -2px; width: 12px; height: 10px; background: var(--c2); clip-path: polygon(0 0, 100% 50%, 0 100%); }

/* ================= ANIMATIES (stap 6c) =================

@keyframes fx-in { from { opacity: 0; transform: translateY(8px); } }

.card, .kpi, .btn, .theme-tile { transition: box-shadow .2s ease, border-color .2s ease, background-color .2s ease, color .2s ease; }
.kpi:hover { border-color: rgba(var(--accent-rgb), .45); }

/* Cyberpunk: korte glitch op de titel */

[data-theme="oceaan"] :is(#fx, .sp-fx)::after { right: -26vmax; bottom: -30vmax; background: radial-gradient(circle, rgba(var(--magenta-rgb), .26), transparent 62%); animation: fx-tide 12s ease-in-out infinite alternate-reverse; }

  mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 150' preserveAspectRatio='none'><path d='M0 60 C100 20 200 20 300 60 S500 100 600 60 S750 20 800 60 V150 H0Z'/></svg>");

[data-theme="oceaan"] :is(#fx, .sp-fx) > i:nth-of-type(1) { background: linear-gradient(to top, rgba(var(--accent-rgb), .30), rgba(var(--accent-rgb), .12)); animation: fx-wave 14s linear infinite; }
[data-theme="oceaan"] :is(#fx, .sp-fx) > i:nth-of-type(2) { height: 110px; background: linear-gradient(to top, rgba(var(--magenta-rgb), .26), rgba(var(--magenta-rgb), .08)); animation: fx-wave 9s linear infinite reverse; }

.sp-bar i { display: block; height: 100%; background: var(--accent); box-shadow: 0 0 10px var(--accent); transform-origin: left; animation: sp-load 1.9s cubic-bezier(.6, 0, .3, 1) 1.6s both; }

/* Cyberpunk: scanlijnen, een lichtbalk die over het scherm schuift, glitch op titel en logo */

@keyframes sp-flick { 0%, 100% { opacity: 1; } 8% { opacity: .35; } 11% { opacity: 1; } 54% { opacity: .5; } 57% { opacity: 1; } }
/* Synthwave en Oceaan: de zon / de golven komen van onder op */

<script>
(function () {
  "use strict";
  const KEY = "budgetplanner.v1";
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = new Intl.NumberFormat("nl-BE", { style: "currency", currency: "EUR" });
  const fmt0 = new Intl.NumberFormat("nl-BE", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
  const eur = n => fmt.format(n || 0);
  const eur0 = n => fmt0.format(n || 0);
  const eurS = n => Math.abs(n || 0) < 100 && Math.round((n || 0) * 100) % 100 !== 0 ? fmt.format(n || 0) : fmt0.format(n || 0);
  const signed = n => (n > 0 ? "+" : n < 0 ? "−" : "") + fmt.format(Math.abs(n || 0));
  const monthName = ym => { const [y, m] = ym.split("-"); return new Date(+y, +m - 1, 1).toLocaleDateString("nl-BE", { month: "long", year: "numeric" }); };
  const monthShort = ym => { const [y, m] = ym.split("-"); return new Date(+y, +m - 1, 1).toLocaleDateString("nl-BE", { month: "short" }).replace(".", ""); };
  const shiftMonth = (ym, d) => { const [y, m] = ym.split("-").map(Number); const t = new Date(y, m - 1 + d, 1); return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0"); };
  const fmtDate = d => { const [y, m, dd] = d.split("-"); return `${dd}/${m}/${y}`; };
  const todayYm = () => { const t = new Date(); return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0"); };

  /* ---------- opslag: IndexedDB (groot), met localStorage als reserve ---------- */
  let storageOk = true, storageFull = false, backend = "idb", dbp = null;
  function hydrate(obj) {
    const st = Object.assign(newState(), obj || {});
    if (!st.credits) st.credits = []; if (!st.loans) st.loans = []; if (!st.balances) st.balances = [];
    if (!st.accounts) st.accounts = {};
    savConf(st); ensureGoalRefs(st);
    if (!st.splitRules) st.splitRules = [];
    if (!st.plans) st.plans = []; if (!st.ignoredRecurring) st.ignoredRecurring = []; if (!st.ignoredPrice) st.ignoredPrice = [];

  /* ---------- versleuteling met de pincode (stap 13e) ----------
     Met een pincode staat de state versleuteld in de browser: AES-GCM 256 bit, sleutel afgeleid van de pincode met
     PBKDF2-SHA-256 (600.000 rondes, eigen willekeurig zout). De sleutel bestaat enkel in het geheugen zolang de app open is.
     Pincode vergeten = gegevens onleesbaar; de back-ups (exporteren, OneDrive, gsm-samenvatting) blijven bewust zonder code. */
  const KDF_ITER = 600000;
  let cryptoKey = null, cryptoSalt = null, lockedEnv = null;   // lockedEnv = versleutelde opslag die nog geopend moet worden
  function toB64(buf) { const u = new Uint8Array(buf); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }

  async function deriveKey(pin, salt, iter) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter || KDF_ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  }

  function disableCrypto() { cryptoKey = null; cryptoSalt = null; }

    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, cryptoKey, new TextEncoder().encode(json));
    return JSON.stringify({ enc: "aes-gcm", v: 1, iter: KDF_ITER, salt: toB64(cryptoSalt), iv: toB64(iv), data: toB64(ct) });
  }

  async function decryptEnvelope(env, pin) {
    const salt = fromB64(env.salt), key = await deriveKey(pin, salt, env.iter);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(env.iv) }, key, fromB64(env.data));
    cryptoKey = key; cryptoSalt = salt; return JSON.parse(new TextDecoder().decode(pt));
  }
  const storedText = async () => cryptoKey ? encryptState(JSON.stringify(state)) : JSON.stringify(state);

  async function loadState() {
    let fromLs = null;
    try { const raw = localStorage.getItem(KEY); if (raw) fromLs = JSON.parse(raw); } catch (e) {}
    if (isEnvelope(fromLs)) { backend = "ls"; lockedEnv = fromLs; return newState(); }
    try {
      const v = await idbGet("state");
      if (v) {
        const parsed = typeof v === "string" ? JSON.parse(v) : v;
        if (isEnvelope(parsed)) { lockedEnv = parsed; return newState(); }
        const st = hydrate(parsed);
        // gegevens die een oudere versie van de planner nog in de kleine opslag zette: samenvoegen
        if (fromLs && Array.isArray(fromLs.transactions)) {
          const seen = new Set(st.transactions.map(t => txKey(t) || t.id)); let n = 0;
          for (const t of fromLs.transactions) { const k = txKey(t) || t.id; if (!seen.has(k)) { st.transactions.push(t); seen.add(k); n++; } }
          if (n) { sortTx(st); await idbPut("state", JSON.stringify(st)); setTimeout(() => toast(`${n} transacties uit een oudere opslag teruggezet`), 600); }
          try { localStorage.removeItem(KEY); } catch (e) {}
        }
        return st;
      }
      if (fromLs) { await idbPut("state", JSON.stringify(fromLs)); try { localStorage.removeItem(KEY); } catch (e) {} }   // eenmalig overzetten
      return hydrate(fromLs);
    } catch (e) {
      backend = "ls";
      if (fromLs) return hydrate(fromLs);
      try { localStorage.setItem(KEY + ".test", "1"); localStorage.removeItem(KEY + ".test"); } catch (e2) { storageOk = false; }

      <p class="muted" style="font-size:12.5px;margin:6px 0 0">Met de demo-pincode opent de app <b>verzonnen gegevens</b> (DEMO-MODE). Wat je dan doet, wordt nergens bewaard. Moet verschillen van je echte pincode.</p>
      <p id="pin-err" class="neg" style="margin:8px 0 0;font-size:12.5px"></p>
      <div class="row">${has ? `<button class="btn danger" id="pin-off" type="button">Pincode uitschakelen</button>` : ""}${dp ? `<button class="btn" id="pin-demo-off" type="button">Demo-pincode wissen</button>` : ""}<button class="btn" data-close type="button">Annuleren</button><button class="btn primary" id="pin-ok" type="button">Opslaan</button></div>`, d => {
      const g = q => d.querySelector(q), err = g("#pin-err");
      const oldOk = async () => !has || await sha(state.pin.salt + g("#pin-old").value) === state.pin.hash;
      const demoHash = async v => { const salt = crypto.getRandomValues(new Uint8Array(8)).reduce((a, x) => a + x.toString(16).padStart(2, "0"), ""); return { salt, hash: await sha(salt + v) }; };
      const off = g("#pin-off"); if (off) off.addEventListener("click", async () => {
        if (!await oldOk()) { err.textContent = "Huidige pincode klopt niet."; return; }
        state.pin = null; disableCrypto(); setDemoPin(null); save(); d.close(); toast("Pincode uitgeschakeld · gegevens niet meer versleuteld"); });
      const doff = g("#pin-demo-off"); if (doff) doff.addEventListener("click", async () => {
        if (!await oldOk()) { err.textContent = "Huidige pincode klopt niet."; return; }
        setDemoPin(null); d.close(); toast("Demo-pincode gewist"); });
      g("#pin-ok").addEventListener("click", async () => {
        const nw = g("#pin-new").value.trim(), dm = g("#pin-demo").value.trim();
        if (!await oldOk()) { err.textContent = "Huidige pincode klopt niet."; return; }
        if (!has && !nw) { err.textContent = "Vul een pincode in."; return; }
        if (nw && !/^\d{4,8}$/.test(nw)) { err.textContent = "Gebruik 4 tot 8 cijfers."; return; }
        if (dm && !/^\d{4,8}$/.test(dm)) { err.textContent = "Demo-pincode: gebruik 4 tot 8 cijfers."; return; }
        const real = nw || (has ? g("#pin-old").value : "");
        if (dm && dm === real) { err.textContent = "De demo-pincode moet verschillen van je echte pincode."; return; }
        if (nw && !dm && dp && await sha(dp.salt + nw) === dp.hash) { err.textContent = "Je nieuwe pincode is gelijk aan de demo-pincode."; return; }
        if (!nw && !dm) { d.close(); return; }
        const ok = g("#pin-ok"); ok.disabled = true; ok.textContent = "Bezig…";
        if (nw) { const salt = Math.random().toString(36).slice(2); state.pin = { salt, hash: await sha(salt + nw) }; await enableCrypto(nw); setUnlocked(); save(); }
        if (dm) setDemoPin(await demoHash(dm));
        d.close(); toast(nw ? "Pincode ingesteld · je gegevens zijn versleuteld" + (dm ? " · demo-pincode ingesteld" : "") : "Demo-pincode ingesteld");
      });
    });
  }

  /* ---------- views ---------- */
  function monthSwitch() {
    return `<div class="month" role="group" aria-label="Maand kiezen"><button type="button" data-act="prev-month" aria-label="Vorige maand">‹</button><span>${esc(monthName(ui.month))}</span><button type="button" data-act="next-month" aria-label="Volgende maand">›</button></div>`;
  }
  function notices() {
    let h = "";
    const oc = multiAcc() ? ownConflicts(state) : [];
    if (oc.length) h += `<div class="notice warn"><span>⇄ ${oc.length} overboeking${oc.length === 1 ? "" : "en"} tussen je eigen rekeningen ${oc.length === 1 ? "heeft" : "hebben"} een gewone categorie (bv. ${esc(oc[0].cat)}). Zo tellen ze dubbel: als uitgave op de ene rekening én via de echte uitgaven op de andere.</span><button class="btn small" data-act="own-fix" type="button">Omzetten naar overboeking</button></div>`;
    if (!storageOk) h += `<div class="notice warn"><span>${storageFull ? "De opslag van je browser is vol: je laatste wijzigingen zijn niet bewaard. Exporteer meteen een back-up en maak wat ruimte vrij op je schijf." : "Deze browser laat geen opslag toe op deze pagina. Je wijzigingen verdwijnen bij het sluiten: exporteer een back-up."}</span><button class="btn small" data-act="export-json" type="button">Back-up exporteren</button></div>`;
    else if (state.folder && state.folder.enabled && ui.folderAsk) h += `<div class="notice info"><span>☁ De browser vraagt opnieuw toestemming voor je OneDrive-map. Klik om de automatische back-up te hervatten.</span><button class="btn small primary" data-act="folder-resume" type="button">Hervatten</button></div>`;
    else if (state.folder && state.folder.enabled && state.folder.error) h += `<div class="notice warn"><span>☁ ${esc(state.folder.error)}</span><button class="btn small" data-act="folder-open" type="button">OneDrive-back-up</button></div>`;
    else if (state.transactions.length && !(state.folder && state.folder.enabled)) {
      const days = state.lastBackup ? Math.floor((Date.now() - new Date(state.lastBackup)) / 864e5) : null;
      if (days === null || days >= 14) h += `<div class="notice info"><span>${days === null ? "Je hebt nog geen back-up gemaakt." : `Je laatste back-up is ${days} dagen oud.`} Je gegevens staan enkel in deze browser.</span><span style="display:flex;gap:8px">${canFolder() ? `<button class="btn small" data-act="folder-open" type="button">☁ Automatisch naar OneDrive</button>` : ""}<button class="btn small" data-act="export-json" type="button">Back-up exporteren</button></span></div>`;
    }
    return h;
  }
  function emptyState() {
    return `<section class="drop" id="drop">
      <h2>Begin met je bankafschrift</h2>
      <p>Download je transacties als CSV in je bankapp (bij ING: Home'Bank of de ING-app) en sleep het bestand hierheen. Een andere bank? Dan vraagt de app één keer welke kolom wat is. Bestanden die overlappen, geven geen dubbels.</p>
      <button class="btn primary" data-act="pick-csv" type="button">CSV-bestand kiezen</button>
      <p class="muted" style="margin:14px auto 0;font-size:12.5px">Gebruikte je de Budgetplanner al op claude.ai, of heb je een back-up? Exporteer daar via <b>Back-up → Back-up exporteren</b> en zet het bestand hier terug: <button class="btn small ghost" data-act="import-json" type="button">Back-up terugzetten</button></p>
    </section>`;
  }

  function periodSeg() {
    return `<div class="seg" role="group" aria-label="Periode"><button type="button" data-act="period-month" aria-pressed="${ui.period === "maand"}">Maand</button><button type="button" data-act="period-year" aria-pressed="${ui.period === "jaar"}">Jaar</button></div>`;
  }
  function viewOverview() {
    if (state.transactions.length && ui.period === "jaar") return viewYear();
    if (!state.transactions.length) return `<div class="page-head"><div><h1>Overzicht</h1><p>Inkomsten, uitgaven en spaardoelen per maand</p></div></div>${notices()}${emptyState()}`;
    const s = monthSummary(state, ui.month);
    const budget = t => mainCats(state).filter(c => c.type === t).reduce((a, c) => a + monthlyBudget(c), 0);
    const bExp = budget("Vaste kosten") + budget("Variabele kosten");
    const rate = s.income > 0 ? Math.round(s.saved / s.income * 100) : null;
    const kpi = (label, value, color, sub) => `<div class="kpi" style="--k:${color}"><div class="label">${label}</div><div class="value num">${value}</div><div class="sub">${sub}</div></div>`;
    let h = `<div class="page-head"><div><h1>Overzicht</h1><p>${s.count} transacties in ${esc(monthName(ui.month))}</p></div><div class="actions"><button class="btn" data-act="close-open" type="button">📋 Maandafsluiting</button>${periodSeg()}${monthSwitch()}</div></div>${closeNotice()}${notices()}${priceNotice()}`;
    const dense = zichtList(state).length >= 4;   // 8+ kaders op één lijn: compacter
    h += `<section class="kpis${multiAcc() ? " acc-row" : ""}${dense ? " dense" : ""}">
      ${kpi("Inkomsten", `<span class="pos">${eur0(s.income)}</span>`, "var(--pos)", budget("Inkomen") ? "gepland " + eur0(budget("Inkomen")) : "&nbsp;")}
      ${kpi("Uitgaven", `<span class="neg">${eur0(s.expenses)}</span>`, "var(--neg)", bExp ? `${Math.round(s.expenses / bExp * 100)}% van budget ${eur0(bExp)}` : `vast ${eur0(s.fixed)} · variabel ${eur0(s.variable)}`)}
      ${(() => {
        if (!hasSavings(state)) return kpi("Gespaard", `<span class="gold">${eurS(s.saved)}</span>`, "var(--gold)", rate === null ? "deze maand" : `deze maand · ${rate}% van je inkomen`);
        const sm = savAll(state), m = sm.moves.filter(x => x.date.startsWith(ui.month) && x.src !== "transfer").reduce((a, x) => a + x.effect, 0);

      })()}
      ${kpi("Netto deze maand", `<span class="${s.net >= 0 ? "pos" : "neg"}">${s.net >= 0 ? "+" : "−"}${eur0(Math.abs(s.net))}</span>`, s.net >= 0 ? "var(--pos)" : "var(--neg)", s.uncatCount ? `<span class="chip warn">${s.uncatCount} te categoriseren · <button type="button" data-act="show-uncat">bekijken</button></span>` : `<span class="chip pos">alles gecategoriseerd</span>`)}
      ${multiAcc() ? accStats(ui.month).map(x => kpi(`<i class="acc-mini" style="--c:${x.color}"></i>${esc(x.name)}`,
          x.bal === null ? `<span class="muted">—</span>` : `<span class="${x.bal >= 0 ? "gold" : "neg"}">${x.bal < 0 ? "−" : ""}${(dense ? fmt0 : fmt).format(Math.abs(x.bal))}</span>`, x.color,
          x.bal === null ? (dense ? `<button class="linkbtn" data-act="goto-profile" type="button">startsaldo</button>` : `<button class="btn small" data-act="goto-profile" type="button">Startsaldo ingeven</button>`) : `op ${fmtDate(endOfMonth(ui.month))} · <button class="linkbtn" data-act="acc-open" data-acc="${esc(x.acc)}" type="button">transacties</button>`)).join("") : ""}
      ${multiAcc() ? "" : (() => { const b = balanceAt(state, ui.month);
        const lbl = multiAcc() ? "Saldo alle rekeningen" : "Saldo op rekening";
        return b.set ? kpi(lbl, `<span class="${b.total >= 0 ? "gold" : "neg"}">${b.total < 0 ? "−" : ""}${fmt.format(Math.abs(b.total))}</span>`, b.total >= 0 ? "var(--gold)" : "var(--neg)", `op ${fmtDate(endOfMonth(ui.month))}${b.per.some(p => p.before) ? " · teruggerekend" : ""}`)
          : kpi(lbl, `<span class="muted">—</span>`, "var(--line)", `<button class="btn small" data-act="goto-balance" type="button">Startsaldo ingeven</button>`); })()}
    </section>`;
    const uncatHtml = s.uncatCount ? uncatCard(ui.month) : "";
    h += goalsWide();
    h += `<div class="stack">${chartsCard()}${transferCard()}</div>`;
    h += `<div class="grid-2"><div class="stack"><section class="card" id="cat-card">${catChart(s)}</section>${groupCards(s)}${debtCard()}${uncatHtml}</div><div class="stack">${(state.plans.length || detectRecurring(state).length) ? soonCard(14, true) : ""}${carryCard()}</div></div>`;
    return h;
  }

  /* ---------- abonnementen en vaste betalingen (stap 13b) ---------- */
  const SUB_REVIEW = [["ok", "✓", "Nodig"], ["twijfel", "?", "Twijfel"], ["weg", "✕", "Opzeggen"]];
  function viewSubs() {
    const all = subscriptions(state, todayS()), act = all.filter(x => x.active && x.review !== "geen"), stopped = all.filter(x => !x.active && x.review !== "geen"), hidden = all.filter(x => x.review === "geen");
    const sum = (l, k) => l.reduce((a, x) => a + x[k], 0), dearer = act.filter(x => x.pct !== null && x.pct >= 3), cancel = act.filter(x => x.review === "weg"), doubt = act.filter(x => x.review === "twijfel");
    let h = `<div class="page-head"><div><h1>Abonnementen</h1><p>Alles wat regelmatig van je rekening gaat: abonnementen, verzekeringen, energie, huur… Herkend uit je transacties.</p></div><div class="actions"><button class="btn" data-act="goto-planner" type="button">← Planner</button></div></div>`;
    if (!all.length) return h + `<section class="card"><p class="muted" style="margin:0">Nog geen terugkerende betalingen gevonden. Daarvoor zijn minstens 3 betalingen aan dezelfde partij in een vast ritme nodig.</p></section>`;
    const kpi = (label, value, color, sub) => `<div class="kpi" style="--k:${color}"><div class="label">${label}</div><div class="value num">${value}</div><div class="sub">${sub}</div></div>`;
    h += `<section class="kpis">${kpi("Per maand", `<span class="neg">${eur0(sum(act, "perMonth"))}</span>`, "var(--neg)", `${act.length} actieve betaling${act.length === 1 ? "" : "en"}`)}
      ${kpi("Per jaar", `<span class="neg">${eur0(sum(act, "perYear"))}</span>`, "var(--neg)", `betaald laatste 12 maanden: ${eur0(sum(act, "paid12"))}`)}
      ${kpi("Duurder geworden", `<span class="${dearer.length ? "neg" : "muted"}">${dearer.length}</span>`, "var(--warn)", dearer.length ? `samen +${eur0(dearer.reduce((a, x) => a + (x.amount - x.was) * PER_YEAR[x.repeat], 0))} per jaar` : "t.o.v. een jaar geleden")}
      ${kpi("Mogelijke besparing", `<span class="${cancel.length ? "pos" : "muted"}">${eur0(sum(cancel, "perYear"))}</span>`, "var(--pos)", `per jaar, als je opzegt wat op ✕ staat${doubt.length ? ` · twijfel: ${eur0(sum(doubt, "perYear"))}` : ""}`)}</section>`;
    const evo = x => x.pct === null || Math.abs(x.pct) < 3 ? `<span class="muted">stabiel</span>` : `<span class="${x.pct > 0 ? "neg" : "pos"}" title="${esc(`${eur(x.was)} op ${fmtDate(x.wasDate)}`)}">${x.pct > 0 ? "▲ +" : "▼ "}${x.pct}%</span> <small class="muted">sinds ${esc(monthShort(x.wasDate.slice(0, 7)))} ${x.wasDate.slice(0, 4)}</small>`;
    const row = x => `<tr data-key="${esc(x.key)}" class="${x.review === "weg" ? "sub-cancel" : ""}"><td><b class="sub-name">${esc(x.title)}</b><div class="muted" style="font-size:12px">${esc(x.cat)}${multiAcc() ? ` · ${esc(accName(state, x.account))}` : ""}</div></td>
      <td class="muted">${REPEATS[x.repeat]}</td><td class="r num">${eur(x.amount)}</td><td class="r num"><b>${eur0(x.perYear)}</b></td><td>${evo(x)}</td><td class="muted num">${fmtDate(x.last)}</td>
      <td class="r" style="white-space:nowrap">${x.active ? `<span class="seg sub-seg" role="group" aria-label="Nog nodig?">${SUB_REVIEW.map(([v, ic, lbl]) => `<button type="button" data-act="sub-review" data-v="${v}" aria-pressed="${x.review === v}" title="${lbl}">${ic}</button>`).join("")}</span>` : ""}<button class="btn small ghost" data-act="sub-review" data-v="${x.review === "geen" ? "" : "geen"}" type="button" title="${x.review === "geen" ? "Terug in de lijst zetten" : "Geen abonnement: uit de lijst halen"}">${x.review === "geen" ? "↺" : "⊘"}</button></td></tr>`;
    const table = (list, empty) => list.length ? `<div class="table-wrap"><table><thead><tr><th>Betaling</th><th>Ritme</th><th class="r">Bedrag</th><th class="r">Per jaar</th><th>Evolutie</th><th>Laatst</th><th class="r">Nog nodig?</th></tr></thead><tbody>${list.map(row).join("")}</tbody></table></div>` : `<p class="muted" style="margin:0">${empty}</p>`;
    h += `<section class="card"><div class="card-head"><h2>Actief</h2><span class="hint">Duid aan wat je nog nodig hebt: ✓ nodig · ? twijfel · ✕ opzeggen. ⊘ = geen abonnement (uit de lijst).</span></div>${table(act, "Geen actieve terugkerende betalingen.")}</section>`;

    return h;
  }

  /* ---------- maandafsluiting (stap 13a) ---------- */
  const prevYm = () => shiftMonth(todayYm(), -1);
  // na afloop van een maand één keer een melding, tot je ze bekeken hebt (of "Later" klikt voor deze sessie)
  function closeNotice() {
    const pm = prevYm(); if (ui.closeLater || (state.closeSeen || "") >= pm || !monthSummary(state, pm).count) return "";
    return `<div class="notice info"><span>📋 De <b>maandafsluiting van ${esc(monthName(pm))}</b> staat klaar: wat ging er in en uit, wat viel op, hoeveel spaarde je.</span><span style="display:flex;gap:8px"><button class="btn small" data-act="close-later" type="button">Later</button><button class="btn small primary" data-act="close-open" data-ym="${pm}" type="button">Bekijken</button></span></div>`;
  }
  function viewClose() {
    const ym = ui.month, r = monthClose(state, ym);
    if ((state.closeSeen || "") < ym && ym <= prevYm()) { state.closeSeen = ym; save(); }
    const head = `<div class="page-head"><div><h1>Maandafsluiting</h1><p>${esc(monthName(ym))}${ym >= todayYm() ? " · deze maand is nog niet voorbij" : ""}</p></div><div class="actions"><button class="btn" data-act="goto-overview" type="button">← Overzicht</button>${monthSwitch()}</div></div>`;
    if (!r.count) return head + `<section class="card"><p class="muted" style="margin:0">Geen transacties in ${esc(monthName(ym))}.</p></section>`;
    // vergelijking: ▲/▼ met kleur volgens goed/slecht (meer uitgaven = slecht)
    const delta = (now, ref, goodUp) => { if (ref === null || ref === undefined) return ""; const d = Math.round(now - ref); if (Math.abs(d) < 1) return `<span class="muted">gelijk</span>`;
      const good = goodUp ? d > 0 : d < 0; return `<span class="${good ? "pos" : "neg"}">${d > 0 ? "▲" : "▼"} ${eur0(Math.abs(d))}</span>`; };
    const kpi = (label, k, color, goodUp, cls) => { const c = r.cmp[k];
      return `<div class="kpi" style="--k:${color}"><div class="label">${label}</div><div class="value num"><span class="${cls(c.now)}">${k === "net" ? (c.now >= 0 ? "+" : "−") : ""}${eur0(Math.abs(c.now))}</span></div>
        <div class="sub">${c.avg !== null ? `gem. ${eur0(c.avg)} ${delta(c.now, c.avg, goodUp)}` : "nog geen vergelijking"}${c.lastYear !== null ? `<br>vorig jaar ${eur0(c.lastYear)} ${delta(c.now, c.lastYear, goodUp)}` : ""}</div></div>`; };
    // één zin als samenvatting
    const n = r.cmp.net, more = n.avg !== null ? Math.round(n.now - n.avg) : null;
    const lead = `${n.now >= 0 ? `Je hield <b class="pos">${eur0(n.now)}</b> over` : `Je gaf <b class="neg">${eur0(-n.now)}</b> meer uit dan er binnenkwam`}${r.rate !== null && n.now > 0 ? ` (${r.rate}% van je inkomen)` : ""}.${more !== null && Math.abs(more) >= 10 ? ` Dat is ${eur0(Math.abs(more))} ${more > 0 ? "beter" : "minder goed"} dan je gemiddelde van de vorige ${r.prevMonths} maanden.` : ""}${r.over.length ? ` ${r.over.length} budget${r.over.length === 1 ? "" : "ten"} overschreden.` : r.prevMonths ? " Alle budgetten gerespecteerd." : ""}`;
    let h = head + `<section class="card close-lead"><p>${lead}</p></section>`;
    h += `<section class="kpis">${kpi("Inkomsten", "income", "var(--pos)", true, () => "pos")}${kpi("Uitgaven", "expenses", "var(--neg)", false, () => "neg")}${kpi("Gespaard", "saved", "var(--gold)", true, () => "gold")}${kpi("Overgehouden", "net", "var(--gold)", true, v => v >= 0 ? "pos" : "neg")}</section>`;
    const topCard = `<section class="card"><div class="card-head"><h2>Grootste uitgaven</h2></div><div class="table-wrap"><table><tbody>${r.top.map(t => `<tr><td class="muted num" style="width:58px;white-space:nowrap">${fmtDate(t.date).slice(0, 5)}</td><td>${esc(t.desc)}<div class="muted" style="font-size:12px">${esc(t.cat)}</div></td><td class="r num amount neg">${signed(t.amount)}</td></tr>`).join("")}</tbody></table></div></section>`;
    const catRows = r.cats.map(c => `<div class="close-row"><span>${esc(c.cat)}</span><span class="muted num">${eur0(c.now)} <small>i.p.v. ±${eur0(c.avg)}</small></span><b class="num ${c.diff > 0 ? "neg" : "pos"}">${c.diff > 0 ? "▲ +" : "▼ −"}${eur0(Math.abs(c.diff))}${c.pct !== null ? ` <small>(${c.pct > 0 ? "+" : ""}${c.pct}%)</small>` : ""}</b></div>`).join("");
    const overRows = r.over.map(o => `<div class="close-row"><span>${esc(o.cat)}</span><span class="muted num">${eur0(o.spent)} <small>van ${eur0(o.available)}</small></span><b class="num neg">+${eur0(o.over)}</b></div>`).join("");
    const opvallend = `<section class="card"><div class="card-head"><h2>Wat viel op</h2><span class="hint">t.o.v. je gemiddelde</span></div>
      ${catRows || `<p class="muted" style="margin:0 0 6px">${r.prevMonths >= 2 ? "Geen grote verschillen met andere maanden." : "Nog te weinig maanden om te vergelijken."}</p>`}
      ${overRows ? `<h3 class="close-sub">Budget overschreden</h3>${overRows}` : ""}
      ${r.prices.length ? `<h3 class="close-sub">Duurder geworden</h3>${r.prices.map(p => `<div class="close-row"><span>${esc(p.title)}</span><span class="muted num">${eur(p.old)} → ${eur(p.now)}</span><b class="num neg">+${p.pct}%</b></div>`).join("")}` : ""}</section>`;
    const spaar = r.sav ? `<section class="card"><div class="card-head"><h2>Sparen</h2><a class="hint" href="#spaar">Naar Spaar</a></div>

    h += `<div class="grid-2"><div class="stack">${topCard}${todo}</div><div class="stack">${opvallend}${spaar}</div></div>`;
    return h;
  }

  function uncatCard(ym) {

    let h = `<section class="card" id="uncat"><div class="card-head"><h2>Nog te categoriseren</h2><span class="hint">Gegroepeerd per winkel of persoon. Eén keuze geldt voor de hele groep en wordt onthouden.</span></div>`;

  }
  function setGroup(key, cat, ym) {

  /* ---------- prijsstijgingen ---------- */
  function priceNotice() {

    // op een smal scherm ingeklapt tot één regel (tik om te openen)
    if (narrow()) return `<details class="notice warn fold"><summary>⚠ ${list.length} prijsstijging${list.length === 1 ? "" : "en"} <span class="fold-hint">tik om te zien</span></summary>${rows}</details>`;
    return `<div class="notice warn" style="flex-direction:column;align-items:stretch;gap:6px"><b style="font-family:var(--font-display);letter-spacing:.08em;text-transform:var(--case-ui);font-size:12px">⚠ Duurder geworden</b>${list.slice(0, 5).map(p => `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span>${esc(p.title)}: <span class="num">${eur(p.old)}</span> → <b class="num neg">${eur(p.now)}</b> (+${p.pct}%) sinds ${fmtDate(p.date)}</span><button class="btn small ghost" data-act="price-ok" data-key="${esc(p.key)}" type="button">Gezien</button></div>`).join("")}</div>`;
  }

  /* ---------- saldoverwachting ---------- */
  // van welke rekening een planner-item (of herkende betaling) betaald wordt; standaard de eerste zichtrekening
  function planAcc(pl) { const z = zichtList(state); const a = pl && pl.account ? accKey(state, pl.account) : ""; return z.find(k => sameAcc(k, a)) || z[0] || ""; }
  function accWarn(acc) { const a = acc && state.accounts[acc]; const w = a && a.warn !== undefined && a.warn !== null ? a.warn : state.warnBelow; return +(w ?? 0); }
  // acc leeg = alle rekeningen samen (zoals vroeger, o.a. voor de gsm-samenvatting)
  function forecast(days, acc) {
    const t = todayS(), b = balanceAt(state, t.slice(0, 7)), per = acc ? b.per.find(x => sameAcc(x.account, acc)) : null;
    if (acc ? !per : !b.set) return null;
    const startBal = acc ? per.value : b.total;
    const items = agenda(state, addD(t, -10), addD(t, days), true).filter(it => !it.paid && !(it.plan.auto && it.date < t) && !(it.date < t && !it.plan.auto && it.date < addD(t, -10)) && (!acc || sameAcc(planAcc(it.plan), acc)));
    const pts = [{ date: t, value: startBal, items: [] }]; let v = startBal;
    const byDate = new Map(); for (const it of items) { const d = it.date < t ? t : it.date; if (!byDate.has(d)) byDate.set(d, []); byDate.get(d).push(it); }
    for (let d = t; d <= addD(t, days); d = addD(d, 1)) {
      const its = byDate.get(d) || []; for (const it of its) v += (it.plan.kind === "inkomst" ? 1 : -1) * (+it.plan.amount || 0);
      if (d === t) { pts[0].value = Math.round(v * 100) / 100; pts[0].items = its; } else pts.push({ date: d, value: Math.round(v * 100) / 100, items: its });
    }
    const low = pts.reduce((m, p) => p.value < m.value ? p : m, pts[0]);
    const nextInc = items.find(it => it.plan.kind === "inkomst" && it.date > t && it.plan.amount > 300);
    return { pts, low, start: startBal, nextInc, end: pts[pts.length - 1].value };
  }
  /* ---------- grafieken (stap 9a): één kaart met keuzeknoppen ---------- */
  const CHART_VIEWS = [["saldo", "Saldoverwachting"], ["vermogen", "Vermogen"], ["cat", "Per categorie"], ["inuit", "Inkomen & uitgaven"]];
  const CAT_COLORS = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5, var(--pos))"], MAX_CHART_CATS = CAT_COLORS.length;
  // keuze per toestel (zoals het thema), niet in de back-up
  function chartPref() { try { return JSON.parse(prefGet(KEY + ".chart") || "{}") || {}; } catch (e) { return {}; } }
  function setChartPref(p) { prefSet(KEY + ".chart", JSON.stringify({ ...chartPref(), ...p })); }
  const axisK = v => Math.abs(v) >= 1000 ? (v / 1000).toLocaleString("nl-BE") + "k" : String(Math.round(v * 100) / 100);
  // gemeenschappelijk kader: breedte, schaal en rasterlijnen
  function chartBox(vals, H0) {
    const wide = !narrow(), W = wide ? 1100 : 520, H = H0 || (wide ? 230 : 180), L = 48, R = 8, T = 14, B = 22, iw = W - L - R, ih = H - T - B;
    const mx = Math.max(...vals, 0), mn = Math.min(...vals, 0), step = niceStep((mx - mn || 1) / 3);
    const top = Math.ceil(mx / step) * step || step, bot = Math.floor(mn / step) * step, y = v => T + (top - v) / (top - bot || 1) * ih;
    let grid = ""; for (let k = 0, v = bot; v <= top + 1e-9; k++, v = bot + k * step)
      grid += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"${Math.abs(v) < 1e-9 ? ' style="stroke:var(--muted)"' : ""}/><text x="${L - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${axisK(v)}</text>`;
    return { wide, W, H, L, R, T, B, iw, ih, y, grid, top, bot };
  }
  function chartCatsNow() { return [...document.querySelectorAll('[data-act="chart-cat-del"]')].map(b => b.dataset.cat); }
  function chartsCard() {
    const p = chartPref(), v = CHART_VIEWS.some(x => x[0] === p.view) ? p.view : "saldo";
    const body = v === "vermogen" ? netWorthBody() : v === "cat" ? chartCats(p) : v === "inuit" ? chartInOut() : chartSaldo(p);
    return `<section class="card chart charts"><div class="card-head"><h2>Grafieken</h2><div class="seg chart-seg" role="group" aria-label="Soort grafiek">${CHART_VIEWS.map(([k, n]) => `<button type="button" data-act="chart-view" data-v="${k}" aria-pressed="${k === v}">${n}</button>`).join("")}</div></div>${body}</section>`;
  }

  // Saldoverwachting: één lijn per zichtrekening (in de kleur van de rekening), optioneel alles samen
  function chartSaldo(p) {
    const days = 45, z = zichtList(state), multi = multiAcc(), hide = new Set(p.hide || ["*"]);
    const want = multi ? [...z.filter(a => !hide.has(a)), ...(hide.has("*") ? [] : ["*"])] : [z[0] || ""];
    const series = [], missing = [];
    for (const a of want) {
      const f = forecast(days, a === "*" ? "" : a);
      if (!f) { if (a !== "*") missing.push(a); continue; }
      series.push({ acc: a, f, name: a === "*" ? "Alles samen" : multi ? accName(state, a) : "Saldo", color: a === "*" ? "var(--gold)" : multi ? accColor(a) : "var(--accent)", warn: a === "*" ? null : accWarn(a) });
    }
    const chips = multi ? `<div class="acc-pick chart-chips" role="group" aria-label="Rekeningen tonen">${[...z, "*"].map(a => `<button type="button" data-act="chart-acc" data-acc="${esc(a)}" aria-pressed="${!hide.has(a)}" style="--c:${a === "*" ? "var(--gold)" : accColor(a)}"><i></i>${esc(a === "*" ? "Alles samen" : accName(state, a))}</button>`).join("")}</div>` : "";
    const miss = missing.length ? `<p class="muted" style="margin:6px 0 0;font-size:13px">Geen startsaldo voor ${missing.map(a => esc(accName(state, a))).join(", ")}: vul het in bij <a class="hint" href="#profiel">Profiel</a>.</p>` : "";
    if (!series.length) return chips + (multi && !want.length ? `<p class="muted">Kies hierboven minstens één rekening.</p>` : miss || `<p class="muted" style="margin:0">Vul het startsaldo in bij <a class="hint" href="#profiel">Profiel</a>, dan berekent de planner hoe het saldo de komende weken evolueert.</p>`);
    const warns = [...new Map(series.filter(x => x.warn !== null).map(x => [x.warn, x])).values()];
    const cb = chartBox([...series.flatMap(x => x.f.pts.map(q => q.value)), ...warns.map(x => x.warn)]), { W, H, L, R, T, iw, ih, y } = cb, n = series[0].f.pts.length;
    const x = i => L + i / (n - 1) * iw;
    let g = cb.grid;
    for (const w of warns) g += `<line x1="${L}" x2="${W - R}" y1="${y(w.warn)}" y2="${y(w.warn)}" stroke="var(--neg)" stroke-dasharray="4 4" opacity=".8"/><text x="${W - R}" y="${y(w.warn) - 4}" text-anchor="end" style="fill:var(--neg)">grens ${eur0(w.warn)}${warns.length > 1 ? " · " + esc(w.name) : ""}</text>`;
    for (const sr of series) {
      const pts = sr.f.pts; let d = `M${x(0)},${y(pts[0].value).toFixed(1)}`; pts.forEach((q, i) => { if (i) d += `H${x(i).toFixed(1)}V${y(q.value).toFixed(1)}`; });
      g += `<path d="${d}" fill="none" stroke="${sr.color}" stroke-width="2"${sr.acc === "*" ? ' stroke-dasharray="6 4"' : ""} style="filter:drop-shadow(0 0 5px ${sr.color})"/>`;
      pts.forEach((q, i) => { if (q.items.length) g += `<circle cx="${x(i)}" cy="${y(q.value).toFixed(1)}" r="2.5" fill="${sr.color}"/>`; });
      const li = pts.indexOf(sr.f.low), bad = sr.warn !== null && sr.f.low.value < sr.warn;
      g += `<circle cx="${x(li)}" cy="${y(sr.f.low.value).toFixed(1)}" r="4.5" fill="${bad ? "var(--neg)" : sr.color}" stroke="var(--bg)" stroke-width="1.5"/>`;
    }
    for (let i = 0; i < n; i++) {
      const tip = `<b>${fmtDate(series[0].f.pts[i].date)}</b>` + series.map(sr => { const q = sr.f.pts[i]; return `<br>${esc(sr.name)}: ${eur(q.value)}${q.items.map(it => `<br>&nbsp; ${it.plan.kind === "inkomst" ? "+" : "−"}${eur(it.plan.amount || 0)} ${esc(it.plan.title)}`).join("")}`; }).join("");
      g += `<rect x="${(x(i) - iw / n / 2).toFixed(1)}" y="${T}" width="${(iw / n).toFixed(1)}" height="${ih}" fill="transparent" data-tip="${esc(tip)}"/>`;
    }
    (cb.wide ? [0, 7, 14, 21, 28, 35, 45] : [0, 15, 30, 45]).forEach(i => { if (i < n) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}">${i === 0 ? "vandaag" : fmtDate(series[0].f.pts[i].date).slice(0, 5)}</text>`; });
    const stats = series.map(sr => { const bad = sr.warn !== null && sr.f.low.value < sr.warn;
      return `<span>${multi ? `<i class="acc-mini" style="--c:${sr.color}"></i>${esc(sr.name)} ` : ""}nu <b class="num ${sr.f.start < 0 ? "neg" : "gold"}">${eur(sr.f.start)}</b> · laagste <b class="num ${bad ? "neg" : ""}">${eur(sr.f.low.value)}</b> <span class="muted">op ${fmtDate(sr.f.low.date).slice(0, 5)}</span>${bad ? ` <span class="fc-warn">⚠ onder ${eur0(sr.warn)}</span>` : ""}</span>`; }).join("");
    return `${chips}<div class="fc-stats" style="margin-top:8px">${stats}</div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verwacht saldo per rekening, komende ${days} dagen">${g}</svg>${miss}
      <div class="legend"><span class="muted">Komende ${days} dagen · planner + herkende vaste betalingen · grens per rekening <a class="hint" href="#profiel">in Profiel</a></span><a class="hint" href="#planner">Planner</a></div>`;
  }

  // Uitgaven (of inkomsten) per categorie, per maand (12 maanden tot de gekozen maand) of per jaar
  function chartCats(p) {
    const mode = p.catMode === "jaar" ? "jaar" : "maand", cats = mainCats(state).filter(c => c.type !== "Overboeking");
    const ms = new Map(), sum = ym => { if (!ms.has(ym)) ms.set(ym, monthSummary(state, ym)); return ms.get(ym).byCat; };
    let periods;
    if (mode === "maand") { periods = []; for (let i = 11; i >= 0; i--) { const ym = shiftMonth(ui.month, -i); periods.push({ key: ym, label: monthShort(ym), tip: monthName(ym), yms: [ym] }); } }
    else { const ys = state.transactions.map(t => +t.date.slice(0, 4)), y0 = Math.min(...ys), y1 = Math.max(...ys); periods = [];
      for (let yy = Math.max(y0, y1 - 7); yy <= y1; yy++) periods.push({ key: String(yy), label: String(yy), tip: String(yy), yms: Array.from({ length: 12 }, (_, i) => `${yy}-${String(i + 1).padStart(2, "0")}`) }); }
    const val = (c, per) => { const tot = per.yms.reduce((a, ym) => a + (sum(ym)[c.name] || 0), 0); return Math.round((c.type === "Inkomen" ? tot : -tot) * 100) / 100; };
    let sel = (p.cats || []).map(nm => cats.find(c => c.name === nm)).filter(Boolean);
    if (!p.cats) {   // standaard: de 3 grootste uitgavenposten van de getoonde periode
      sel = cats.filter(c => c.type === "Vaste kosten" || c.type === "Variabele kosten").map(c => ({ c, t: periods.reduce((a, per) => a + val(c, per), 0) })).filter(x => x.t > 0).sort((a, b) => b.t - a.t).slice(0, 3).map(x => x.c);
    }
    const color = i => CAT_COLORS[i % CAT_COLORS.length];
    const avg = (c) => { const filled = periods.filter(per => per.yms.some(ym => ms.get(ym) && ms.get(ym).count)); const t = periods.reduce((a, per) => a + val(c, per), 0); return filled.length ? t / filled.length : 0; };
    const free = cats.filter(c => !sel.includes(c));
    const controls = `<div class="chart-ctl"><div class="seg" role="group" aria-label="Per maand of per jaar"><button type="button" data-act="chart-catmode" data-v="maand" aria-pressed="${mode === "maand"}">Per maand</button><button type="button" data-act="chart-catmode" data-v="jaar" aria-pressed="${mode === "jaar"}">Per jaar</button></div>
      <div class="acc-pick chart-chips">${sel.map((c, i) => `<button type="button" data-act="chart-cat-del" data-cat="${esc(c.name)}" aria-pressed="true" style="--c:${color(i)}" title="Weghalen uit de grafiek"><i></i>${esc(c.name)} <span class="muted">×</span></button>`).join("")}
      ${sel.length < MAX_CHART_CATS && free.length ? `<select class="cat chart-add" data-act="chart-cat-add" aria-label="Categorie toevoegen"><option value="">+ categorie</option>${free.map(c => `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join("")}</select>` : ""}</div></div>`;
    if (!sel.length) return controls + `<p class="muted">Kies een categorie om te zien hoeveel er ${mode === "maand" ? "per maand" : "per jaar"} naartoe gaat.</p>`;
    const data = periods.map(per => sel.map(c => val(c, per)));
    const cb = chartBox(data.flat()), { W, H, L, T, iw, ih, y } = cb, gw = iw / periods.length, bw = Math.max(3, Math.min(22, (gw * .78) / sel.length));
    let g = cb.grid;
    periods.forEach((per, i) => {
      const x0 = L + gw * i + (gw - bw * sel.length) / 2;
      data[i].forEach((v, k) => { const yv = y(Math.max(v, 0)), h = Math.abs(y(v) - y(0)); if (h > 0.2) g += v >= 0 ? `<path d="${roundTop(x0 + k * bw + .5, yv, bw - 1, h, 3)}" fill="${color(k)}"/>` : `<rect x="${x0 + k * bw + .5}" y="${y(0)}" width="${bw - 1}" height="${h}" fill="${color(k)}" opacity=".5"/>`; });
      const cur = mode === "maand" ? per.key === ui.month : false;
      if (cb.wide || mode === "jaar" || i % 2 === (periods.length - 1) % 2) g += `<text x="${L + gw * i + gw / 2}" y="${H - 6}" text-anchor="middle"${cur ? ' style="fill:var(--ink);font-weight:600"' : ""}>${per.label}</text>`;
      const tip = `<b>${esc(per.tip)}</b>` + sel.map((c, k) => `<br>${esc(c.name)}: ${eur(data[i][k])}`).join("") + (sel.length > 1 ? `<br>Samen: ${eur(data[i].reduce((a, v) => a + v, 0))}` : "");
      g += `<rect class="hit" x="${L + gw * i}" y="${T}" width="${gw}" height="${ih}" fill="transparent" data-tip="${esc(tip)}"${mode === "maand" ? ` data-act="goto-month" data-month="${per.key}" style="cursor:pointer"` : ""}/>`;
    });
    return `${controls}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bedrag per categorie ${mode === "maand" ? "per maand" : "per jaar"}">${g}</svg>
      <div class="legend">${sel.map((c, i) => `<span><i style="background:${color(i)}"></i>${esc(c.name)} · gem. <b class="num">${eur0(avg(c))}</b>/${mode === "maand" ? "maand" : "jaar"}</span>`).join("")}</div>`;
  }

  // Inkomen en uitgaven per maand (12 maanden tot de gekozen maand), met wat je overhoudt als lijn
  function chartInOut() {
    const months = []; for (let i = 11; i >= 0; i--) months.push(shiftMonth(ui.month, -i));
    const data = months.map(m => { const s = monthSummary(state, m); return { m, inc: s.income, exp: s.expenses + Math.max(0, -s.uncat), net: s.net }; });
    const cb = chartBox(data.flatMap(d => [d.inc, d.exp, d.net])), { W, H, L, T, iw, ih, y } = cb, gw = iw / months.length, bw = Math.min(18, gw / 3.2);
    let g = cb.grid, line = "";
    data.forEach((d, i) => {
      const cx = L + gw * i + gw / 2, bar = (bx, v, col) => v > 0 ? `<path d="${roundTop(bx, y(v), bw, y(0) - y(v), 3)}" fill="${col}"${d.m === ui.month ? "" : ' opacity=".6"'}/>` : "";
      g += bar(cx - bw - 1, d.inc, "var(--pos)") + bar(cx + 1, d.exp, "var(--neg)");
      line += (i ? "L" : "M") + cx.toFixed(1) + "," + y(d.net).toFixed(1);
      if (cb.wide || i % 2 === 1) g += `<text x="${cx}" y="${H - 6}" text-anchor="middle"${d.m === ui.month ? ' style="fill:var(--ink);font-weight:600"' : ""}>${monthShort(d.m)}</text>`;
    });
    g += `<path d="${line}" fill="none" stroke="var(--gold)" stroke-width="2" style="filter:drop-shadow(0 0 4px var(--gold))"/>` + data.map((d, i) => `<circle cx="${(L + gw * i + gw / 2).toFixed(1)}" cy="${y(d.net).toFixed(1)}" r="3" fill="${d.net >= 0 ? "var(--gold)" : "var(--neg)"}"/>`).join("");
    data.forEach((d, i) => { g += `<rect class="hit" x="${L + gw * i}" y="${T}" width="${gw}" height="${ih}" fill="transparent" data-tip="${esc(`<b>${esc(monthName(d.m))}</b><br>Inkomsten: ${eur(d.inc)}<br>Uitgaven: ${eur(d.exp)}<br>Over: ${signed(d.net)}`)}" data-act="goto-month" data-month="${d.m}" style="cursor:pointer"/>`; });
    const tot = data.reduce((a, d) => ({ inc: a.inc + d.inc, exp: a.exp + d.exp }), { inc: 0, exp: 0 });
    return `<div class="fc-stats"><span>12 maanden: in <b class="num pos">${eur0(tot.inc)}</b></span><span>uit <b class="num neg">${eur0(tot.exp)}</b></span><span>over <b class="num ${tot.inc - tot.exp >= 0 ? "gold" : "neg"}">${tot.inc - tot.exp >= 0 ? "+" : "−"}${eur0(Math.abs(tot.inc - tot.exp))}</b></span></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Inkomsten en uitgaven per maand">${g}</svg>
      <div class="legend"><span><i style="background:var(--pos)"></i>Inkomsten</span><span><i style="background:var(--neg)"></i>Uitgaven (incl. te categoriseren)</span><span><i style="background:var(--gold)"></i>Overgehouden</span><span class="muted">Klik op een maand</span></div>`;
  }

  /* ---------- vermogen ---------- */
  function netWorthAt(end) {
    const ym = end.slice(0, 7);
    const zb = balanceAt(state, ym), zicht = zb.set ? zb.total : 0;

  /* algemene staafgrafiek (één as, ook negatieve waarden) */

    });

  function splitDialog(t) {

      d.querySelector("#sp-rows").addEventListener("change", e => { const r = e.target.closest(".split-row"); if (r && e.target.dataset.f === "cat") parts[+r.dataset.i].cat = e.target.value; });

  function viewBudget() {

    h += `<section class="kpis">${BUDGET_TYPES.map(t => `<div class="kpi" style="--k:${t === "Inkomen" ? "var(--pos)" : t === "Sparen" ? "var(--accent)" : "var(--neg)"}"><div class="label">${t}</div><div class="value num">${eur0(sum(t))}</div><div class="sub">per maand · ${eur0(sum(t) * 12)} per jaar</div></div>`).join("")}</section>`;
    h += `<div class="notice ${left < 0 ? "warn" : "info"}"><span>${left >= 0 ? `Nog te verdelen: <b class="num">${eur(left)}</b> per maand.` : `Je plant <b class="num">${eur(-left)}</b> meer uit te geven dan je verdient.`}</span></div>`;

      <div class="toolbar" style="margin:0"><label for="roll-from" class="muted">Meenemen vanaf</label><input class="input" type="month" id="roll-from" data-act="roll-from" value="${esc(state.rolloverFrom || (new Date().getFullYear() + "-01"))}" style="color-scheme:dark">
      <span class="muted" style="font-size:12.5px">${rolloverStart(state) ? `Er wordt gerekend vanaf <b style="text-transform:capitalize">${esc(monthName(rolloverStart(state)))}</b>. Daarvoor wordt niets overgedragen.` : ""}</span></div></section>`;
    h += balanceCard();
    h += `<section class="card"><div class="table-wrap"><table id="cat-table" class="budget-table"><thead><tr><th style="width:62px" title="Sleep of gebruik de pijltjes om de volgorde te wijzigen">Volg&shy;orde</th><th>Categorie</th><th>Type</th><th class="r">Budget / maand</th><th class="r">Budget / jaar</th><th title="Wat overblijft (of te veel is) gaat mee naar de volgende maand" style="text-align:center">Mee&shy;nemen</th><th class="r">Over&shy;gedragen</th><th class="r">Beschik&shy;baar</th><th class="r">Werke&shy;lijk</th><th class="r">Ver&shy;schil</th><th></th></tr></thead><tbody>`;
    const env = envelopes(state, ui.month);
    state.categories.forEach((c, i) => {
      if (parentOf(state, c.name)) return;   // subcategorie: staat op het blad van haar deelbudget
      const raw = s.byCat[c.name] || 0, actual = c.type === "Inkomen" || c.type === "Overboeking" ? raw : -raw;
      const e = env[c.name], isExp = !!e;
      const mb = monthlyBudget(c);
      const b = isExp ? e.available : mb, diff = mb ? (c.type === "Inkomen" || c.type === "Sparen" ? actual - b : b - actual) : null;
      h += `<tr data-i="${i}" class="cat-drag-row"><td class="ord"><span class="drag-handle" draggable="true" title="Sleep om te verplaatsen" aria-hidden="true">⋮⋮</span><span class="ord-btns"><button class="btn small ghost" data-act="cat-up" type="button" aria-label="Omhoog" ${i ? "" : "disabled"}>▲</button><button class="btn small ghost" data-act="cat-down" type="button" aria-label="Omlaag" ${i < state.categories.length - 1 ? "" : "disabled"}>▼</button></span></td><td><input class="cell wide" data-act="cat-name" value="${esc(c.name)}" aria-label="Naam"></td>
        <td><select class="cat" data-act="cat-type" aria-label="Type">${TYPES.map(t => `<option${t === c.type ? " selected" : ""}>${t}</option>`).join("")}</select>${c.group ? `<div style="margin-top:3px"><a class="chip" href="#grp-${esc(c.name.replace(/\W+/g, "-"))}" title="Naar het blad van dit deelbudget">⑃ deelbudget</a></div>` : ""}</td>
        <td class="r"><input class="cell r num" data-act="cat-budget" inputmode="decimal" placeholder="${+c.budgetYear > 0 && !(+c.budget > 0) ? "≈" + Math.round(c.budgetYear / 12) : "—"}" value="${c.budget ?? ""}" aria-label="Budget per maand" title="${+c.budgetYear > 0 ? `Totaal per maand: ${eur(mb)} (incl. jaarbudget ÷ 12)` : ""}"></td>
        <td class="r"><input class="cell r num" data-act="cat-budget-year" inputmode="decimal" placeholder="—" value="${c.budgetYear ?? ""}" aria-label="Budget per jaar"></td>
        <td style="text-align:center">${isExp ? `<input type="checkbox" data-act="cat-roll" ${rolls(c) ? "checked" : ""} aria-label="Overschot meenemen voor ${esc(c.name)}">` : ""}</td>
        <td class="r num ${isExp && e.roll && e.carryIn ? (e.carryIn > 0 ? "pos" : "neg") : "muted"}">${isExp && e.roll && mb ? signed(e.carryIn) : "—"}</td>
        <td class="r num">${isExp && mb ? eur(e.available) : (mb ? eur(mb) : "—")}</td>
        <td class="r num">${eur(actual)}</td>
        <td class="r num ${diff === null ? "muted" : diff >= 0 ? "pos" : "neg"}">${diff === null ? "—" : signed(diff)}</td>
        <td class="r"><button class="btn small ghost" data-act="del-cat" type="button" aria-label="Verwijderen" title="Verwijderen">✕</button></td></tr>`;
    });
    h += `</tbody></table></div><div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="add-cat" type="button">+ Categorie toevoegen</button><button class="btn" data-act="grp-add" type="button" title="Een bedrag dat je zelf verder verdeelt, bv. een gezamenlijk budget">⑃ + Deelbudget</button></div></section>`;
    h += state.categories.filter(c => c.group && !parentOf(state, c.name)).map(g => groupCard(g, s, env, true)).join("");
    return h;
  }

  function groupCard(g, s, env, edit) {
    const subs = subsOf(state, g.name), gb = monthlyBudget(g), dist = Math.round(subs.reduce((a, c) => a + monthlyBudget(c), 0) * 100) / 100, rest = Math.round((gb - dist) * 100) / 100;
    const spent = n => Math.max(0, -(s.byCatRaw[n] || 0)), direct = spent(g.name), ge = env[g.name], tot = ge ? ge.spent : spent(g.name) + subs.reduce((a, c) => a + spent(c.name), 0);
    const row = c => { const i = state.categories.indexOf(c), e = env[c.name], av = e ? e.available : monthlyBudget(c), sp = spent(c.name), left = Math.round((av - sp) * 100) / 100, pct = av > 0 ? Math.min(1, sp / av) : (sp > 0 ? 1 : 0);
      return edit ? `<tr data-i="${i}"><td><input class="cell wide" data-act="cat-name" value="${esc(c.name)}" aria-label="Naam subcategorie"></td>
          <td class="r"><input class="cell r num" data-act="cat-budget" inputmode="decimal" placeholder="—" value="${c.budget ?? ""}" aria-label="Budget per maand"></td>
          <td style="min-width:120px"><span class="track" style="display:block"><span class="fill${left < 0 ? " over" : ""}" style="width:${(pct * 100).toFixed(1)}%"></span></span></td>
          <td class="r num">${eur(sp)}</td><td class="r num ${left < 0 ? "neg" : "pos"}">${av ? signed(left) : "—"}</td>
          <td class="r"><button class="btn small ghost" data-act="del-cat" type="button" aria-label="Verwijderen" title="Verwijderen">✕</button></td></tr>`
        : `<div class="cat-row"><span class="name">${esc(c.name)}</span><span class="track"><span class="fill${left < 0 ? " over" : ""}" style="width:${(pct * 100).toFixed(1)}%"></span></span><span class="amt num">${eur0(sp)}${av ? `<span class="muted"> / ${eur0(av)}</span>` : ""}</span></div>`; };
    const foot = `<div class="pl-sum" style="margin-top:10px"><span>Verdeeld <b class="num">${eur(dist)}</b> van <b class="num">${eur(gb)}</b></span>${rest >= 0 ? `<span>Nog te verdelen <b class="num gold">${eur(rest)}</b></span>` : `<span class="neg">⚠ <b class="num">${eur(-rest)}</b> te veel verdeeld</span>`}<span>Uitgegeven <b class="num ${ge && tot > ge.available ? "neg" : ""}">${eur(tot)}</b>${ge ? ` van ${eur(ge.available)}` : ""}</span></div>`;
    const id = "grp-" + g.name.replace(/\W+/g, "-");
    if (!edit) return `<section class="card" id="${esc(id)}"><div class="card-head"><h2>⑃ ${esc(g.name)}</h2><a class="hint" href="#budget">Deelbudget</a></div>${subs.length ? `<div class="cats">${subs.map(row).join("")}${direct ? `<div class="cat-row"><span class="name muted">rechtstreeks</span><span class="track"></span><span class="amt num">${eur0(direct)}</span></div>` : ""}</div>` : `<p class="muted" style="margin:0">Nog geen subcategorieën.</p>`}${foot}</section>`;
    return `<section class="card" id="${esc(id)}"><div class="card-head"><h2>⑃ Deelbudget ${esc(g.name)}</h2><span class="hint">Verdeel ${eur(gb)} per maand over eigen subcategorieën. Uitgaven op een subcategorie tellen hier én in de regel “${esc(g.name)}” van je hoofdbudget.</span></div>
      <div class="table-wrap"><table><thead><tr><th>Subcategorie</th><th class="r">Budget/maand</th><th></th><th class="r">Uitgegeven</th><th class="r">Resterend</th><th></th></tr></thead><tbody>
      ${subs.map(row).join("")}${direct ? `<tr><td class="muted">Rechtstreeks op “${esc(g.name)}”</td><td></td><td></td><td class="r num">${eur(direct)}</td><td></td><td></td></tr>` : ""}
      ${subs.length ? "" : `<tr class="empty-row"><td colspan="6">Nog geen subcategorieën. Voeg er een toe.</td></tr>`}</tbody></table></div>
      ${foot}<div style="margin-top:12px"><button class="btn" data-act="sub-add" data-parent="${esc(g.name)}" type="button">+ Subcategorie</button></div></section>`;
  }
  function groupAddDialog() {

      <label for="ga-from">Van</label><select class="input" id="ga-from"><option value="">Nieuwe categorie</option>${conv.map(c => `<option>${esc(c.name)}</option>`).join("")}</select>

  function groupCards(s) { const env = envelopes(state, ui.month); return mainCats(state).filter(c => c.group).map(g => groupCard(g, s, env, false)).join(""); }

  function balanceCard() {
    const accs = accounts(state);
    if (!accs.length) return "";
    const oldest = acc => { const d = state.transactions.filter(t => t.account === acc).map(t => t.date).sort()[0]; const x = new Date(d); x.setDate(x.getDate() - 1); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };

    const bal = balanceAt(state, ui.month);
    for (const acc of accs) {

      const p = bal.per.find(x => x.account === acc);

    }
